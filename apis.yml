aid: moloco
name: MOLOCO
description: >-
  Moloco is a machine-learning advertising company that operates three developer-facing platforms: Moloco Ads
  (a performance demand-side platform for app marketers), Moloco Commerce Media / MCM (a retail-media platform
  that lets marketplaces and retailers run sponsored product, brand, display and reserved-display ads on their
  own inventory), and Moloco Streaming Monetization. Its public API surface spans a Campaign Management API and
  a Cloud Auth API on api.moloco.cloud for the DSP side, plus MCM Management, Decision, Event and Webhook APIs
  on mcm-api.moloco.com for the commerce-media side, covering ad accounts, products, campaigns, ad groups,
  creatives, audience targets, catalog items, wallets, spending limits, reporting, log export, real-time ad
  decisioning and first-party user-event ingestion.
