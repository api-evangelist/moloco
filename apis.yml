apis:
- name: Moloco Ads Campaign Management API
  description: >-
    REST API for creating and managing Moloco Ads (Cloud DSP) campaigns — ad accounts, products, tracking links,
    campaigns, ad groups, creatives, creative groups, audience targets and customer sets — plus analytics,
    cohort summaries, reports, report exports and impression/click/conversion log generation. Versioned via the
    Moloco-Cloud-Api-Version header; bearer token issued from an API key.
  humanURL: https://developer.moloco.cloud/docs/campaign-management-api
  baseURL: https://api.moloco.cloud
  tags:
  - advertising
  - demand-side-platform
  - campaign-management
  - reporting
  - ad-serving
  properties:
  - type: OpenAPI
    url: openapi/moloco-ads-campaign-management-openapi.yml
  - type: Documentation
    url: https://developer.moloco.cloud/docs/campaign-management-api
  - type: APIReference
    url: https://developer.moloco.cloud/reference/dspapi_listadaccounts-1
  - type: Overlay
    url: overlays/moloco-ads-campaign-management-overlay.yaml
- name: Moloco Cloud Auth API
  description: >-
    Authentication and authorization API for Moloco Cloud — issues bearer access tokens from an API key and
    manages workplaces, userspaces, users, passwords, role grants, permissions and ad-account registrations.
    Access tokens are valid for 16 hours.
  humanURL: https://developer.moloco.cloud/docs/auth
  baseURL: https://api.moloco.cloud
  tags:
  - authentication
  - authorization
  - user-management
  properties:
  - type: OpenAPI
    url: openapi/moloco-cloud-auth-openapi.yml
  - type: Documentation
    url: https://developer.moloco.cloud/docs/auth
  - type: Overlay
    url: overlays/moloco-cloud-auth-overlay.yaml
- name: Moloco Commerce Media Management API
  description: >-
    REST API for retail-media platform operators to manage ad manager accounts, ad accounts, campaigns,
    sponsored product/brand/display and reserved-display line items, image and video assets, custom targeting
    keys and values, campaign reviews, spend caps, spending limits, credits, wallets, change history, item kill
    switch, data-export key rotation and user data deletion requests, plus reporting and forecasting.
  humanURL: https://mcm-docs.moloco.com/docs/campaign-management
  baseURL: https://sandbox-mgmt.mcm-api.moloco.com
  tags:
  - retail-media
  - commerce-media
  - campaign-management
  - reporting
  - billing
  properties:
  - type: OpenAPI
    url: openapi/moloco-commerce-media-management-openapi.yml
  - type: Documentation
    url: https://mcm-docs.moloco.com/docs/campaign-management
  - type: APIReference
    url: https://mcm-docs.moloco.com/reference/rmpmanagementapi_listadaccounts
  - type: Overlay
    url: overlays/moloco-commerce-media-management-overlay.yaml
- name: Moloco Commerce Media Decision API
  description: >-
    Real-time ad decisioning API for retail media — request sponsored product, display, brand and reserved
    display ads for a given page/placement and user context, returning the ads to render together with
    impression and click tracker URLs. Latency-sensitive serving path, authenticated with a platform API key.
  humanURL: https://mcm-docs.moloco.com/docs/ad-serving-and-tracking
  baseURL: https://sandbox-dcsn.mcm-api.moloco.com
  tags:
  - retail-media
  - ad-serving
  - real-time-bidding
  properties:
  - type: OpenAPI
    url: openapi/moloco-commerce-media-decision-openapi.yml
  - type: Documentation
    url: https://mcm-docs.moloco.com/docs/ad-serving-and-tracking
  - type: APIReference
    url: https://mcm-docs.moloco.com/reference/rmpdecisionapi_decideadproducts
  - type: Overlay
    url: overlays/moloco-commerce-media-decision-overlay.yaml
- name: Moloco Commerce Media Event API
  description: >-
    First-party user-event ingestion API — posts real-time shopper events (home, page view, item view, search,
    add to cart, purchase and more) from a retailer's site or app into Moloco Commerce Media so the models can
    source and score ads. One operation, PostUserEvent, authenticated with a platform API key.
  humanURL: https://mcm-docs.moloco.com/docs/send-user-events-to-moloco-commerce-media
  baseURL: https://sandbox-evt.mcm-api.moloco.com
  tags:
  - retail-media
  - user-events
  - data-ingestion
  properties:
  - type: OpenAPI
    url: openapi/moloco-commerce-media-event-openapi.yml
  - type: Documentation
    url: https://mcm-docs.moloco.com/docs/send-user-events-to-moloco-commerce-media
  - type: APIReference
    url: https://mcm-docs.moloco.com/reference/rmpeventapi_postuserevent
  - type: Overlay
    url: overlays/moloco-commerce-media-event-overlay.yaml
- name: Moloco Commerce Media Webhooks
  description: >-
    Outbound webhook surface for Moloco Commerce Media, published as an OpenAPI 3.1 webhooks document. Moloco
    POSTs signed JSON deliveries to a platform-configured HTTPS endpoint for churned-ad-account re-engagement
    recommendations and high-budget-utilization upsell recommendations; the x-moloco-webhook-id header is the
    idempotency key.
  humanURL: https://mcm-docs.moloco.com/docs/campaign-management
  baseURL: https://sandbox-mgmt.mcm-api.moloco.com
  tags:
  - retail-media
  - webhooks
  - events
  properties:
  - type: OpenAPI
    url: openapi/moloco-commerce-media-webhooks-openapi.yml
  - type: Webhooks
    url: asyncapi/moloco-commerce-media-webhooks.yml
  - type: Overlay
    url: overlays/moloco-commerce-media-webhooks-overlay.yaml
