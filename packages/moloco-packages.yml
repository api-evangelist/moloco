note: >-
  Moloco ships two distinct package families: API client libraries for Moloco Commerce Media (published under
  the @moloco-rmp npm scope and the moloco-mcm GitHub org) and mobile ad SDKs for publishers/app developers
  (com.moloco.sdk on Maven Central, Swift Package Manager for iOS, Unity plugins). There is no first-party
  Python or Go client for the Moloco Ads Campaign Management API; the mcm-cli package is the CLI (see
  cli/moloco-cli.yml). The legacy CocoaPods "MolocoSDK" pod (2019, personally owned trunk account) is NOT
  recorded here as official.
currency_note: >-
  Every version below was re-read from the registry metadata endpoint on 2026-08-13. The 2026-07-31 round
  recorded the Android SDK at 3.11.0 (2025-06-26); that came from the search.maven.org solr index, which is
  stale for this group. The authoritative repo1.maven.org maven-metadata.xml reports 4.11.1 released
  2026-08-10 for BOTH com.moloco.sdk:moloco-sdk and com.moloco.sdk.adapters:moloco — a full major line ahead.
  The mobile ad SDKs are the freshest thing Moloco publishes (Android 4.11.1 and iOS v4.9.1 both landed
  2026-08-10, on a roughly two-week cadence). The API client libraries are materially older: the MCM Event
  API client last shipped 2025-08-29 and mcm-cli 2025-12-11, while @moloco-rmp/user-event-api-client has not
  been touched since 2021-12-03 and should be treated as abandoned in favour of the event-api-client.
