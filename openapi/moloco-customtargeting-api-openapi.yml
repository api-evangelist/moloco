  /rmp/mgmt/v1/platforms/{platform_id}/custom-target-keys:
    post:
      summary: QueryCustomTargetKeys
      description: Query all available custom target keys for the platform.
      operationId: RmpManagementApi_QueryCustomTargetKeys
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicQueryCustomTargetKeysResponse'
        '400':
          description: Bad request. Detailed cause can be found in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '404':
          description: Not found. One or more required resources do not exist.You can see the details in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '500':
          description: Internal server error. Detailed cause can be found in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
      parameters:
      - name: platform_id
        description: Identifier of the platform. It is passed as a path parameter.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cursor:
                  type: string
                  description: Cursor for pagination. Required after the first request.
                limit:
                  type: integer
                  format: int64
                  default: '15'
                  description: 'Number of items to be returned. Default: 15, Maximum value: 50'
                ad_type:
                  $ref: '#/components/schemas/rmpcommonAdType'
              description: QueryCustomTargetKeys public request. Query all available custom target keys for the platform.
              required:
              - ad_type
              additionalProperties: true
        required: true
      tags:
      - CustomTargeting
    servers:
    - url: https://<platform>-mgmt.mcm-api.moloco.com
  /rmp/mgmt/v1/platforms/{platform_id}/custom-target-keys/{custom_target_key_id}/custom-target-values:
    post:
      summary: QueryCustomTargetValues
      description: Query all available custom target values for a given key.
      operationId: RmpManagementApi_QueryCustomTargetValues
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicQueryCustomTargetValuesResponse'
        '400':
          description: Bad request. Detailed cause can be found in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '404':
          description: Not found. One or more required resources do not exist.You can see the details in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '500':
          description: Internal server error. Detailed cause can be found in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
      parameters:
      - name: platform_id
        description: Identifier of the platform. It is passed as a path parameter.
        in: path
        required: true
        schema:
          type: string
      - name: custom_target_key_id
        description: Identifier of the custom target key. It is passed as a path parameter.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                search:
                  type: string
                  description: Search keyword to filter custom target values by label. If provided, only values whose labels contain this keyword will be returned.
                cursor:
                  type: string
                  description: Cursor for pagination. Required after the first request.
                limit:
                  type: integer
                  format: int64
                  default: '15'
                  description: 'Number of items to be returned. Default: 15, Maximum value: 200'
              description: QueryCustomTargetValues public request. Query all available custom target values for a given key.
              additionalProperties: true
        required: true
      tags:
      - CustomTargeting
    servers:
    - url: https://<platform>-mgmt.mcm-api.moloco.com
components:
  schemas:
    publicQueryCustomTargetKeysResponse:
      type: object
      properties:
        custom_target_keys:
          type: array
          items:
            $ref: '#/components/schemas/v1CustomTargetKey'
          description: List of custom target keys matching the query criteria.
        prev_cursor:
          type: string
          description: Cursor for the previous page. Omitted if this is the first page.
        next_cursor:
          type: string
          description: Cursor for the next page. Omitted if this is the last page.
        total:
          type: integer
          format: int64
          description: Total number of custom target keys matching the query criteria.
      description: QueryCustomTargetKeys public response.
      required:
      - custom_target_keys
      - total
      additionalProperties: true
    RepresentedErrorDetail:
      type: object
      properties:
        type:
          type: string
          description: The type of the metadata.
        category:
          $ref: '#/components/schemas/commonErrorCategory'
        metadata:
          type: object
          description: The metadata of the responded error.
          additionalProperties: true
      required:
      - type
      - category
      additionalProperties: true
    v1CustomTargetValue:
      type: object
      properties:
        id:
          type: string
          description: The id of the custom target value.
        custom_target_key_id:
          type: string
          description: The id of the custom target key to which this value belongs.
        label:
          type: string
          description: The label of the custom target value.
        valid:
          type: boolean
          description: The validity of the custom target value.
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Created timestamp. API user should not touch this field; it is set internally.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Updated timestamp. Set internally during creation, but required during update. This should match the updated timestamp updated_at of the custom target value.
          readOnly: true
      description: Definition of a custom target value.
      required:
      - id
      - custom_target_key_id
      - label
      - valid
      - created_at
      - updated_at
      additionalProperties: true
    publicReadCustomTargetKeysBulkResponse:
      type: object
      properties:
        custom_target_keys:
          type: array
          items:
            $ref: '#/components/schemas/v1CustomTargetKey'
          description: Custom target keys.
      description: ReadCustomTargetKeysBulk response.
      required:
      - custom_target_keys
      additionalProperties: true
    publicQueryCustomTargetDailySummaryResponse:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/v1LineItemDailyCustomReportRow'
          description: List of daily report rows.
      description: QueryCustomTargetDailySummary response containing daily report rows.
      required:
      - rows
      additionalProperties: true
    rmpcommonAdType:
      type: string
      enum:
      - UNKNOWN_AD_TYPE
      - ITEM
      - BRAND
      - DISPLAY
      - RESERVED_DISPLAY
      default: UNKNOWN_AD_TYPE
    publicReadCustomTargetKeysWithCustomReportBulkResponse:
      type: object
      properties:
        custom_target_keys:
          type: array
          items:
            $ref: '#/components/schemas/v1CustomTargetKey'
          description: Custom target keys that have available report data. 1. All keys from ad type configuration. 2. All keys from line item configuration. 3. All keys have at least one report record within 60 days.
      description: ReadCustomTargetKeysWithCustomReportBulk response.
      required:
      - custom_target_keys
      additionalProperties: true
    publicRepresentedError:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: The status code, which should be an enum value of google.rpc.Code.(https://developers.google.com/actions-center/reference/grpc-api/status_codes)
        message:
          type: string
          description: The detailed message of responded error.
        details:
          type: array
          items:
            $ref: '#/components/schemas/RepresentedErrorDetail'
          description: The detailed information of responded error. Please refer to the error category section in guides for more detailed information.(https://rmp-docs.moloco.com/docs/management-api-error-categories)
      title: Overridden from grpc status(https://github.com/grpc/grpc/blob/master/src/proto/grpc/status/status.proto)
      required:
      - code
      - message
      - details
      additionalProperties: true
    commonErrorCategory:
      type: string
      enum:
      - DEFAULT_ERROR_CATEGORY
      - INPUT_VALIDATION
      - CHARACTER_LIMIT_EXCEEDED
      - TIMESTAMP_MISMATCH
      - FEATURE_NOT_ALLOWED
      - REINVITE_NOT_ALLOWED
      - LAST_OWNER_REVOKE_NOT_ALLOWED
      - LAST_OWNER_DELETE_NOT_ALLOWED
      - SSO_USER_JOIN_REQUEST_NOT_ALLOWED
      - MFA_VERIFICATION_FAILED
      - INSUFFICIENT_SPENDING_LIMIT
      - AD_ACCOUNT_ALREADY_OWNED
      - INSUFFICIENT_WALLET_BALANCE
      - INSUFFICIENT_SPEND_CAP_BUDGET
      - MAX_SPEND_CAP_COUNT_REACHED
      - MAX_CAMPAIGNS_COUNT_PER_SPEND_CAP_REACHED
      - MAX_CAMPAIGN_COUNT_REACHED
      - MODIFY_ARCHIVED_CAMPAIGN_NOT_ALLOWED
      - INVALID_CAMPAIGN_STATUS_FOR_ARCHIVE
      - INVALID_MANAGED_CPT_CAMPAIGN_SCHEDULE
      - INACTIVE_AD_ACCOUNT
      - DUPLICATE_AUDIENCE
      - INVALID_RESERVED_TIME_LINE_ITEM_SCHEDULE
      - EXCEED_MAX_IMAGE_SIZE
      - MAX_LABEL_COUNT_REACHED
      - MAX_LABEL_VALUE_COUNT_REACHED
      - MAX_LABEL_VALUE_RELATIONSHIP_COUNT_REACHED
      - PLATFORM_INSIGHT_UNAVAILABLE
      - MAX_CUSTOM_TARGETING_KEY_COUNT_REACHED
      - INVALID_CUSTOM_TARGETING
      default: DEFAULT_ERROR_CATEGORY
      title: "- INPUT_VALIDATION: INPUT_VALIDATION: reserved for 1 ~ 99\n - TIMESTAMP_MISMATCH: TIMESTAMP_MISSMATCH: reserved for 100 ~ 199\n - FEATURE_NOT_ALLOWED: General policy: 1000 ~ 1999\n - REINVITE_NOT_ALLOWED: User policy: 2000 ~ 2999\n - INSUFFICIENT_SPENDING_LIMIT: Account policy: 3000 ~ 3999\nThis policy includes ad manager account, ad account, and wallet related policies\n - MAX_CAMPAIGN_COUNT_REACHED: Campaign policy: 4000 ~ 4999\n - INVALID_RESERVED_TIME_LINE_ITEM_SCHEDULE: Returned when a RESERVED_TIME line item's schedule overlaps an existing enabled RD booking on the same inventory.\n - EXCEED_MAX_IMAGE_SIZE: Asset policy: 5000 ~ 5999\n - MAX_LABEL_COUNT_REACHED: Labeling policy: 6000 ~ 6999\n - PLATFORM_INSIGHT_UNAVAILABLE: Insight metric policy: 7000 ~ 7999\n - MAX_CUSTOM_TARGETING_KEY_COUNT_REACHED: Custom Targeting policy: 8000 ~ 8999"
    v1LineItemDailyCustomReportRow:
      type: object
      properties:
        custom_target_key_id:
          type: string
          description: The id of the custom target key.
        custom_target_value_id:
          type: string
          description: The id of the custom target value.
        custom_target_value_label:
          type: string
          description: The label of the custom target value.
        imp_count:
          type: string
          format: int64
          description: Impression count for the date.
        ctr:
          type: number
          format: double
          description: Click-through rate for the date.
      additionalProperties: true
    v1CustomTargetKey:
      type: object
      properties:
        id:
          type: string
          description: The id of the custom target key.
        label:
          type: string
          description: The label of the custom target key.
        description:
          type: string
          description: The description of the custom target key.
        is_multi_select:
          type: boolean
          description: Whether the custom target key allows multi select.
        valid:
          type: boolean
          description: The validity of the custom target key.
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Created timestamp. API user should not touch this field; it is set internally.
          readOnly: true
        updated_at:
