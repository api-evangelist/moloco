openapi: 3.2.0
info:
  title: Moloco Custom Targeting API
  version: '1.0'
  contact:
    name: Moloco Inc.
    url: https://www.molocoads.com
  description: 'Operations tagged CustomTargeting across 2 of this provider''s published API definitions: mcm-management-api.json, moloco-commerce-media-management-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://<platform>-mgmt.mcm-api.moloco.com
security:
- ApiKeyAuth: []
tags:
- name: CustomTargeting
paths:
  /rmp/mgmt/v1/platforms/{platform_id}/ad-accounts/{ad_account_id}/custom-target-keys-bulk:
    post:
      summary: ReadCustomTargetKeysBulk
      description: Read custom target keys in bulk.
      operationId: RmpManagementApi_ReadCustomTargetKeysBulk
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicReadCustomTargetKeysBulkResponse'
        '400':
          description: Bad request. Detailed cause can be found in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '404':
          description: Not found. One or more required resources do not exist.You can see the details in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '500':
          description: Internal server error. Detailed cause can be found in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
      parameters:
      - name: platform_id
        description: Identifier of the platform who requests management api. It is passed as a path parameter.
        in: path
        required: true
        schema:
          type: string
      - name: ad_account_id
        description: The id of the ad account to query custom target keys. It is passed as a path parameter.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ad_type:
                  $ref: '#/components/schemas/rmpcommonAdType'
                custom_target_key_ids:
                  type: array
                  items:
                    type: string
                  description: Custom target key ids.
              description: ReadCustomTargetKeysBulk request.
              required:
              - ad_type
              - custom_target_key_ids
              additionalProperties: true
        required: true
      tags:
      - CustomTargeting
    servers:
    - url: https://<platform>-mgmt.mcm-api.moloco.com
  ? /rmp/mgmt/v1/platforms/{platform_id}/ad-accounts/{ad_account_id}/custom-target-keys/{custom_target_key_id}/custom-target-values-bulk
  : post:
      summary: ReadCustomTargetValuesBulk
      description: Read custom target values in bulk.
      operationId: RmpManagementApi_ReadCustomTargetValuesBulk
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicReadCustomTargetValuesBulkResponse'
        '400':
          description: Bad request. Detailed cause can be found in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '404':
          description: Not found. One or more required resources do not exist.You can see the details in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '500':
          description: Internal server error. Detailed cause can be found in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
      parameters:
      - name: platform_id
        description: Identifier of the platform who requests management api. It is passed as a path parameter.
        in: path
        required: true
        schema:
          type: string
      - name: ad_account_id
        description: The id of the ad account to query custom target values. It is passed as a path parameter.
        in: path
        required: true
        schema:
          type: string
      - name: custom_target_key_id
        description: The id of the custom target key. It is passed as a path parameter.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ad_type:
                  $ref: '#/components/schemas/rmpcommonAdType'
                custom_target_value_ids:
                  type: array
                  items:
                    type: string
                  description: Custom target value ids. Exactly one of custom_target_value_ids or custom_target_value_labels must be provided.
                custom_target_value_labels:
                  type: array
                  items:
                    type: string
                  description: Custom target value labels. Exactly one of custom_target_value_ids or custom_target_value_labels must be provided.
              description: ReadCustomTargetValuesBulk request.
              required:
              - ad_type
              additionalProperties: true
        required: true
      tags:
      - CustomTargeting
    servers:
    - url: https://<platform>-mgmt.mcm-api.moloco.com
  ? /rmp/mgmt/v1/platforms/{platform_id}/ad-accounts/{ad_account_id}/orders/{order_id}/line-items/{line_item_id}/custom-daily-report
  : get:
      summary: QueryCustomTargetDailySummary
      description: Retrieve the custom targeting daily summary reports for a single line item.
      operationId: RmpManagementApi_QueryCustomTargetDailySummary2
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicQueryCustomTargetDailySummaryResponse'
        '400':
          description: Bad request. Detailed cause can be found in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '404':
          description: Not found. One or more required resources do not exist.You can see the details in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '500':
          description: Internal server error. Detailed cause can be found in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
      parameters:
      - name: platform_id
        description: Identifier of the platform who requests management api. It is passed as a path parameter.
        in: path
        required: true
        schema:
          type: string
      - name: ad_account_id
        description: The id of the ad account. It is passed as a path parameter.
        in: path
        required: true
        schema:
          type: string
      - name: order_id
        description: The id of the order. It is passed as a path parameter.
        in: path
        required: true
        schema:
          type: string
      - name: line_item_id
        description: The id of the line item. It is passed as a path parameter.
        in: path
        required: true
        schema:
          type: string
      - name: date_range.date_start
        description: Date in 'YYYY-MM-DD' when summary begins. Inclusive. Note the allowed maximum duration for the date range is 186 days, to cover the period of any entire month.
        in: query
        required: false
        schema:
          type: string
      - name: date_range.date_end
        description: Date in 'YYYY-MM-DD' when summary ends. Inclusive. Note the allowed maximum duration for the date range is 186 days, to cover the period of any entire month.
        in: query
        required: false
        schema:
          type: string
      - name: custom_target_key_id
        description: Custom target key id to retrieve the report.
        in: query
        required: false
        schema:
          type: string
      tags:
      - CustomTargeting
    post:
      summary: QueryCustomTargetDailySummary
      description: Retrieve the custom targeting daily summary reports for a single line item.
      operationId: RmpManagementApi_QueryCustomTargetDailySummary
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicQueryCustomTargetDailySummaryResponse'
        '400':
          description: Bad request. Detailed cause can be found in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '404':
          description: Not found. One or more required resources do not exist.You can see the details in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '500':
          description: Internal server error. Detailed cause can be found in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
      parameters:
      - name: platform_id
        description: Identifier of the platform who requests management api. It is passed as a path parameter.
        in: path
        required: true
        schema:
          type: string
      - name: ad_account_id
        description: The id of the ad account. It is passed as a path parameter.
        in: path
        required: true
        schema:
          type: string
      - name: order_id
        description: The id of the order. It is passed as a path parameter.
        in: path
        required: true
        schema:
          type: string
      - name: line_item_id
        description: The id of the line item. It is passed as a path parameter.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date_range:
                  $ref: '#/components/schemas/commonDateRange'
                custom_target_key_id:
                  type: string
                  description: Custom target key id to retrieve the report.
              description: QueryCustomTargetDailySummary request for fetching custom targeting daily reports of a line item. Maximum date range is 91 days. Default order is DATE_ASC.
              required:
              - date_range
              - custom_target_key_id
              additionalProperties: true
        required: true
      tags:
      - CustomTargeting
    servers:
    - url: https://<platform>-mgmt.mcm-api.moloco.com
  ? /rmp/mgmt/v1/platforms/{platform_id}/ad-accounts/{ad_account_id}/orders/{order_id}/line-items/{line_item_id}/custom-target-keys-with-custom-report-bulk
  : get:
      summary: ReadCustomTargetKeysWithCustomReportBulk
      description: Read the keys that have available report data in bulk.
      operationId: RmpManagementApi_ReadCustomTargetKeysWithCustomReportBulk
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
