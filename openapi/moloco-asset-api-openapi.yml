        '500':
          description: Internal server error. Detailed cause can be found in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
      parameters:
      - name: platform_id
        description: Platform identifier.
        in: path
        required: true
        schema:
          type: string
      - name: ad_account_id
        description: Ad account identifier.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    $ref: '#/components/schemas/publicCreateBulkImageUploadSessionRequestFileInfo'
                  description: List of files to upload.
              description: Request to create an upload session for image upload.
              required:
              - files
              additionalProperties: true
        required: true
      tags:
      - Asset
    servers:
    - url: https://<platform>-mgmt.mcm-api.moloco.com
