openapi: 3.2.0
info:
  title: Moloco Asset API
  version: '1.0'
  contact:
    name: Moloco Inc.
    url: https://www.molocoads.com
  description: 'Operations tagged Asset across 2 of this provider''s published API definitions: mcm-management-api.json, moloco-commerce-media-management-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://<platform>-mgmt.mcm-api.moloco.com
security:
- ApiKeyAuth: []
tags:
- name: Asset
paths:
  /rmp/mgmt/v1/platforms/{platform_id}/ad-accounts/{ad_account_id}/image-assets:
    get:
      summary: ListImageAssets
      description: List all the image assets.
      operationId: RmpManagementApi_ListImageAssets
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicListImageAssetsResponse'
        '400':
          description: Bad request. Detailed cause can be found in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '404':
          description: Not found. One or more required resources do not exist.You can see the details in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '500':
          description: Internal server error. Detailed cause can be found in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
      parameters:
      - name: platform_id
        description: Identifier of the platform who requests management api. It is passed as a path parameter.
        in: path
        required: true
        schema:
          type: string
      - name: ad_account_id
        description: The id of the ad account that owns the image asset.
        in: path
        required: true
        schema:
          type: string
      - name: image_asset_type
        description: Image asset type
        in: query
        required: false
        schema:
          type: string
          enum:
          - UNKNOWN_IMAGE_ASSET_TYPE
          - BANNER
          - LOGO
          default: UNKNOWN_IMAGE_ASSET_TYPE
      - name: ids
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      tags:
      - Asset
    post:
      summary: CreateImageAsset
      description: Create image asset
      operationId: RmpManagementApi_CreateImageAsset
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCreateImageAssetResponse'
        '400':
          description: Bad request. Detailed cause can be found in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '404':
          description: Not found. One or more required resources do not exist.You can see the details in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
        '500':
          description: Internal server error. Detailed cause can be found in the response message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicRepresentedError'
      parameters:
      - name: platform_id
        description: Identifier of the platform who requests management api. It is passed as a path parameter.
        in: path
        required: true
        schema:
          type: string
      - name: ad_account_id
        description: The id of the ad account that owns this image asset.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image_asset:
                  description: "Provide a JSON string representing the `image_asset` object.\n\n**Field Details:**\n- **title** (string, required): A descriptive name of the image asset.\n- **image_asset_type** (string, required): The type of image asset. Allowed values:\n  - `BANNER`\n  - `LOGO`\n- **image_url** (object, optional): Only provide this field when neither `file` parameter nor `object_key` parameter is provided. Details about the image source:\n  - **url** (string): The URL of the image.\n  - **file_name** (string): The file name of the image. e.g., `image.png`.\n\n**Upload Methods (choose only one):**\n1. **Upload by file**: Use the `file` parameter with the actual image file\n2. **Upload by CDN**: Include the `image_url` object in this `image_asset` object\n3. **Upload by session**: Include the `object_key` parameter which is issued from `CreateBulkImageUploadSession` API\n\n**Examples:**\n\n**Example 1: Upload by file**\n- Provide the `file` parameter with the image file and omit both `object_key` and `image_url` object in the `image_asset` object.\n```json\n{\n  \"title\": \"Banner Image\",\n  \"image_asset_type\": \"BANNER\"\n}\n```\n\n**Example 2: Upload by CDN**\n- Omit both `object_key` and `file` parameter and include the `image_url` object in the `image_asset` object.\n```json\n{\n  \"title\": \"Logo Image\",\n  \"image_asset_type\": \"LOGO\",\n  \"image_url\": {\n    \"url\": \"https://example.com/logo.png\",\n    \"file_name\": \"logo.png\"\n  }\n}\n```\n\n**Example 3: Upload by session**\n- Provide the `object_key` parameter and omit both `file` and `image_url` object in the `image_asset` object.\n```json\n{\n  \"title\": \"Banner Image\",\n  \"image_asset_type\": \"BANNER\"\n}\n```"
                  type: string
                file:
                  description: Provide the image file when using upload by file method. Do not use this parameter if `image_url` object is included in the `image_asset` object or if `object_key` parameter is provided.
                  type: string
                  format: binary
                object_key:
                  description: 'Provide the object key when using upload by session method. Do not use this parameter if `file` parameter is provided or if `image_url` object is included in the `image_asset` object. The object key can be obtained from `CreateBulkImageUploadSession` API''s response. User need to upload a image file after this API''s response. Please make sure file is uploaded and then request with the object_key. '
                  type: string
              required:
              - image_asset
        required: true
      tags:
      - Asset
    servers:
    - url: https://<platform>-mgmt.mcm-api.moloco.com
  /rmp/mgmt/v1/platforms/{platform_id}/ad-accounts/{ad_account_id}/image-assets/upload-session:
    post:
