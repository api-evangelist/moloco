components:
  schemas:
    RepresentedErrorDetail:
      type: object
      properties:
        type:
          type: string
          description: The type of the metadata.
        category:
          $ref: '#/components/schemas/commonErrorCategory'
        metadata:
          type: object
          description: The metadata of the responded error.
          additionalProperties: true
      required:
      - type
      - category
      additionalProperties: true
    publicCreateImageAssetResponse:
      type: object
      properties:
        image_asset:
          $ref: '#/components/schemas/v1ImageAsset'
      description: CreateImageAsset response.
      required:
      - image_asset
      additionalProperties: true
    publicCreateBulkImageUploadSessionResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/publicCreateBulkImageUploadSessionResponseSession'
          description: List of upload sessions with URLs and object keys.
        expires_at:
          type: string
          format: date-time
          description: Expiration time of session URL.
      description: Response containing upload session details.
      required:
      - sessions
      - expires_at
      additionalProperties: true
    commonErrorCategory:
      type: string
      enum:
      - DEFAULT_ERROR_CATEGORY
      - INPUT_VALIDATION
      - CHARACTER_LIMIT_EXCEEDED
      - TIMESTAMP_MISMATCH
      - FEATURE_NOT_ALLOWED
      - REINVITE_NOT_ALLOWED
      - LAST_OWNER_REVOKE_NOT_ALLOWED
      - LAST_OWNER_DELETE_NOT_ALLOWED
      - SSO_USER_JOIN_REQUEST_NOT_ALLOWED
      - MFA_VERIFICATION_FAILED
      - INSUFFICIENT_SPENDING_LIMIT
      - AD_ACCOUNT_ALREADY_OWNED
      - INSUFFICIENT_WALLET_BALANCE
      - INSUFFICIENT_SPEND_CAP_BUDGET
      - MAX_SPEND_CAP_COUNT_REACHED
      - MAX_CAMPAIGNS_COUNT_PER_SPEND_CAP_REACHED
      - MAX_CAMPAIGN_COUNT_REACHED
      - MODIFY_ARCHIVED_CAMPAIGN_NOT_ALLOWED
      - INVALID_CAMPAIGN_STATUS_FOR_ARCHIVE
      - INVALID_MANAGED_CPT_CAMPAIGN_SCHEDULE
      - INACTIVE_AD_ACCOUNT
      - DUPLICATE_AUDIENCE
      - INVALID_RESERVED_TIME_LINE_ITEM_SCHEDULE
      - EXCEED_MAX_IMAGE_SIZE
      - MAX_LABEL_COUNT_REACHED
      - MAX_LABEL_VALUE_COUNT_REACHED
      - MAX_LABEL_VALUE_RELATIONSHIP_COUNT_REACHED
      - PLATFORM_INSIGHT_UNAVAILABLE
      - MAX_CUSTOM_TARGETING_KEY_COUNT_REACHED
      - INVALID_CUSTOM_TARGETING
      default: DEFAULT_ERROR_CATEGORY
      title: "- INPUT_VALIDATION: INPUT_VALIDATION: reserved for 1 ~ 99\n - TIMESTAMP_MISMATCH: TIMESTAMP_MISSMATCH: reserved for 100 ~ 199\n - FEATURE_NOT_ALLOWED: General policy: 1000 ~ 1999\n - REINVITE_NOT_ALLOWED: User policy: 2000 ~ 2999\n - INSUFFICIENT_SPENDING_LIMIT: Account policy: 3000 ~ 3999\nThis policy includes ad manager account, ad account, and wallet related policies\n - MAX_CAMPAIGN_COUNT_REACHED: Campaign policy: 4000 ~ 4999\n - INVALID_RESERVED_TIME_LINE_ITEM_SCHEDULE: Returned when a RESERVED_TIME line item's schedule overlaps an existing enabled RD booking on the same inventory.\n - EXCEED_MAX_IMAGE_SIZE: Asset policy: 5000 ~ 5999\n - MAX_LABEL_COUNT_REACHED: Labeling policy: 6000 ~ 6999\n - PLATFORM_INSIGHT_UNAVAILABLE: Insight metric policy: 7000 ~ 7999\n - MAX_CUSTOM_TARGETING_KEY_COUNT_REACHED: Custom Targeting policy: 8000 ~ 8999"
    publicReadVideoAssetResponse:
      type: object
      properties:
        video_asset:
          $ref: '#/components/schemas/v1VideoAsset'
      description: ReadVideoAsset response.
      required:
      - video_asset
      additionalProperties: true
    v1VideoAsset:
      type: object
      properties:
        id:
          type: string
          description: The id of the video asset. Must be left unset for the video asset creation request. Must be set for the other requests.
          readOnly: true
        ad_account_id:
          type: string
          description: The id of the ad account that owns this video asset. It is platform-specific ad_account_id. Value and format can vary according to each Platform.
          readOnly: true
        video_source:
          $ref: '#/components/schemas/v1VideoSource'
        created_at:
          type: string
          format: date-time
          description: Created timestamp. API user should not touch this field; it is set internally in creation process.
          readOnly: true
      description: VideoAsset that could be used for the campaign's asset.
      additionalProperties: true
    publicCreateBulkVideoUploadSessionRequestFileInfo:
      type: object
      properties:
        file_name:
          type: string
          description: Original file name.
        mime_type:
          type: string
          description: MIME type of the file (e.g., video/mp4).
      additionalProperties: true
    publicListImageAssetsResponse:
      type: object
      properties:
        image_assets:
          type: array
          items:
            $ref: '#/components/schemas/v1ImageAsset'
          description: Image assets information.
      description: ListImageAssets response.
      required:
      - image_assets
      additionalProperties: true
    publicCreateBulkImageUploadSessionRequestFileInfo:
      type: object
      properties:
        file_name:
          type: string
          description: Original file name.
        mime_type:
          type: string
          description: MIME type of the file (e.g., image/png, image/jpeg).
      additionalProperties: true
    publicCreateVideoAssetResponse:
      type: object
      properties:
        video_asset:
          $ref: '#/components/schemas/v1VideoAsset'
      description: CreateVideoAsset response.
      required:
      - video_asset
      additionalProperties: true
    v1ImageSource:
      type: object
      properties:
        url:
          type: string
          description: The URL of the image.
        width:
          type: integer
          format: int64
          description: The width of the image.
          readOnly: true
        height:
          type: integer
          format: int64
          description: The height of the image.
          readOnly: true
        size:
          type: integer
          format: int64
          description: The file size in bytes of the image.
          readOnly: true
        file_name:
          type: string
          description: The file name of the image.
      description: Detailed information of an image.
      required:
      - url
      - width
      - height
      - size
      - file_name
      additionalProperties: true
    publicCreateBulkImageUploadSessionResponseSession:
      type: object
      properties:
