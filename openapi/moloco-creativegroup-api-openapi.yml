      - SOURCER_TEST_CATALOG_DEPENDENT
      - SOURCER_TEST_CATALOG_INDEPENDENT
      - SOURCER_DEFAULT
      - SOURCER_USER_SIGNAL
      - SOURCER_TRENDS
      - SOURCER_RELATED_ITEMS
      - SOURCER_AUCTION_ITEMS
      default: UNKNOWN_SOURCER
      description: SourcerType defines the type of sourcer for the model.
    CreativeHtmlRequirementAttributesAutoPlayAudioType:
      type: string
      enum:
      - UNKNOWN_AUTO_PLAY_AUDIO_TYPE
      - AUTO_PLAY_AUDIO_TYPE_MUTED
      - AUTO_PLAY_AUDIO_TYPE_AUTO_PLAY
