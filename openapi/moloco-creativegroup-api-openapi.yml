    messagesCreateCreativeGroupErrorAPIErrorInfoErrorReason:
      type: string
      enum:
      - ERROR_REASON_UNKNOWN
      - CREATIVE_MUST_BE_ASSET_URL
      - CREATIVE_VIDEO_TYPE_SHOULD_HAVE_SINGLE_COMPANION_IMAGE
      - CREATIVE_VIDEO_TYPE_SHOULD_HAVE_SINGLE_ENDCARD_TYPE
      - CREATIVE_INVALID_IMAGE_FORMAT
      - CREATIVE_UNSUPPORTED_IMAGE_FORMAT
      - CREATIVE_MALFORMED_URL
      - CREATIVE_AT_LEAST_ONE_FIELD_MUST_BE_FILLED
      - CREATIVE_TYPE_AUTO_PLAY_AUDIO_ATTRIBUTE_INVALID
      - CREATIVE_PLAYABLE_AD_SOURCE_URL_INVALID_PREFIX
      - CREATIVE_NOT_SUPPORTED_IMAGE_DIMENSION
      - CREATIVE_NO_ALLOWED_IMAGE_SIZE_ON_DSP_CONFIGURATION
      - CREATIVE_TYPE_NOT_ALLOWED_VALUE_IN_PLAYABLE_AD_SOURCE
      - CREATIVE_TYPE_MUST_CONTAIN_ON_CTA_CLICK
      - CREATIVE_ON_CTA_CLICK_CANNOT_HAVE_ARGUMENT
      - CREATIVE_TWO_VALUES_SHOULD_BE_SAME
      - CREATIVE_GROUP_INVALID_APP_ICON_IMAGE_SHAPE
      - CREATIVE_GROUP_INVALID_BRAND_LOGO_IMAGE_SHAPE
      - CREATIVE_GROUP_SMALL_IMAGE_SIZE
      - CREATIVE_GROUP_EXCEED_CTA_TEXT_LENGTH
      - CREATIVE_GROUP_INVALID_CTA_COLOR_CODE
      - CREATIVE_GROUP_FEATURE_TYPE_NOT_MATCH_CREATIVE_FEATURE_TYPE
      - CREATIVE_GROUP_NEEDS_PRODUCT
      - CREATIVE_GROUP_VIDEO_AD_EVENT_TRACKERS_EXCEED_LIMIT
      default: ERROR_REASON_UNKNOWN
      description: " - CREATIVE_MUST_BE_ASSET_URL: image URL should be asset url but user used wrong url by its prefix.\n - CREATIVE_VIDEO_TYPE_SHOULD_HAVE_SINGLE_COMPANION_IMAGE: video type should have single companion image.\n - CREATIVE_VIDEO_TYPE_SHOULD_HAVE_SINGLE_ENDCARD_TYPE: video type should have a single endcard type.\n - CREATIVE_INVALID_IMAGE_FORMAT: invalid image format.\n - CREATIVE_UNSUPPORTED_IMAGE_FORMAT: unsupported image format.\n - CREATIVE_MALFORMED_URL: URL cannot be parsed.\n - CREATIVE_AT_LEAST_ONE_FIELD_MUST_BE_FILLED: at least one field should be filled.\n - CREATIVE_TYPE_AUTO_PLAY_AUDIO_ATTRIBUTE_INVALID: rich_custom_html with Facebook HTML should specify the auto_play_audio attribute (true/false).\n - CREATIVE_PLAYABLE_AD_SOURCE_URL_INVALID_PREFIX: playable ad source url should be prefixed with domain name.\n - CREATIVE_NOT_SUPPORTED_IMAGE_DIMENSION: Specified image dimension is not supported.\n - CREATIVE_NO_ALLOWED_IMAGE_SIZE_ON_DSP_CONFIGURATION: no allowed image size is defined on dap configuration.\n - CREATIVE_TYPE_NOT_ALLOWED_VALUE_IN_PLAYABLE_AD_SOURCE: Value used in playable ad source is not allowed.\n - CREATIVE_TYPE_MUST_CONTAIN_ON_CTA_CLICK: FbPlayableAd.onCTAClick must be contained.\n - CREATIVE_ON_CTA_CLICK_CANNOT_HAVE_ARGUMENT: FbPlayableAd.onCTAClick must be inserted without an argument.\n - CREATIVE_TWO_VALUES_SHOULD_BE_SAME: two values should be same.\n - CREATIVE_GROUP_INVALID_APP_ICON_IMAGE_SHAPE: App icon image should be square.\n - CREATIVE_GROUP_INVALID_BRAND_LOGO_IMAGE_SHAPE: Brand logo image should be horizontal.\n - CREATIVE_GROUP_SMALL_IMAGE_SIZE: Image width and height must be greater than 256 px.\n - CREATIVE_GROUP_EXCEED_CTA_TEXT_LENGTH: Maximum length of call to action text is 8.\n - CREATIVE_GROUP_INVALID_CTA_COLOR_CODE: Cta color code should be formatted to 24-bit RGB hexadecimal representation.\n - CREATIVE_GROUP_FEATURE_TYPE_NOT_MATCH_CREATIVE_FEATURE_TYPE: The feature type of Creative should match the feature type of Creative Group.\n - CREATIVE_GROUP_NEEDS_PRODUCT: CreativeGroup with TrackingLink or LandingUrl needs Product.\n - CREATIVE_GROUP_VIDEO_AD_EVENT_TRACKERS_EXCEED_LIMIT: The number of trackers used from VideoAdEventTrackers exceeds limit. The limit is up to 3 per event."
    CampaignGoalOptimizeAppInstalls:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/CampaignGoalOptimizeAppInstallsMode'
          description: Optimization mode.
        target_cpi:
