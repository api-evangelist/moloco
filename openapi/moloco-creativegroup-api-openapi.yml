      description: This value is not part of the specification.
    commonAdvertiserIdType:
      type: string
      enum:
      - UNKNOWN_ADVERTISER_ID_TYPE
      - ANDROID_IDFA
      - IOS_IDFA
      - GENERIC_USER_ID
      - GENERIC_DEVICE_ID
      - ANDROID_LAT_IDFA
      - IOS_LAT_IDFA
      default: UNKNOWN_ADVERTISER_ID_TYPE
      description: "Enumeration of supported ID types for advertises.\n\nThis value is not part of the specification.\n\n - ANDROID_IDFA: IDFA used in Android.\n - IOS_IDFA: IDFA used in iOS.\n - GENERIC_USER_ID: This is used when IDFA is unavailable and an alternative user id is available.\nFor example, Google's adid is used for mobile web inventories.\n - GENERIC_DEVICE_ID: This is used when IDFA is unavailable and an alternative device id is available.\nFor example, Mopub sends out device id in some apps.\n - ANDROID_LAT_IDFA: infra-generating IDFA used for Android LAT devices\n - IOS_LAT_IDFA: infra-generating IDFA used for iOS LAT devices"
    PolicyPolicyFunction:
      type: string
      enum:
      - UNKNOWN_POLICY
      - RANDOM_SELECTION
      - MOST_RECENT_VIEW
      - IN_CART
      - GLOBAL_TREND
      - TREND
      - COMBINED_EVENTS_RECENCY
      - FREQUENTLY_BOUGHT_TOGETHER
      - FREQUENTLY_SEEN_TOGETHER
      - KEYWORD_SEARCH_WITH_CLIENT_RESULT
      - COMBINED_EVENTS_RECENCY_WITH_KEYWORD_SEARCH
