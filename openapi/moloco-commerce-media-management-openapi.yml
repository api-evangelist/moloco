    v1SpendCapPeriod:
      type: string
      enum:
      - UNKNOWN_PERIOD
      - DAILY
      - WEEKLY
      - TOTAL
      default: UNKNOWN_PERIOD
      description: 'Period describes the cadence on which the SpendCap budget

        resets. DAILY / WEEKLY / MONTHLY produce a recurring ledger;

        TOTAL means the cap covers the entire schedule as a single

        window. This enum is intentionally separate from

        common.Budget.Period (used by campaigns), which does NOT

        have a MONTHLY value — campaigns may not use a monthly

        cadence.


        Numeric values are arranged so the recurring kinds are

        grouped (DAILY=1, WEEKLY=2, MONTHLY=3), with TOTAL=4 as the

        non-recurring case. Public mgmt access is REST/JSON-only and

        proto-JSON encodes enums by name, so the legacy binary

        numbering of common.Budget.Period is not relevant here.'
    v1SpendCapSpendCapStatus:
      type: string
      enum:
      - UNKNOWN_SPEND_CAP_STATUS
      - SCHEDULED
      - INACTIVE
      - ACTIVE
      - ENDED
      - DEPLETED
      - ERROR
      default: UNKNOWN_SPEND_CAP_STATUS
      description: " - SCHEDULED: The SpendCap is not in an Active state due to an unexpected error case\n Similar to the\
        \ Scheduled state of a campaign, the SpendCap is in a “reserved” state because its period has not yet started.\n -\
        \ INACTIVE: The status when the user manually changes the SpendCap from Active to Inactive.\n - ACTIVE: The SpendCap\
        \ is in an Active state. As long as the amount is not depleted, the mapped campaigns can remain Active and serve ads\
        \ without issues\n - ENDED: One of the cases where the SpendCap is no longer Active because its defined period has\
        \ ended.\n - DEPLETED: The SpendCap has reached its allocated amount (0 remaining). As a result, the mapped campaigns\
        \ can no longer remain active and ad serving stops, even though the period itself has not yet ended.\n - ERROR: Error\
        \ state. The campaign state does not belong to any states above."
