        content:
          application/json:
            schema:
              type: object
              properties:
                timezone:
                  type: string
                  description: Timezone of date_start and date_end. To be deprecated. Only platform timezone is accepted.
                    Must be in IANA timezone name format, e.g. Asia/Seoul.
                date_start:
                  type: string
                  description: Date in 'YYYY-MM-DD' when summary begins. Inclusive. Note the allowed maximum duration for
                    the date range is 186 days, to cover the period of any entire month.
                date_end:
                  type: string
                  description: Date in 'YYYY-MM-DD' when summary ends. Inclusive. Note the allowed maximum duration for the
                    date range is 186 days, to cover the period of any entire month.
                group_by:
                  type: array
                  items:
                    $ref: '#/components/schemas/v1PlatformSummaryGroupByColumn'
                  description: A list of columns to be grouped by. Please note that among the group_by options, ITEM and CREATIVE
                    cannot be used together. Furthermore, AD_MANAGER_ACCOUNT can be only used with CURRENCY.
                order_by:
                  type: array
                  items:
                    $ref: '#/components/schemas/v1PlatformSummaryOrderByColumn'
                  description: A list of columns to be ordered by.
                filter:
                  type: array
                  items:
                    $ref: '#/components/schemas/managementv1QueryFilter'
                  description: Query Filter. Only 1 allowed since we only support CAMPAIGN_FILTER.
                limit:
                  type: string
                  format: int64
                  description: Maximum number of rows to be returned. Cannot exceed 50,000
                ad_account_id:
                  type: string
                  description: AdAccount id.
              description: QueryPlatformSummary request.
              required:
              - date_start
              - date_end
              additionalProperties: true
        required: true
      tags:
      - Report
