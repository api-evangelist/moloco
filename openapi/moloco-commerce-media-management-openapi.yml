        purchase_count:
          type: string
          format: int64
          description: 'Purchases (shown as ''Purchases''). From Google''s metrics_conversions: the raw fractional values
            are summed and rounded once at the total.'
        roas:
          $ref: '#/components/schemas/publicOffsiteAttributionRatio'
        cpc:
          type: number
          format: double
          description: Cost per click in micros. Unset when there are no clicks.
      description: 'OffsiteReportMetric is one aggregated set of performance metrics over a date

        range. Field names follow the onsite report types so the FE can reuse its

        existing column code. In M1 each metric is a single value (advertiser view).'
      additionalProperties: true
    publicOffsiteReportRow:
      type: object
      properties:
        date:
          type: string
          description: Date in 'YYYY-MM-DD', in the normalized timezone. Populated when group_by includes DATE.
        timezone:
          type: string
          description: IANA timezone the dates are normalized to.
        currency:
          type: string
          description: ISO-4217 currency of the money values. M1 is single-currency per retailer.
        ad_account_id:
          type: string
          description: 'Ad account id. Reserved: summary RPCs group only by DATE/CURRENCY; per-ad-account rows come from QueryOffsiteAdAccountResources.'
        ad_account_title:
          type: string
          description: Ad account title. Reserved (not populated by summary RPCs).
        ad_manager_account_id:
          type: string
          description: 'Ad Manager Account id. Reserved: per-AMA rows come from QueryOffsiteAdManagerAccountResources.'
        ad_manager_account_title:
          type: string
          description: Ad Manager Account title. Reserved (not populated by summary RPCs).
        offsite_campaign_id:
          type: string
          description: 'OffsiteCampaign id. Reserved: per-campaign rows come from QueryOffsiteCampaignResources.'
        campaign_title:
          type: string
          description: Campaign title. Reserved (not populated by summary RPCs).
        metric:
          $ref: '#/components/schemas/publicOffsiteReportMetric'
        freshness:
          $ref: '#/components/schemas/publicGoogleOffsiteFreshness'
      description: 'OffsiteReportRow is one aggregated reporting row. Which dimension fields are

        populated depends on the request''s group_by (mirrors the onsite

        PlatformSummaryRow model): the summary cards use group_by=[CURRENCY] (one row),

        and the trend chart uses group_by=[DATE, CURRENCY] (one row per day per currency

        — one per day in single-currency M1). Per-entity rows for the tables come from

        the paginated QueryOffsite*Resources RPCs instead.'
      additionalProperties: true
    publicOffsiteReportSummaryGroupByColumn:
      type: string
      enum:
      - UNKNOWN_GROUP_BY
      - DATE
      - CURRENCY
      - AD_ACCOUNT
      - AD_MANAGER_ACCOUNT
      default: UNKNOWN_GROUP_BY
      description: 'Dimensions a summary query can group rows by. A summary serves the bounded

        chart and the post-aggregated breakdown rows: the cards use [CURRENCY] (one

        row) and the trend chart uses [DATE] (one row per day). AD_MANAGER_ACCOUNT

        (platform summary only) post-aggregates the platform''s sellers into one row

        per (AMA, currency) — the AMAs tab. AD_ACCOUNT (AMA-owner summary only)

        breaks the AMA''s total into one row per (ad account, currency). The

        cursor-paginated *Resources RPCs serve the per-entity tables.'
    publicOffsiteReportSummaryOrderByColumn:
      type: string
      enum:
      - UNKNOWN_ORDER_BY
      - TIME_DATE
      - TIME_DATE_DESC
      - MONEY_SPENT
      - MONEY_SPENT_DESC
      default: UNKNOWN_ORDER_BY
      description: 'Columns a summary query can order rows by. The chart only ever orders by day

        (trend) or spend (cards), so only the time and spend columns are offered;

        title ordering belongs to the cursor-paginated *Resources RPCs.'
    publicOffsiteResourceSorter:
      type: object
      properties:
        sorts:
          type: array
          items:
            $ref: '#/components/schemas/OffsiteResourceSorterSingleSort'
          description: Sort keys applied in order; the server appends an id tiebreaker for a stable total order.
      description: 'OffsiteResourceSorter is the shared sort spec for the three offsite reporting

        *Resources tables (QueryOffsiteAdAccountResources / QueryOffsitePlatformResources

        / QueryOffsiteAdManagerAccountResources). They share the same per-row metric

        shape, so one sorter type covers all three. Multi-column: the sorts apply in the

        listed order and the server appends a deterministic id tiebreaker. An empty

        sorter uses the server default (most recent first).'
      additionalProperties: true
