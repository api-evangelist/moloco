        ad_manager_account_title:
          type: string
          description: Indicates the descriptive name of the ad manager account.
        user_id:
          type: string
          description: The id of the target user.
        user_email:
          type: string
          description: The email of the target user.
        user_name:
          type: string
          description: The descriptive name of the target user.
        user_role_before:
          $ref: '#/components/schemas/v1RoleName'
        user_role_after:
          $ref: '#/components/schemas/v1RoleName'
        reason:
          type: string
          description: The rejection reason of the target user.
        changed_by:
          $ref: '#/components/schemas/v1ChangeLogUser'
        updated_at:
          type: string
          format: date-time
          description: Updated timestamp of the entity.
