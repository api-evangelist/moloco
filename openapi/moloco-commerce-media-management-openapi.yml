        click_count:
          type: string
          format: int64
          description: Click count.
        money_spent:
          type: string
          format: int64
          description: Money spent. It is in a micro unit.
        purchase_count:
          type: string
          format: int64
          description: Purchase count.
        purchase_breakdown:
          $ref: '#/components/schemas/commonHaloMetricInt'
        revenue:
          type: string
          format: int64
          description: Money earned. It is in a micro unit.
        revenue_breakdown:
          $ref: '#/components/schemas/commonHaloMetricInt'
