openapi: 3.0.0
info:
  title: Management API
  description: MOLOCO RMP Management API provides functionalities for MOLOCO RMP systems.
  version: '1.0'
  contact:
    name: Moloco Inc.
    url: https://www.molocoads.com
tags:
- name: RmpManagementApi
paths:
  /rmp/mgmt/v1/platforms/{platform_id}/ad-accounts:
