      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ad_account:
                  $ref: '#/components/schemas/publicUpdateAdAccountRequestAdAccountInfo'
              description: UpdateAdAccount request.
              required:
              - ad_account
              additionalProperties: true
        required: true
      tags:
