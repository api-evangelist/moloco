      - ad_account_id
      - ad_account_title
      - ad_manager_account_id
      - ad_manager_account_title
      - user_id
      - user_email
      - user_name
      - user_role_before
      - user_role_after
      - reason
      - updated_at
      additionalProperties: true
    v1UserAccessChangeLogFilter:
      type: object
      properties:
        activity:
          $ref: '#/components/schemas/UserAccessChangeLogActivity'
        user_id:
          type: string
          description: Identifier of the user.
      description: Definition of a ChangeLogFilter. The fields in the message compose AND condition filter.
      additionalProperties: true
    v1UserJoinRequest:
      type: object
      properties:
        id:
          type: string
          description: The id of the UserJoinRequest. Generated automatically.
        ad_account_id:
          type: string
          description: The requester’s ad account id.
        ad_account_title:
          type: string
          description: The requester’s ad account title.
        user_email:
          type: string
          description: The requester’s user email. It will be used as an identifier.
        user_name:
          type: string
          description: The requester’s user name. If this field is not set, a parsed email will be used.
        role:
          $ref: '#/components/schemas/v1RoleName'
        created_at:
          type: string
          format: date-time
          description: Created timestamp. API user should not touch this field; it is set internally.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Updated timestamp. API user should not touch this field; it is set internally.
          readOnly: true
      description: Definition of a UserJoinRequest.
      required:
      - ad_account_id
      - user_email
      - created_at
      - updated_at
      additionalProperties: true
    v1UserRegistration:
      type: object
      properties:
        is_created:
          type: boolean
          description: The type of the resource.
        registration_info:
          $ref: '#/components/schemas/UserRegistrationRegistrationInfo'
      description: Definition of a User Registration specification.
      readOnly: true
      required:
      - is_created
      additionalProperties: true
    v1VideoAsset:
      type: object
      properties:
        id:
          type: string
          description: The id of the video asset. Must be left unset for the video asset creation request. Must be set for
            the other requests.
          readOnly: true
        ad_account_id:
          type: string
          description: The id of the ad account that owns this video asset. It is platform-specific ad_account_id. Value and
            format can vary according to each Platform.
          readOnly: true
        video_source:
          $ref: '#/components/schemas/v1VideoSource'
        created_at:
          type: string
          format: date-time
          description: Created timestamp. API user should not touch this field; it is set internally in creation process.
          readOnly: true
      description: VideoAsset that could be used for the campaign's asset.
      additionalProperties: true
    v1VideoSource:
      type: object
      properties:
        url:
          type: string
          description: The URL of the video.
          readOnly: true
        file_name:
          type: string
          description: The file name of the video.
          readOnly: true
        width:
          type: integer
          format: int64
          description: The width of the video.
          readOnly: true
        height:
          type: integer
          format: int64
          description: The height of the video.
          readOnly: true
        size_bytes:
          type: integer
          format: int64
          description: The file size in bytes of the video.
          readOnly: true
        duration_sec:
          type: integer
          format: int64
          description: The duration of the video in seconds.
          readOnly: true
        status:
          $ref: '#/components/schemas/v1VideoSourceStatus'
      description: Detailed information of a video.
      additionalProperties: true
    v1VideoSourceStatus:
      type: string
      enum:
      - UNKNOWN_STATUS
      - PENDING
      - READY
      default: UNKNOWN_STATUS
      description: " - PENDING: The video asset isn't ready to use yet.\n - READY: The video asset is ready to use."
    v1Wallet:
      type: object
      properties:
        id:
          type: string
          description: The id of the Wallet. Must be left unset for the Wallet creation request. Must be set for the other
            requests.
        title:
          type: string
          description: A friendly name for the Wallet.
        ad_account_id:
          type: string
          description: The id of the AdAccount that owns this Wallet. It is platform-specific ad_account_id. Value and format
            can vary according to each Platform.
        type:
          $ref: '#/components/schemas/commonWalletType'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/v1Account'
          description: List of Accounts that belong to the wallet.
        created_at:
          type: string
          format: date-time
          description: Created timestamp. API user should not touch this field; it is set internally.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Updated timestamp. Set internally during creation, but required during update.
      description: Definition of a Wallet.
      required:
      - id
