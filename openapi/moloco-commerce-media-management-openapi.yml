      - FUNDED
      - REFUNDED
      - SPENT
      default: UNKNOWN_TYPE
    v1WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          description: The id of the delivery.
        is_test:
          type: boolean
          description: Whether this delivery was produced by a test send.
        status:
          $ref: '#/components/schemas/notificationv1Status'
        event:
          type: string
          description: The WebhookEvent wire token (e.g. "campaign.budget.high_upsell").
        created_at:
          type: string
          format: date-time
          description: Creation timestamp of the delivery.
        request_body:
          type: string
          description: The raw request body that was (or would be) POSTed to the endpoint.
        endpoint_id:
          type: string
          description: The id of the endpoint this delivery was sent to. Useful when querying deliveries across endpoints.
      description: Definition of a webhook delivery.
      required:
      - id
      - status
      - event
      additionalProperties: true
    v1WebhookEndpoint:
      type: object
      properties:
        id:
          type: string
          description: The id of the webhook endpoint. Server-assigned on creation; leave unset on CreateWebhookEndpoint.
        url:
          type: string
          description: The HTTPS URL that deliveries are POSTed to.
        description:
          type: string
          description: Human-readable description of the endpoint. Optional.
        subscribed_events:
          type: array
          items:
            $ref: '#/components/schemas/v1WebhookEvent'
          description: The webhook events this endpoint is subscribed to.
        enabled:
          type: boolean
          description: Whether the endpoint is enabled. Disabled endpoints do not receive deliveries.
        retry_policy:
          $ref: '#/components/schemas/v1WebhookRetryPolicy'
        created_at:
          type: string
          format: date-time
          description: Creation timestamp of the endpoint.
        updated_at:
          type: string
          format: date-time
          description: Last-updated timestamp of the endpoint. Doubles as the optimistic-lock token on update.
        name:
          type: string
          description: Human-readable display name of the endpoint. Optional, mutable.
      description: Definition of a webhook endpoint.
      required:
      - url
      - subscribed_events
      - enabled
      additionalProperties: true
    v1WebhookEvent:
      type: string
      enum:
      - WEBHOOK_EVENT_UNSPECIFIED
      - WEBHOOK_EVENT_CAMPAIGN_BUDGET_HIGH_UPSELL
      - WEBHOOK_EVENT_ADVERTISER_RE_ENGAGE_CHURNED
      default: WEBHOOK_EVENT_UNSPECIFIED
      description: "WebhookEvent enumerates the public-facing webhook event types a platform can\nsubscribe to. Each value\
        \ maps 1:1 to a rmp.notification.v1.NotificationEvent\nWEBHOOK_EVENT_* value. The wire token (e.g. \"campaign.budget.high_upsell\"\
        )\nis the value emitted in the delivered payload's `event` field.\n\n - WEBHOOK_EVENT_CAMPAIGN_BUDGET_HIGH_UPSELL:\
        \ wire: \"campaign.budget.high_upsell\"\n - WEBHOOK_EVENT_ADVERTISER_RE_ENGAGE_CHURNED: wire: \"advertiser.re_engage.churned\""
    v1WebhookRetryPolicy:
      type: object
      properties:
        max_attempts:
          type: integer
          format: int32
          description: 'Maximum number of delivery attempts before the delivery is marked failed. Default: 3, Max: 5.'
        retry_interval_seconds:
          type: integer
          format: int32
          description: 'Interval between retry attempts, in seconds. Default: 10.'
      description: Retry policy for a webhook endpoint.
      additionalProperties: true
    v1WebhookSigningKey:
      type: object
      properties:
        id:
          type: string
          description: The id of the signing key.
        endpoint_id:
          type: string
          description: The id of the endpoint this key belongs to.
        secret_prefix:
          type: string
          description: Non-sensitive prefix of the signing secret, for identification in lists.
        status:
          $ref: '#/components/schemas/v1WebhookSigningKeyStatus'
        created_at:
          type: string
          format: date-time
          description: Creation timestamp of the signing key.
        revoked_at:
          type: string
          format: date-time
          description: Revocation timestamp of the signing key. Null while ACTIVE.
      description: Definition of a webhook signing key.
      required:
      - id
      - endpoint_id
      - secret_prefix
      - status
      additionalProperties: true
    v1WebhookSigningKeyStatus:
      type: string
      enum:
      - STATUS_UNSPECIFIED
      - ACTIVE
      - REVOKED
      default: STATUS_UNSPECIFIED
      description: Status indicates whether a signing key is currently usable.
