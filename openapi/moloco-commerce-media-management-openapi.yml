      - WEBHOOK_EVENT_ADVERTISER_RE_ENGAGE_CHURNED
      default: UNKNOWN_NOTIFICATION_EVENT
      description: ' - WEBHOOK_EVENT_CAMPAIGN_BUDGET_HIGH_UPSELL: Webhook events (internal). Public-facing WebhookEvent (mgmtsvc)
        maps 1:1 to these;

        internal DEMAND_AGENT_* map N:1 here (notisvc InternalEventToWebhookEvent).'
    v1NotificationPreferenceUpdate:
