      - INACTIVE
      - ACTIVE
      - ENDED
      - DEPLETED
      - ERROR
      default: UNKNOWN_FILTER_VALUE
      description: " - SCHEDULED: Similar to the Scheduled state of a campaign, the SpendCap is in a “reserved” state because\
        \ its period has not yet started.\n - INACTIVE: The status when the user manually changes the SpendCap from Active\
        \ to Inactive.\n - ACTIVE: The SpendCap is in an Active state. As long as the amount is not depleted, the mapped campaigns\
        \ can remain Active and serve ads without issues\n - ENDED: One of the cases where the SpendCap is no longer Active\
        \ because its defined period has ended.\n - DEPLETED: The SpendCap has reached its allocated amount (0 remaining).\
        \ As a result, the mapped campaigns can no longer remain active and ad serving stops, even though the period itself\
        \ has not yet ended.\n - ERROR: Error state. The campaign state does not belong to any states above."
