      additionalProperties: true
    v1NotificationPreferencesPerChannel:
      type: object
      properties:
        events:
          type: object
          additionalProperties:
            type: boolean
          description: Map of notification event name to opt-in status.
        categories:
          type: object
          additionalProperties:
            type: boolean
          description: Map of notification category name to opt-in status.
      description: Notification preferences per channel. The key is the notification category name, the value is the opt-in
        status.
      additionalProperties: true
    v1OffsiteCampaign:
      type: object
      properties:
        id:
          type: string
          description: 'The id of the OffsiteCampaign. Server-assigned on create; must be unset on

            CreateOffsiteCampaign requests. Required on read and update.'
        platform_id:
          type: string
          description: The platform id that owns this OffsiteCampaign.
        ad_account_id:
          type: string
          description: The AdAccount id that owns this OffsiteCampaign.
        title:
          type: string
          description: A descriptive name. Required on create; seller-mutable.
        enabling_state:
          $ref: '#/components/schemas/OffsiteCampaignEnablingState'
        archived:
          type: boolean
          description: 'Whether this OffsiteCampaign is archived. One-way: unarchive is not supported.

            Archived campaigns are read-only.'
        channel_settings:
          type: array
          items:
            $ref: '#/components/schemas/v1OffsiteChannelSetting'
          description: 'Requested channel intent. M1: exactly one entry with channel = OFFSITE_CHANNEL_GOOGLE.'
        offsite_executions:
          type: array
          items:
            $ref: '#/components/schemas/v1OffsiteExecutionView'
          description: 'Output-only. Seller-safe execution view hydrated from OffsiteChannelExecution.

            Does NOT include raw Google resource names, customer IDs, or unsanitized errors.

            Public RPCs MUST reject this field if set on create/update requests.'
        created_at:
          type: string
          format: date-time
          description: Created timestamp.
        updated_at:
          type: string
          format: date-time
          description: 'Updated timestamp. Used as an optimistic-concurrency token on

            UpdateOffsiteCampaign: callers MUST echo back the value most recently

            returned by ReadOffsiteCampaign, and the service rejects the update if it

            does not match the current persisted value.'
      description: 'OffsiteCampaign is the Portal-facing seller-facing aggregate root for offsite

        campaigns. Admin-internal fields (mutation_id, Google resource names, raw Google

        errors) are intentionally omitted; admin RPCs return the raw OffsiteChannelExecution

        entity instead.'
      additionalProperties: true
    v1OffsiteChannel:
      type: string
      enum:
      - OFFSITE_CHANNEL_UNKNOWN
      - OFFSITE_CHANNEL_GOOGLE
      default: OFFSITE_CHANNEL_UNKNOWN
      description: 'OffsiteChannel identifies which external offsite channel a setting / execution /

        link belongs to.'
    v1OffsiteChannelSetting:
      type: object
      properties:
        channel:
          $ref: '#/components/schemas/v1OffsiteChannel'
        google_setting:
          $ref: '#/components/schemas/v1GoogleSetting'
      description: OffsiteChannelSetting carries the channel-specific seller intent for one offsite channel.
      additionalProperties: true
    v1OffsiteExecutionView:
      type: object
      properties:
        id:
          type: string
        offsite_campaign_id:
          type: string
        channel:
          $ref: '#/components/schemas/v1OffsiteChannel'
        provisioning_state:
          $ref: '#/components/schemas/v1OffsiteProvisioningState'
        serving_state:
          $ref: '#/components/schemas/v1OffsiteServingState'
        last_external_mutation_at:
          type: string
          format: date-time
        last_reconciled_at:
          type: string
          format: date-time
        latest_status_summary:
          type: string
          description: Sanitized human-readable summary. Does NOT contain raw Google error payloads.
      description: 'OffsiteExecutionView is the seller-safe projection of OffsiteChannelExecution returned

        by public (Portal) seller RPCs. Omits Google resource names, customer IDs, raw errors,

        and mutation_id.'
      additionalProperties: true
    v1OffsiteProvisioningState:
      type: string
      enum:
      - OFFSITE_PROVISIONING_STATE_UNKNOWN
      - OFFSITE_PROVISIONING_STATE_CREATING
      - OFFSITE_PROVISIONING_STATE_ACTIVE
      - OFFSITE_PROVISIONING_STATE_UPDATING
      - OFFSITE_PROVISIONING_STATE_SUSPENDING
      - OFFSITE_PROVISIONING_STATE_FAILED
      default: OFFSITE_PROVISIONING_STATE_UNKNOWN
      description: 'OffsiteProvisioningState is the mutation-side state of an OffsiteChannelExecution.

        In-progress values (CREATING / UPDATING / SUSPENDING) gate concurrent Google-mutating

        calls on the same execution.'
    v1OffsiteServingState:
      type: string
      enum:
      - OFFSITE_SERVING_STATE_UNKNOWN
      - OFFSITE_SERVING_STATE_NOT_SERVING
      - OFFSITE_SERVING_STATE_SERVING
      - OFFSITE_SERVING_STATE_PAUSED
      - OFFSITE_SERVING_STATE_SUSPENDED
      - OFFSITE_SERVING_STATE_REMOVED
      default: OFFSITE_SERVING_STATE_UNKNOWN
      description: 'OffsiteServingState is the observed serving state of the external (Google) campaign.

        Refreshed periodically by GoogleStatusSync. The seller intent

        (OffsiteCampaign.enabling_state) can diverge from serving_state.'
    v1Order:
