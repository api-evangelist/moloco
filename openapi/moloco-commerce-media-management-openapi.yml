    v1Campaign:
      type: object
      properties:
        id:
          type: string
          description: The id of the campaign. Must be left unset for the campaign creation request. Must be set for the other
            requests.
        title:
          type: string
          description: A descriptive name of the campaign.
        ad_account_id:
          type: string
          description: The id of the ad account that owns this campaign. It is platform-specific ad_account_id. Value and
            format can vary according to each Platform.
        hidden:
          type: boolean
          description: 'if this value is true, it means that a campaign is no longer visible and has been archived. Only disabled
            or ended campaigns could be hidden. Optional(Default: False).'
        ad_type:
          $ref: '#/components/schemas/rmpcommonAdType'
        schedule:
          $ref: '#/components/schemas/rmpcommonTimeInterval'
        daily_budget:
          $ref: '#/components/schemas/rmpcommonMoneyMicro'
        budget:
          $ref: '#/components/schemas/rmpcommonBudget'
        targeting:
          $ref: '#/components/schemas/v1Targeting'
        goal:
          $ref: '#/components/schemas/managementv1CampaignGoal'
        catalog_item_ids:
          type: array
          items:
            type: string
          description: List of catalog items belonging to the campaign. A catalog item id can be a product id or deal id in
            the catalogs. Note that an item can belong to multiple campaigns.
        enabling_state:
          $ref: '#/components/schemas/commonCampaignEnablingState'
        state:
          $ref: '#/components/schemas/CampaignCampaignState'
        created_at:
          type: string
          format: date-time
          description: Created timestamp. API user should not touch this field; it is set internally.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: This field represents the last time the campaign was modified.  The system sets this value internally
            for you when you create or update a campaign, so make sure this value matches the latest updated_at you received
            from the ReadCampaign API.
        item_selection:
          $ref: '#/components/schemas/CampaignCampaignItemSelection'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/commonAsset'
          description: Assets for the campaign. It contains all assets that would be used in the campaign. For the ad serving,
            only latest approved asset for each dimension would be used.
        landing_pages:
          type: array
          items:
            $ref: '#/components/schemas/commonCampaignLandingPage'
          description: Landing pages for the campaign. It contains all landing pages that would be used in the campaign. For
            the ad serving, only latest approved landing page would be used.
        spend_cap_id:
          type: string
          description: The id of the spend cap that applies to this campaign. Available for SELF_SERVED performance-based
            sponsored ads campaigns on platforms with Spend Cap enabled. Once set, it cannot be changed.
        ad_operation_type:
          $ref: '#/components/schemas/campaignAdOperationType'
        alias:
          type: string
          description: The alias is the platform-defined identifier for the campaign.
      description: Definition of a campaign.
      required:
      - ad_account_id
      - schedule
      - ad_type
      - goal
      - catalog_item_ids
      - enabling_state
      - created_at
      additionalProperties: true
