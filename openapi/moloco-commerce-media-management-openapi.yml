      - REVOKE_AD_MANAGER_ACCOUNT_USER
      - CHANGE_AD_MANAGER_ACCOUNT_USER_ROLE
      - ACTIVATE_AD_ACCOUNT
      - REJECT_AD_ELEMENT
      - FAIL_VIDEO_TRANSCODING
      - DEMAND_AGENT_NEW_ITEMS
      - DEMAND_AGENT_CURATED_TRENDING
      - DEMAND_AGENT_HIGH_POTENTIAL
      - DEMAND_AGENT_SIMILAR_SELLERS
      - DEMAND_AGENT_NEW_ADVERTISERS
      - DEMAND_AGENT_TOP_SELLERS
      - DEMAND_AGENT_BU_HIGH
