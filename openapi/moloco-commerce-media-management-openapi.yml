          type: number
          format: double
          description: ROAS in percent.
        roas_breakdown:
          $ref: '#/components/schemas/commonHaloMetricDouble'
        cr:
          type: number
          format: double
          description: CR. Click to Purchase rate.
        ctr:
          type: number
          format: double
          description: CTR. Click divided by Impressions.
        ctr_item:
          type: number
          format: double
          description: CTR per item-level impression. Click divided by imp_item_count, in percent. Only populated for item-level
            group by results with Sponsored Brand campaign.
        imp_to_purchase:
          type: number
          format: double
          description: CTR multiplied by CR (CTR x CR).
        imp_item_to_purchase:
          type: number
          format: double
          description: Purchase rate per item-level impression. Purchase divided by imp_item_count, in percent. Only populated
            for item-level group by results with Sponsored Brand campaign.
        num_ad_accounts:
          type: string
          format: int64
          description: Number of active ad accounts during selected time period (platform summary specific).
        items_per_ad_account:
          type: number
          format: double
          description: Items per ad account (platform summary specific).
        cpc:
          type: number
          format: double
          description: CPC (Cost Per Click) in a micro unit.
        acos:
          type: number
          format: double
          description: Advertising cost of sales in percent. Ad Spending / Revenue
        cpm:
          type: number
          format: double
          description: CPM (Cost Per 1,000 Impressions) in a micro unit.
        cpm_item:
          type: number
          format: double
          description: CPM per item-level impression in a micro unit. Money spent divided by imp_item_count, multiplied by
            1,000. Only populated for item-level group by results with Sponsored Brand campaign.
