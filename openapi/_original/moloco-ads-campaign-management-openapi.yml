security:
- Bearer: []
servers:
- url: https://api.moloco.cloud
components:
  requestBodies:
    dspCustomerSet:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dspCustomerSet'
      description: The CustomerSet data.
      required: true
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
  schemas:
    AdAccountTargetFuturePreferenceInfo:
      type: object
      properties:
        product_scope:
          $ref: '#/components/schemas/TargetFuturePreferenceInfoProductScope'
        custom_products:
          $ref: '#/components/schemas/TargetFuturePreferenceInfoCustomProducts'
      description: 'TargetFuturePreferenceInfo contains each target''s future preference information.

        If the newly created Campaign satisfies the condition of target future preference info

        the target will be automatically assigned to that Campaign.'
    AnalyticsSKAdNetworkSKANConversionColumn:
      type: object
      properties:
        conversion_value:
          type: string
          description: SKAdNetwork fine-grained conversion value. ToString([0, 63]) or "NULL".
        version:
          type: string
          description: SKAdNetwork version. (e.g, 2.0, 2.1, 2.2).
        fidelity_type:
          type: string
          description: 'Raw SKAdNetwork fidelity type defined in Apple''s following document.

            https://developer.apple.com/documentation/storekit/skadnetwork/receiving_ad_attributions_and_postbacks

            As of June 2021, values are ToString([0, 1]) or "NULL".'
        conversion_count:
          type: string
          format: int64
          description: 'The total number of SKAdNetwork conversions.


            It counts all SKAdNetwork conversions having did-win value as null for before version 3.0, and true for version
            3.0 and later.

            See did-win flag in the [following document](https://developer.apple.com/documentation/storekit/skadnetwork/verifying_an_install-validation_postback?language=objc)
            for further details.'
        non_winning_conversion_count:
          type: string
          format: int64
          description: 'The total number of non-winning SKAdNetwork conversions.

            It counts all SKAdNetwork conversions having did-win value as false for version 3.0 and later.

            See did-win flag in the [following document](https://developer.apple.com/documentation/storekit/skadnetwork/verifying_an_install-validation_postback?language=objc)
            for further details.'
        conversion_events:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/AnalyticsSKAdNetworkSKANConversionEventColumn'
          description: SKAdNetwork Conversion Events associated with this specific conversion_value.
      description: SKANConversionColumn represents a structured column containing SKAdNetwork conversion value and its count
        for the current row.
    AnalyticsSKAdNetworkSKANConversionDimension:
      type: string
      enum:
      - UNKNOWN_SKAN_CONVERSION_DIMENSION
      - CONVERSION_VALUE
      - VERSION
      - FIDELITY_TYPE
      default: UNKNOWN_SKAN_CONVERSION_DIMENSION
      description: "SKANConversionDimension enumerates available SKAN conversion related dimensions.\n\n - UNKNOWN_SKAN_CONVERSION_DIMENSION:\
        \ This value is not part of the API specification."
    AnalyticsSKAdNetworkSKANConversionEventColumn:
      type: object
      properties:
        name:
          type: string
          description: Conversion event name.
        count:
          type: string
          format: int64
          description: The total number of conversions for a specific event.
        revenue_min_sum:
          type: number
          format: double
          description: The min sum value of revenue interval in conversion event.
        revenue_max_sum:
          type: number
          format: double
          description: The max sum value of revenue interval in conversion event.
      description: SKANConversionEventColumn represents a structured column containing the derived conversion event from SKAdNetwork
        conversion value.
    AppPropertiesAppEventType:
      type: string
      enum:
      - UNKNOWN
      - IN_APP_ADVERTISING
      - IN_APP_PURCHASE
      - SIGN_UP
      - SUBSCRIPTION
      - PREDICTED_LIFETIME_VALUE
      - ACHIEVE_LEVEL
      - START_TRIAL
      - ADD_PAYMENT_INFO
      - VIEW_PRODUCT_OR_CONTENT
      - ADD_TO_WISHLIST
      - SEARCH
      - ADD_TO_CART
      - BEGIN_CHECKOUT
      - FIRST_DEPOSIT
      - FIRST_TRADE
      - OTHER
      default: UNKNOWN
      description: AppEventType indicates standardized event types representing each in-app event.
    AppPropertiesAppScreenshots:
      type: object
      properties:
        urls:
          type: array
          items:
            type: string
    AppPropertiesIosPrimaryMeasurement:
      type: string
      enum:
      - IOS_PRIMARY_MEASUREMENT_UNKNOWN
      - IOS_PRIMARY_MEASUREMENT_NONE
      - IOS_PRIMARY_MEASUREMENT_SKAN
      - IOS_PRIMARY_MEASUREMENT_MMP
      default: IOS_PRIMARY_MEASUREMENT_UNKNOWN
      description: "Primary measurement used for iOS apps.\n\n - IOS_PRIMARY_MEASUREMENT_UNKNOWN: Zero value. Every non-iOS\
        \ app must have this value.\n - IOS_PRIMARY_MEASUREMENT_NONE: Unset value for iOS app. It means the primary measurement\
        \ is not decided yet.\n - IOS_PRIMARY_MEASUREMENT_SKAN: SKAdNetwork (SKAN)\n - IOS_PRIMARY_MEASUREMENT_MMP: MMP Probabilistic\
        \ Attribution"
    AppPropertiesIosSecondaryMeasurement:
      type: string
      enum:
      - IOS_SECONDARY_MEASUREMENT_UNKNOWN
      - IOS_SECONDARY_MEASUREMENT_NONE
      - IOS_SECONDARY_MEASUREMENT_NA
      - IOS_SECONDARY_MEASUREMENT_SKAN
      - IOS_SECONDARY_MEASUREMENT_MMP
      - IOS_SECONDARY_MEASUREMENT_OTHER_MMP
      - IOS_SECONDARY_MEASUREMENT_OTHER_3P
      - IOS_SECONDARY_MEASUREMENT_INCREMENTALITY
      - IOS_SECONDARY_MEASUREMENT_CUSTOM
      default: IOS_SECONDARY_MEASUREMENT_UNKNOWN
      description: "Secondary measurement used for iOS apps.\n\n - IOS_SECONDARY_MEASUREMENT_UNKNOWN: Zero value. Every non-iOS\
        \ app must have this value.\n - IOS_SECONDARY_MEASUREMENT_NONE: Unset value for iOS app. It means the secondary measurement\
        \ is not decided yet.\n - IOS_SECONDARY_MEASUREMENT_NA: Not applicable. It means the iOS app does not use any secondary\
        \ measurement.\n - IOS_SECONDARY_MEASUREMENT_SKAN: SKAdNetwork (SKAN). SKAN cannot be configured as both the primary\
        \ and secondary measurement. If a secondary measurement is not required, use 'NA'.\n - IOS_SECONDARY_MEASUREMENT_MMP:\
        \ MMP Probabilistic Attribution. MMP cannot be configured as both the primary and secondary measurement. If a secondary\
        \ measurement is not required, use 'NA'.\n - IOS_SECONDARY_MEASUREMENT_OTHER_MMP: Other MMP measurements (e.g., unified\
        \ iOS reporting, AppsFlyer SSOT, etc.)\n - IOS_SECONDARY_MEASUREMENT_OTHER_3P: Other 3P measurement tool (e.g., some\
        \ customers are using other BI tools)\n - IOS_SECONDARY_MEASUREMENT_INCREMENTALITY: Incrementality measurement\n -\
        \ IOS_SECONDARY_MEASUREMENT_CUSTOM: Custom measurement"
    AudienceTargetingConditionCoppaAcceptance:
