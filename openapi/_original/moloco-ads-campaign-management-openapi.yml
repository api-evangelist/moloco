        tuesday_budget:
          $ref: '#/components/schemas/adcloudcommonMoney'
        wednesday_budget:
          $ref: '#/components/schemas/adcloudcommonMoney'
        thursday_budget:
          $ref: '#/components/schemas/adcloudcommonMoney'
        friday_budget:
          $ref: '#/components/schemas/adcloudcommonMoney'
        saturday_budget:
          $ref: '#/components/schemas/adcloudcommonMoney'
        sunday_budget:
          $ref: '#/components/schemas/adcloudcommonMoney'
      description: Budget for each day of the week; all 7-day budgets need be filled for use.
    dspEntityCount:
      type: object
      properties:
        scope_type:
          $ref: '#/components/schemas/commonEntityType'
          description: Scope of the EntityCount.
        limit:
          type: string
          format: int64
          description: 'The total number of entities allowed under the scope type.

            ''limit'' for the entity is different for each scope type.

            Visit the [guide document](https://developer.moloco.cloud/docs/entity-quota) for more details.'
        current:
          type: string
          format: int64
          description: The number of entities created so far.
      description: EntityCount contains the limit and the number of the entities under the particular scope.
    dspInAppEventCondition:
      type: object
      properties:
        attribution:
          $ref: '#/components/schemas/InAppEventConditionAttribution'
        revenue:
          $ref: '#/components/schemas/InAppEventConditionRevenue'
        time_window:
          $ref: '#/components/schemas/InAppEventConditionTimeWindow'
    dspLog:
      type: object
