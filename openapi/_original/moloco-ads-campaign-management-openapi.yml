          description: Error. Detailed cause can be found in the `details` field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messagesListCreativeReviewsError'
      parameters:
      - name: ad_account_id
        in: query
        required: false
        schema:
          type: string
      - name: review_states
        description: "The CreativeReview status to retrieve.\nRetrieves all status as a default (If it is empty).\nIt should\
          \ be given by query params in the REST API. (e.g. ?review_states=UNDER_REVIEW&review_states=APPROVED).\n\n - UNDER_REVIEW:\
          \ Creative is currently under review.\n - APPROVED: Creative has been accepted by the exchange.\n - BLOCKED: Creative\
          \ has been rejected by the exchange.\n - ETC: Refer to ReviewAction for more details.\n - APPROVED_FOR_ADULTS: Creative\
          \ has been accepted only for adults by the exchange.\n - GOOGLE_PLATFORM_APPROVED: Creative is rejected by ADX (and\
          \ ADX_RTB) on network policy but approved on platform policy.\nIn ADX requests, a flag will indicate whether a creative\
          \ with this status can bid.\nThis status will only be used in ADX reviews."
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - UNKNOWN
            - UNDER_REVIEW
            - APPROVED
            - BLOCKED
            - ETC
            - APPROVED_FOR_ADULTS
            - GOOGLE_PLATFORM_APPROVED
      - name: campaign_states
        description: "The Campaign status of the list of CreativeGroups used by.\nRetrieves all status as a default (If it\
          \ is empty).\nIt should be given by query params in the REST API. (e.g. ?campaign_states=DRAFT&campaign_states=SUBMITTED).\n\
          \n - SUBMITTED: All the required data are entered and passed all the validation. It's eligible\nto be reviewed by\
          \ Moloco for activation.\n - READY: Campaign is before schedule and internally ready but disabled.\nWill transit\
          \ to PAUSED when it becomes on schdule.\n - UPCOMING: Campaign is before schedule and internally ready and disabled.\n\
          Will transit to ACTIVE when it becomes on schdule.\n - ACTIVE: Campaign is on schedule and spending the budget.\n\
          \ - PAUSED: Campaign is paused and not spending the budget.\n - SUSPENDED: Campaign activation is suspended by the\
          \ system for the following reasons:\n- App has been found to be in violation of Moloco's creative policy.\n - COMPLETED:\
          \ Campaign is completed but may still get attributions for some time."
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - UNKNOWN_CAMPAIGN_STATE
            - SUBMITTED
            - READY
            - UPCOMING
            - ACTIVE
            - PAUSED
            - SUSPENDED
            - COMPLETED
      tags:
      - Creative
  /cm/v1/creatives:
    get:
      summary: List up Creatives.
      description: List up all creatives of the AdAccount or the Product.
      operationId: DspApi_ListCreatives
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messagesListCreativesResponse'
        default:
          description: Error. Detailed cause can be found in the `details` field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messagesListCreativesError'
      parameters:
      - name: ad_account_id
        description: The AdAccount ID to which the Creatives belong to.
        in: query
        required: true
        schema:
          type: string
      - name: product_id
        description: The Product ID to which the Creatives belong to.
        in: query
        required: false
        schema:
          type: string
      - name: types
        description: "The type of the Creatives to be listed.\nIf not specified, all types of Creatives will be listed.\n\n\
          \ - UNKNOWN_TYPE: This value is not part of the specification.\n - IMAGE: Image Creative. The image Creative source\
          \ must be specified for this type.\n - VIDEO: Video Creative. The video Creative source must be specified for this\
          \ type.\n - VAST_VIDEO: Vast video Creative. The vast video Creative source must be specified for this type.\n -\
          \ NATIVE: Deprecated. v1.5 is the last version supporting this version.\nNative Creative. The native Creative source\
          \ must be specified for this type.\n - NATIVE_IMAGE: Native image Creative. The native image Creative source must\
          \ be specified for this type.\n - NATIVE_VIDEO: Native video Creative. The native video Creative source must be\
          \ specified for this type.\n - CUSTOM_HTML: (Will be supported soon) Custom HTML Creative. The custom HTML Creative\
          \ source must be specified for this type.\n - TEMPLATE_HTML: (Will be supported soon) Template HTML Creative. The\
          \ template HTML Creative source must be specified for this type.\n - RICH_CUSTOM_HTML: The rich custom HTML Creative.\
          \ The rich custom HTML Creative source must be specified for this type.\n - DYNAMIC_HTML: (Will be supported soon)\
          \ The dynamic HTML Creative. The dynamic HTML Creative source must be specified for this type.\n - AD_TAG: (Will\
          \ be supported soon) Third-party ad tag Creative with script-based or vast tag-based ad tag."
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - UNKNOWN_TYPE
            - IMAGE
            - VIDEO
            - VAST_VIDEO
            - NATIVE
            - NATIVE_IMAGE
            - NATIVE_VIDEO
            - CUSTOM_HTML
            - TEMPLATE_HTML
            - RICH_CUSTOM_HTML
            - DYNAMIC_HTML
            - AD_TAG
      - name: order_by.key
        in: query
        required: false
        schema:
          type: string
          enum:
          - UNKNOWN_ORDER_BY
          - UPDATED_AT
          default: UNKNOWN_ORDER_BY
      - name: order_by.is_descending
        in: query
        required: false
        schema:
          type: boolean
      - name: inquiry_option
        description: "InquiryOption to specify which information to retrieve.\n\n - INQUIRY_ENTITY: Only the target entity\
          \ itself is returned in response.\nThis InquiryOption is faster than other options as it reads the single entity\
          \ from the database.\n - INQUIRY_OVERVIEW: The target entity's overview information is returned in response.\nIn\
          \ general, the overview information includes the brief content of the target entity and its related entities.\n\
          This InquiryOption is slower than INQUIRY_ENTITY but the returned data size is usually smaller than that.\n - INQUIRY_ALL:\
          \ The target entity and its summary information is returned in response.\nThis InquiryOption is equivalent to INQUIRY_ENTITY\
          \ + INQUIRY_OVERVIEW, and it's slow and big."
        in: query
        required: false
        schema:
          type: string
          enum:
          - UNKNOWN_INQUIRY_OPTION
          - INQUIRY_ENTITY
          - INQUIRY_OVERVIEW
          - INQUIRY_ALL
          default: UNKNOWN_INQUIRY_OPTION
      tags:
      - Creative
    delete:
      summary: Delete existing Creatives.
      description: Delete existing creatives.
      operationId: DspApi_DeleteCreativesBulk
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messagesDeleteCreativesBulkResponse'
        default:
