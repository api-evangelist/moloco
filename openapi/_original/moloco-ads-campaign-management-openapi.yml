    messagesInquiryOption:
      type: string
      enum:
      - UNKNOWN_INQUIRY_OPTION
      - INQUIRY_ENTITY
      - INQUIRY_OVERVIEW
      - INQUIRY_ALL
      default: UNKNOWN_INQUIRY_OPTION
      description: "InquiryOption defines what information you want for the target entity when sending a request query.\n\
        Some of the resources support InquiryOption for List operation, and the actual behavior is defined by each API.\n\n\
        This value is not part of the specification.\n\n - INQUIRY_ENTITY: Only the target entity itself is returned in response.\n\
        This InquiryOption is faster than other options as it reads the single entity from the database.\n - INQUIRY_OVERVIEW:\
        \ The target entity's overview information is returned in response.\nIn general, the overview information includes\
        \ the brief content of the target entity and its related entities.\nThis InquiryOption is slower than INQUIRY_ENTITY\
        \ but the returned data size is usually smaller than that.\n - INQUIRY_ALL: The target entity and its summary information\
        \ is returned in response.\nThis InquiryOption is equivalent to INQUIRY_ENTITY + INQUIRY_OVERVIEW, and it's slow and\
        \ big."
