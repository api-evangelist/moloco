          type: boolean
          description: 'A flag to allow empty value of advertiser_domain. Setting this flag to true acknowledges that some
            exchanges may deny campaigns if the advertiser_domain is empty.

            From v1.7.4, the value should be true if the value of advertiser_domain is empty.'
        device_os:
          $ref: '#/components/schemas/commonDeviceOs'
          description: Device OS of the Product. It means that the OS of the device where the Campaign of this Product is
            provided.
        developer_name:
          type: string
          description: 'The developer name of the Product. Some publishers request the sponsor information for the native
            Creative.

            The value of developer_name will be used to fill that information. Please note that this value could be displayed
            on user''s screen.

            If this field is empty, native Creative''s title will be used.'
        type:
          $ref: '#/components/schemas/dspProductType'
          description: The type of the Product.
        app:
          $ref: '#/components/schemas/ProductAppProperties'
          description: Required for APP type.
        web:
          $ref: '#/components/schemas/ProductWebProperties'
          description: Required for WEB type.
        dynamic_creative_property:
          $ref: '#/components/schemas/ProductDynamicCreativeProperty'
          description: Properties for using dynamic Creative. Immutable.
        suspension_history:
          type: array
