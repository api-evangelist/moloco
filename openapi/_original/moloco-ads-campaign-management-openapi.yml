    dspAudienceTargetingCondition:
      type: object
      properties:
        allowed_countries:
          type: array
          items:
            type: string
          description: Allowed countries in ISO_3166-1_alpha-3 format.
        blocked_countries:
          type: array
          items:
            type: string
          description: Blocked countries in ISO_3166-1_alpha-3 format.
        placement_reasons:
          type: array
          items:
            $ref: '#/components/schemas/AudienceTargetingConditionPlacementReason'
        custom_placement_reason:
          type: string
          description: The reason of the placement in free-form text.
        allowed_app_bundles:
          type: array
          items:
            type: string
          description: "App bundles. A bid-request having a matching publisher app bundle from the list\nwill be accepted.\n\
            \nExample to target com.moloco.game or com.moloco.travel apps:\n\n  \"allowed_app_bundles\": [ \"com.moloco.game\"\
            , \"com.moloco.travel\" ]\n\nExample to exclude com.moloco.office app:\n\n  \"blocked_app_bundles\": [ \"com.moloco.office\"\
            \ ]"
        blocked_app_bundles:
          type: array
          items:
            type: string
          description: See the documentation for `allowed_app_bundles`.
        allowed_content_categories:
          type: array
          items:
            type: string
          description: "Filter for allowed publisher IAB categories.\n\nValid category values can be found in section \"5.1\
            \ Content Categories\" in the \"OpenRTB API Specification\":\n   https://github.com/openrtb/OpenRTB/blob/master/OpenRTB-API-Specification-Version-2-3-1-FINAL.pdf\n\
            \nFor example: \"allowed_content_categories\": [ \"IAB26-1\" ]"
        blocked_content_categories:
          type: array
          items:
            type: string
          description: "Filter for blocked publisher IAB categories.\n\nValid category values can be found in section \"5.1\
            \ Content Categories\" in the \"OpenRTB API Specification\":\n   https://github.com/openrtb/OpenRTB/blob/master/OpenRTB-API-Specification-Version-2-3-1-FINAL.pdf\n\
            \nFor example: \"blocked_content_categories\": [ \"IAB26-1\" ]"
        allowed_cities:
          type: array
          items:
            type: string
          description: "Allowed cities. A bid-request will be accepted when there is at least one\nmatch from the city list.\
            \ Note that each element must be in\nthe form of \"city, region\" such as \"Seattle, WA\" in order to disambiguate\n\
            the same city but different regions. The entry is case-insensitive\nand whitespace will be ignored.\n\nExample\
            \ to target Seattle or Newyork:\n\n  \"allowed_cities\": [ \"Seattle, WA\", \"Newyork, ny\" ]"
        blocked_cities:
          type: array
          items:
            type: string
          description: Blocked cities.
        allowed_creative_types:
          type: array
          items:
            $ref: '#/components/schemas/adcloudcommonCreativeType'
          description: Allowed Creative types.
        blocked_creative_types:
          type: array
          items:
            $ref: '#/components/schemas/adcloudcommonCreativeType'
          description: Blocked Creative types.
        allowed_websites:
          type: array
          items:
            type: string
          description: 'Allowed websites. A glob pattern can be used for matching. Ignored for app inventories.


            For example: "allowed_websites": [ "*youtube.com" ].'
        blocked_websites:
          type: array
          items:
            type: string
          description: 'Blocked websites. A glob pattern can be used for matching. Ignored for app inventories.


            For example: "blocked_websites": [ "*example.com" ].'
        allowed_geofences:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/commonCircle'
          description: Allowed geofences.
        blocked_geofences:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/commonCircle'
          description: Blocked geofences.
        allowed_exchanges:
          type: array
          items:
            $ref: '#/components/schemas/commonAdExchange'
          description: 'Allowed ad exchanges. Restricts targeting to bid only on the listed

            exchanges; an empty list places no restriction.


            MOLOCO_SDK is automatically included whenever the list is non-empty:

            submitting a non-empty list that omits MOLOCO_SDK will have it

            appended on the server side.'
        blocked_exchanges:
          type: array
          items:
            $ref: '#/components/schemas/commonAdExchange'
          description: 'Blocked ad exchanges. Excludes the listed exchanges from targeting.


            Adding MOLOCO_SDK to this list is rejected with PERMISSION_DENIED.'
        allowed_idfas:
          type: array
          items:
            type: string
          description: Allowed user IDFAs. IDFA supports glob; e.g. use "*f" to match all IDFAs ending with "f".
        blocked_idfas:
          type: array
          items:
            type: string
          description: Blocked user IDFAs. IDFA supports glob; e.g. use "*f" to match all IDFAs ending with "f".
        allowed_zipcodes:
          type: array
          items:
            type: string
          description: Allowed zipcodes.
        blocked_zipcodes:
          type: array
          items:
            type: string
          description: Blocked zipcodes.
        allowed_device_models:
          type: array
          items:
            type: string
          description: "Allowed device models.\n\nFor example:\n\n   \"allowed_device_models\": [ \"KFFOWI\", \"KFGIWI\",\
            \ \"KFTT\", \"KFJWA\" ]"
        blocked_device_models:
          type: array
          items:
            type: string
          description: Blocked device models.
        allowed_user_audience_tags:
          type: array
          items:
            type: string
          description: Allowed user custom audience tags.
        blocked_user_audience_tags:
          type: array
          items:
            type: string
          description: Blocked user custom audience tags.
        allowed_languages:
          type: array
          items:
            type: string
          description: 'Allowed languages. Languages in use mostly follow ISO 639-1 code(https://www.loc.gov/standards/iso639-2/php/code_list.php),

            e.g. "ko" for Korean and "en" for English.'
        blocked_languages:
          type: array
          items:
            type: string
          description: Blocked languages.
        allowed_device_types:
          type: array
          items:
            $ref: '#/components/schemas/commonDeviceType'
          description: 'Allowed device types.


            For example: "allowed_device_types": [ "HIGHEND_PHONE", "TABLET" ]'
        blocked_device_types:
          type: array
          items:
            $ref: '#/components/schemas/commonDeviceType'
          description: 'Blocked device types.


            For example: "allowed_device_types": [ "SET_TOP_BOX" ]'
        allowed_mostly_visited_countries:
          type: array
          items:
            type: string
          description: 'This filter checks user''s history of mostly visited countries against the specified

            countries in the condition, and passes a request if there is at least one common entry

            in both lists.'
        blocked_mostly_visited_countries:
          type: array
          items:
            type: string
        allowed_regions:
          type: array
          items:
            type: string
          description: Regions are to filter a bid-request based on its region information.
        blocked_regions:
          type: array
          items:
            type: string
        allowed_recent_campaign_activities:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/AudienceTargetingConditionRecentCampaignActivityFilter'
          description: "Recent Campaign activities filter a bid-request by user's recent activity such as click or install\n\
            in the last n days. The filter is satisfied if there is at least one satisfying condition among the list.\n\n\
            Example to target a user who has a click event for com.moloco.gameapp:\n\n   \"allowed_recent_campaign_activities\"\
            : [\n      {\n         \"campaign_id\": \"com.moloco.gameapp\",\n         \"event\": \"CLICK\"\n      }\n   ]\n\
            \nExample to block a user who has a install event for com.moloco.officeapp within the past five days:\n\n   \"\
            blocked_recent_campaign_activities\": [\n      {\n         \"campaign_id\": \"com.moloco.officeapp\",\n      \
            \   \"event\": \"INSTALL\",\n         \"last_n_days\": 5\n      }\n   ]"
        blocked_recent_campaign_activities:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/AudienceTargetingConditionRecentCampaignActivityFilter'
        allowed_locations:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/AudienceTargetingConditionLocationFilter'
          description: 'Location filter targets specific geo-locational audience using combined conditions

            of different types such as city, region, zipcode and geofence.'
        blocked_locations:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/AudienceTargetingConditionLocationFilter'
        genders:
          type: array
          items:
            $ref: '#/components/schemas/commonGender'
        connection_types:
          type: array
          items:
            type: string
          description: 'Connection_types include ETHERNET, WIFI, CELL_UNKNOWN, CELL_2G, CELL_3G, CELL_4G.


            For example: "connection_types": [ "WIFI", "CELL_4G" ]'
        allowed_direct_deal_ids:
          type: array
          items:
            type: string
          description: "IDs of the allowed direct deals. A bid-request is accepted only if there is at least one matching\
            \ id.\n\nFor example:\n\n   \"allowed_direct_deal_ids\": [\n      \"ip_9161499632014fe8b9ef60673a51b745\",\n \
            \     \"ip_e13c0cb23dd54a8ea742b2af61e0712d\",\n      \"ip_0cfeaebb190d47df8b86399232853e23\"\n   ]"
        blocked_direct_deal_ids:
          type: array
          items:
            type: string
          description: IDs of the blocked direct deals.
        device_oses:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/AudienceTargetingConditionDeviceOsFilter'
          description: Device OS requirements if specified.
        media_channel_type:
          $ref: '#/components/schemas/AudienceTargetingConditionMediaChannelType'
          description: Media channel types.
        new_users:
          $ref: '#/components/schemas/AudienceTargetingConditionNewUserFilter'
          description: "Filter to target only new users.\n\nExample to accept a bid-request for new users with earliest known\
            \ activities within the last 5 days:\n\n   \"new_users\": {\n      \"last_n_days\": 5\n   }"
        advertiser_id_types:
          type: array
          items:
            $ref: '#/components/schemas/commonAdvertiserIdType'
          description: Filter on advising ID types, including "ANDROID_IDFA" or "IOS_IDFA".
        allowed_video_types:
          type: array
          items:
            $ref: '#/components/schemas/dspAudienceTargetingConditionVideoType'
          description: Video type filter. Ignored when the bid request is not for video ads.
        blocked_video_types:
          type: array
          items:
            $ref: '#/components/schemas/dspAudienceTargetingConditionVideoType'
        weekly_schedules:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/AudienceTargetingConditionWeeklyScheduleFilter'
          description: "Weekly schedule specifies more fine-grained time range filtering for days of a week. For example,\n\
            this list can be used to specify commute time ranges in the morning and evening on workdays.\n\nExample to target\
            \ 7-9 am and 5-7 pm during week days:\n\n     \"weekly_schedules\": [\n        {\n           \"hour_range\": {\n\
            \              \"start\": 7,\n              \"end\": 9\n           },\n           \"days\": [ \"MON\", \"TUE\"\
            , \"WED\", \"THU\", \"FRI\" ]\n        },\n        {\n           \"hour_range\": {\n               \"start\":\
            \ 17,\n               \"end\": 19\n           },\n           \"days\": [ \"MON\", \"TUE\", \"WED\", \"THU\", \"\
            FRI\" ]\n        }\n     ]\n\nExample to target 10pm to 2am on Fridays and Saturdays:\n\n  \"weekly_schedules\"\
            : [\n      {\n         \"range\": {\n             \"start\": 22,\n             \"end\": 2\n         },\n     \
            \    \"days\": [ \"FRI\", \"SAT\" ]\n      }\n  ]"
        allowed_gender_score:
          $ref: '#/components/schemas/adcloudcommonFloatingPointRange'
          description: 'Gender score filter uses approximated gender score probability distribution in

            the range of [0, 1], with 0 indicating a strong probability of male, and 1 indicating

            a strong probability of female.


            The filter is specified with a range of [start, end] to filter on user''s gender score.'
        blocked_gender_score:
          $ref: '#/components/schemas/adcloudcommonFloatingPointRange'
        allowed_ages:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/adcloudcommonInterval'
          description: 'Age is used to filter based on user''s approximate age. A valid value must be in

            the exclusive range of (0, 100).'
        blocked_ages:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/adcloudcommonInterval'
        allowed_ip_ranges:
          type: array
          items:
            type: string
          description: "IP net based condition. The CIDR format must be used for an entry such as\nhttps://en.wikipedia.org/wiki/Classless_Inter-Domain_Routing.\n\
            Note that both of IP v4 and v6 could be used at the same time.\n\nExample to block bid-requests with any IP within\
            \ 32.76.52.0 - 32.76.52.255 or 127.0.0.0 - 127.255.255.255:\n\n   \"blocked_ip_ranges\": [\n     \"32.76.52.0/24\"\
            ,\n     \"127.0.0.0/8\"\n   ]"
        blocked_ip_ranges:
          type: array
          items:
            type: string
        allowed_device_carriers:
          type: array
          items:
            type: string
          description: "Device carrier filter.\n\nExample to target SKT:\n\n   \"allowed_device_carriers\": [ \"SKTelecom\"\
            \ ]\n\n\nExample to exclude T-MOBILE and XFINITY Mobile\n\n   \"blocked_device_carriers\": [ \"T-MOBILE\", \"\
            XFINITY Mobile\" ]"
        blocked_device_carriers:
          type: array
          items:
            type: string
        allowed_keywords:
          type: array
          items:
            type: string
          description: 'Filter regarding ''keywords'' field in a bid request.


            If specified, an ad request must have at least one of the allowed keywords

            to satisfy the filter.'
        blocked_keywords:
          type: array
          items:
            type: string
          description: 'Filter regarding ''keywords'' field in a bid request.


            An ad request must not have any of the blocked keywords to satisfy the filter.'
        user_buckets:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/adcloudcommonInterval'
          description: Filter for the user buckets.
        allowed_ad_units:
          type: array
          items:
            type: string
          description: '// Target timetree_i_prod or timetree_a_prod ad_units

            "condition": {

            "allowed_ad_units": [ "timetree_i_prod", "timetree_a_prod" ]

            }


            // Exclude timetree_i_test ad_unit

            "condition": {

            "blocked_ad_units": [ "timetree_i_test" ]

            }'
          title: 'Example:'
        blocked_ad_units:
          type: array
          items:
            type: string
        allowed_placements:
          type: array
          items:
            type: string
          description: placement (a group of ad_units) names. It is untied to ad_units, and follow the ad_unit's filtering
            rule.
        blocked_placements:
          type: array
          items:
            type: string
        allowed_banner_apis:
          type: array
          items:
            $ref: '#/components/schemas/commonBannerApi'
          description: '// Target MRAID_2 banner only

            "condition": {

            "allowed_banner_apis": [ "MRAID_2" ]

            }'
          title: 'Example:'
        blocked_banner_apis:
          type: array
          items:
            $ref: '#/components/schemas/commonBannerApi'
        schedule:
          $ref: '#/components/schemas/commonTimeInterval'
          description: "Schedule to allow bid-requests in a absolute time range, where start and end\nare in RFC3339 format.\
            \ A few example from https://tools.ietf.org/html/rfc3999\nis listed below.\n\n     1985-04-12T23:20:50.52Z\n\n\
            \  This represents 20 minutes and 50.52 seconds after the 23rd hour of\n  April 12th, 1985 in UTC.\n\n\n     1996-12-19T16:39:57-08:00\n\
            \n  This represents 39 minutes and 57 seconds after the 16th hour of\n  December 19th, 1996 with an offset of\
            \ -08:00 from UTC (Pacific\n  Standard Time).  Note that this is equivalent to 1996-12-20T00:39:57Z\n  in UTC.\n\
            \n   Example:\n\n   // Christmas through end of the year\n   \"condition\": {\n       \"schedule\": {\n      \
            \     \"start\": \"2020-12-24T00:00:00Z\",\n           \"end\": \"2020-12-31T23:59:59Z\"\n       }\n   }"
        audience_data:
          $ref: '#/components/schemas/commonAudienceData'
          description: "Audience data.\n\n   Example:\n   \"condition\": {\n       \"audience_data\": {\n           \"provider\"\
            : \"moloco\",\n           \"condition\": \"name == \\\"John\"\\ AND age > 30\"\n       }\n   }"
        allowed_apps_by_checksum:
          type: array
          items:
            type: string
          description: Allow apps by their checksum value.
        blocked_apps_by_checksum:
          type: array
          items:
            type: string
          description: Block apps by their checksum value.
        allowed_postback_event_counts:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/commonPostbackEventCount'
          description: "PostbackEventCount condition checks the number of specified events and\naccepts if there is one event\
            \ that falls within given range of [start,\nend). In the example, User's event named \"Transaction confirmation\"\
            \nmust have been appeared 16 times or more to accept for zigbang app.\n\n   Example:\n   \"condition\": {\n  \
            \     \"allowed_postback_event_counts\": [\n           {\n               \"app_bundle\": \"com.chbreeze.jikbang4a\"\
            ,\n               \"range\": {\n                   \"start\": 16,\n                   \"end\": 0\n           \
            \    },\n               \"events\": [\n                   \"Transaction confirmation\"\n               ]\n   \
            \        }\n       ]\n   }"
        auction_types:
          type: array
          items:
            type: string
          description: "Auction types including first price or second price auctions.\n\n   Example:\n   \"condition\": {\n\
            \       \"auction_types\": [ \"first\", \"second\" ]\n   }"
        throttle_apt_tags:
          $ref: '#/components/schemas/commonTagsThrottleCondition'
          title: "Allow throttle apps with apt tags with throttle rate. In the example,\nthrottle apps with apt_tags [bad_apptag1,\
            \ bad_apptag2] with 95% of throttle rate\nare allowed.\nExample:\n\"condition\":{\n   \"throttle_apt_tags\": {\n\
            \       \"tags\": [\"badapp_tag1\", \"badapp_tag2\"],\n       \"throttle_rate\": 0.95\n   }\n}"
        allowed_dev_makes:
          type: array
          items:
            type: string
          description: "Allowed device make.\n\n   Example:\n   \"condition\":{\n       \"allowed_dev_makes\": [ \"Apple\"\
            \ ]\n   }"
        blocked_dev_makes:
          type: array
          items:
            type: string
          description: Blocked device make. See the example of `allowed_dev_makes`.
        display_manager_versions:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/commonDisplayManagerVersion'
          description: "DisplayManager Version.\n\n   Example:\n\n   \"condition\": {\n       \"display_manager_versions\"\
            : [\n           {\n               \"min\": \"1.2\",\n               \"max\": \"4.5.6\"\n           }\n       ]\n\
            \   }\n\n   // With minimum version requirement:\n   \"condition\": {\n       \"display_manager_versions\": [\n\
            \           {\n               \"min\": \"3.0\"\n           }\n       ]\n   }\n\n   // With maximum version requirement:\n\
            \   \"condition\": {\n       \"display_manager_versions\": [\n           {\n               \"max\": \"5\"\n  \
            \         }\n       ]\n   }"
        allowed_audiences:
          type: array
          items:
            type: string
          description: Allowed audiences.
        blocked_audiences:
          type: array
          items:
            type: string
          description: Blocked audiences.
        allowed_postback_has_all_events_conditions:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/commonPostbackEventsCondition'
          description: 'Postback event condition filter a bid-request by user''s postback summary. Note that audience name

            and events are of case-sentitive string types.

            Each entry of allowed_postback_has_all_events_conditions will be satisfied when all listed events

            are found from user''s postback summary.'
        blocked_postback_has_all_events_conditions:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/commonPostbackEventsCondition'
          description: 'Each entry of blocked_postback_has_all_events_conditions will be satisfied when all listed events

            are not found from user''s postback summary.'
        allowed_postback_has_any_events_conditions:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/commonPostbackEventsCondition'
          title: "Each entry of allowed_postback_has_any_events_conditions will be satisfied when there is at least\none matching\
            \ event by the condition from user's postback summary.\nThe following example defines in-app events of \"com.moloco.gameapp\"\
            \ for a user bound to the\nbid-request. The condition must have both of \"adview\" and \"purchase\" events within\
            \ the\npast 14 days but no \"Open\" or \"Close\" events in the last 7 days.\nExample:\n   \"condition\": {\n \
            \      \"allowed_postback_has_all_events_conditions\": [\n           {\n               \"audiences\": [ \"com.moloco.gameapp\"\
            \ ],\n               \"events\": [ \"adview\", \"purchase\" ],\n               \"past_time_range\": {\n      \
            \             \"start\": 14\n               }\n           }\n       ],\n       \"blocked_postback_has_any_events_conditions\"\
            : [\n           {\n               \"audiences\": [ \"com.moloco.gameapp\" ],\n               \"events\": [ \"\
            Open\", \"Close\" ],\n               \"past_time_range\": {\n                   \"start\": 7\n               }\n\
            \           }\n       ]\n   }"
        blocked_postback_has_any_events_conditions:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/commonPostbackEventsCondition'
          description: 'Each entry of blocked_postback_has_any_events_conditions will be satisfied when there is at least

            one event not matched by the condition from user''s postback summary. See the documentation for

            `allowed_postback_has_any_events_conditions`.'
        allowed_location_set:
          $ref: '#/components/schemas/AudienceTargetingConditionLocationSet'
          description: 'Allowed and blocked location sets. If these fields are set,

            allowed_location_codes and blocked_location_codes are ignored.'
        blocked_location_set:
          $ref: '#/components/schemas/AudienceTargetingConditionLocationSet'
        allowed_apt_tags:
          type: array
          items:
            type: string
        blocked_apt_tags:
          type: array
          items:
            type: string
        coppa_acceptance:
          $ref: '#/components/schemas/AudienceTargetingConditionCoppaAcceptance'
          description: Whether to bid according to BidRequest.regs.coppa value.
        skan_traffic:
          $ref: '#/components/schemas/AudienceTargetingConditionSkanTraffic'
          description: 'Whether to bid according to bid requests that support SKAN or not.

            Decide based on bidreq.ext.sk_ad_network_request_ext field exists.'
        contains_custom_audience:
          type: boolean
          description: 'Whether it contains a `custom_audience` targeting condition.

            The `custom_audience` targeting condition is legacy, and may contain some internal information.

            Therefore, we do not reveal them by the API but only signals its non-emptiness with this field.'
        custom_audience_set:
          $ref: '#/components/schemas/AudienceTargetingConditionCustomAudienceSet'
          description: 'CustomAudienceSet is a combination of app events and user lists filters.

            The app events filter checks if the targeted user conforms to given app events.

            The CustomerSet filter checks if an entry in the list can be found

            from tags in a user profile. There is an assumption that a CustomerSet

            entity exists for each and every entry in the list.'
      description: 'AudienceTargetingCondition specifies conditions for AudienceTargeting.


        This condition object contains various filters on multiple dimensions of bid-request,

        app, and user. Advertisers can selectively configure desired filters to form a

        meaningful AudienceTarget condition collectively. The configured individual filters

        must be satisfied unanimously in order for the resulting collective condition to be

        satisfied.


        Only filters with values will be effective. When a filter condition accepts

        a list of values, i.e., list of countries for "allowed_countries", the filter

        condition will be met when any match is found among the list.


        String literals are case insensitive unless specified otherwise; i.e. "USA" and "usa"

        equally represents the United States of America.'
    dspAudienceTargetingConditionVideoType:
      type: string
      enum:
      - UNKNOWN_VIDEO_TYPE
      - REWARD_VIDEO
      - NON_REWARD_VIDEO
      - NON_VIDEO
      default: UNKNOWN_VIDEO_TYPE
      description: This value is not part of the specification.
    dspBudgetSchedule:
      type: object
      properties:
        daily_schedule:
          $ref: '#/components/schemas/dspDailyBudgetSchedule'
          description: Budget for every day.
        weekly_schedule:
          $ref: '#/components/schemas/dspDayOfWeekBudgetSchedule'
          description: Budget for each day-of-week.
        weekly_flexible_schedule:
          $ref: '#/components/schemas/dspWeeklyFlexibleBudgetSchedule'
          description: Budget for a week.
      description: 'BudgetSchedule represents the AdAccount''s plan for budget spending.

        Any change in this object takes effect immediately.'
    dspBusinessCategory:
      type: string
      enum:
      - BUSINESS_CATEGORY_UNKNOWN
      - BUSINESS_CATEGORY_GAME
      - BUSINESS_CATEGORY_COMMERCE
      - BUSINESS_CATEGORY_ENTERTAINMENT
      - BUSINESS_CATEGORY_FINTECH
      - BUSINESS_CATEGORY_FNB
      - BUSINESS_CATEGORY_ONDEMAND
      - BUSINESS_CATEGORY_SOCIAL_NETWORK
      - BUSINESS_CATEGORY_OTHERS
      default: BUSINESS_CATEGORY_UNKNOWN
      description: Category of the business.
    dspCampaign:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the Campaign. Automatically set by server on creation.
        ad_account_id:
          type: string
          description: ID of the AdAccount the Campaign belongs to.
          readOnly: true
        product_id:
          type: string
          description: ID of the Product the Campaign belongs to.
          readOnly: true
        title:
          type: string
          description: A descriptive name of the Campaign.
        description:
          type: string
          description: An optional description of the Campaign.
        enabling_state:
          $ref: '#/components/schemas/commonEnablingState'
          description: 'Whether this campaign is enabled by the AdAccount. Only enabled Campaigns

            will be activated for serving once their eligibility is determined by

            Moloco.


            If the value of this field is unset or set to UNSPECIFIED in a Campaign creation

            request, it will be set to ENABLED automatically by the server.


            If the value is DISABLED when the Campaign is being reviewed and approved,

            the Campaign state will become PAUSED after approval.


            An active Campaign can be paused manually at any time by setting this field

            to DISABLED.'
        type:
          $ref: '#/components/schemas/dspCampaignType'
          description: Type of the Campaign.
        device_os:
          $ref: '#/components/schemas/commonDeviceOs'
          description: Device OS type for this Campaign.
        state:
          $ref: '#/components/schemas/dspCampaignState'
          description: State of the Campaign. This state will be fully managed by the server.
          readOnly: true
        countries:
          type: array
          items:
            type: string
          description: 'Countries in which this Campaign runs. The value format is ISO-3166-1 Alpha-3

            using uppercase letters only, such as "KOR" or "USA". Note that the values

            for this field will be used to filter bid requests by country name.'
        currency:
          $ref: '#/components/schemas/adcloudcommonCurrency'
          description: 'Currency used for the Campaign.

            Set by the ad account''s currency setting.'
          readOnly: true
        schedule:
          $ref: '#/components/schemas/commonTimeInterval'
          description: 'Absolute time range to allow this Campaign to be served.

            Start is required and End is optional.'
        budget_schedule:
          $ref: '#/components/schemas/dspBudgetSchedule'
          description: Campaign-wide budget schedule specified by the AdAccount.
        tracking_company:
          $ref: '#/components/schemas/adcloudcommonTrackingCompany'
          description: Tracking company (e.g., Appsflyer, MAT, and so on).
        tracking_link_id:
          type: string
          description: 'MMP specific impression and click TrackingLinks defined specifically for this Campaign.

            Campaign can be either WEB type or APP type. Required for APP type campaign, not allowed for WEB type Campaign.'
        landing_url:
          type: string
          description: 'The URL of the website that a Campaign wants to show to the audience.

            Required for web type Campaign.'
        goal:
          $ref: '#/components/schemas/dspCampaignGoal'
          description: Goal of the Campaign.
        skadn_input:
          $ref: '#/components/schemas/dspSKAdNetworkInput'
          description: 'Explicit input for SKAdNetwork traffic.

            It''s meaningful only for IOS App Campaign toward SKAdNetwork traffic.'
        custom_key_values:
          type: object
          additionalProperties:
            type: string
          description: 'Custom key/values managed by the Moloco Ads client platform. It''s

            up to the client ads platform to define the schema for the values and their

            optionality.


            The keys are recommended, but not required, to be prefixed with the reversed

            internet domain of the AdCloud client platform company. For example, keys defined

            by the client ads platform company "example.com" should have "com.example." as

            the prefix.


            For complex values, JSON payload is recommended.


            Moloco doesn''t interpret these data in any way for ads serving. Upon serving,

            the custom key/values in the AdAccount, Campaign, and Creative models will

            be combined into the serving Creative proto in the order of precedence, with

            Creative''s value having the highest precedence on the same key.'
        ad_tracking_allowance:
          $ref: '#/components/schemas/dspAdTrackingAllowance'
          description: AdTrackingAllowance controls target audience in terms of personalized ad tracking settings.
        is_deleted:
          type: boolean
          description: True for deleted Campaign.
          readOnly: true
        auto_delete_at:
          type: string
          format: date-time
          description: 'Campaign in Paused or Finished state for specific time will be removed automatically.

            It represents when this will be deleted in UTC.'
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Created time.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last updated time. Should not modify on the client side.
        serving_status:
          $ref: '#/components/schemas/CampaignServingStatus'
          readOnly: true
        launch_notices:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/commonLaunchNotice'
          description: 'A list of notices that the user must review and acknowledge to enable the campaign.

            This field represents pending notices requiring user confirmation.

            The client should store these notices and include them in the subsequent

            request via the ''launch_notice_confirmations'' field to prove that the user has seen them.'
          readOnly: true
        launch_notice_confirmations:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/commonLaunchNotice'
          description: 'The list of launch notice that the user has explicitly reviewed and confirmed.

            The client must echo back the notices received in ''launch_notices'' when enabling the campaign.

            The server validates these against the current system state to ensure all required acknowledgments are present.


            Starting from v1.10.0, any campaign enable request that does not include all ''DISCLAIMER'' type notices received

            in ''launch_notices'' will be rejected.'
      description: Campaign represents a single advertising Campaign.
      required:
      - type
      - device_os
      - schedule
      - goal
      - title
      - countries
    dspCampaignGoal:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/dspCampaignGoalType'
          description: Type of the goal.
        optimize_app_installs:
          $ref: '#/components/schemas/CampaignGoalOptimizeAppInstalls'
        optimize_cpa_for_app_ua:
          $ref: '#/components/schemas/CampaignGoalOptimizeCpaForAppUa'
        optimize_app_roas:
          $ref: '#/components/schemas/CampaignGoalOptimizeAppRoas'
        optimize_clicks_to_web:
          $ref: '#/components/schemas/CampaignGoalOptimizeClicksToWeb'
        optimize_clicks_to_app:
          $ref: '#/components/schemas/CampaignGoalOptimizeClicksToApp'
        optimize_roas_for_app_re:
          $ref: '#/components/schemas/CampaignGoalOptimizeRoasForAppRe'
        optimize_cpc_for_app_re:
          $ref: '#/components/schemas/CampaignGoalOptimizeCpcForAppRe'
        optimize_fixed_cpm:
          $ref: '#/components/schemas/CampaignGoalOptimizeFixedCpm'
        optimize_cpa_for_app_re:
          $ref: '#/components/schemas/CampaignGoalOptimizeCpaForAppRe'
        optimize_app_retention:
          $ref: '#/components/schemas/CampaignGoalOptimizeAppRetention'
        optimize_app_reattribution:
          $ref: '#/components/schemas/CampaignGoalOptimizeAppReattribution'
        optimize_cpa_repeated_for_app_ua:
          $ref: '#/components/schemas/CampaignGoalOptimizeCpaRepeatedForAppUa'
        optimize_fixed_cpm_pacing:
          $ref: '#/components/schemas/CampaignGoalOptimizeFixedCpmPacing'
        optimize_landing_for_web_ua:
          $ref: '#/components/schemas/CampaignGoalOptimizeLandingForWebUa'
        optimize_cpa_for_web_ua:
          $ref: '#/components/schemas/CampaignGoalOptimizeCpaForWebUa'
        kpi_actions:
          type: array
          items:
            type: string
          description: List of KPI actions.
      description: CampaignGoal describes the details of goal of a Campaign.
      required:
      - type
    dspCampaignGoalType:
      type: string
      enum:
      - UNKNOWN_TYPE
      - OPTIMIZE_NONE
      - FIXED_CPM_FOR_APP_UA
      - FIXED_CPM_FOR_APP_RE
      - OPTIMIZE_CPI_FOR_APP_UA
      - OPTIMIZE_CPA_FOR_APP_UA
      - OPTIMIZE_CPC_FOR_APP_UA
      - OPTIMIZE_ROAS_FOR_APP_UA
      - OPTIMIZE_ROAS_FOR_APP_RE
      - OPTIMIZE_CPC_FOR_APP_RE
      - OPTIMIZE_CPC_FOR_WEB_VISIT
      - OPTIMIZE_APP_INSTALLS
      - OPTIMIZE_APP_ROAS
      - OPTIMIZE_CLICKS_TO_WEB
      - OPTIMIZE_CLICKS_TO_APP
      - OPTIMIZE_CPA_FOR_APP_RE
      - OPTIMIZE_RETENTION_FOR_APP_UA
      - OPTIMIZE_REATTRIBUTION_FOR_APP
      - OPTIMIZE_CPA_REPEATED_FOR_APP_UA
      - FIXED_CPM_GENERIC
      - FIXED_CPM_FOR_CTV
      - FIXED_CPM_FOR_WEB_VISIT
      - OPTIMIZE_LANDING_FOR_WEB_UA
      - OPTIMIZE_CPA_FOR_WEB_UA
      default: UNKNOWN_TYPE
      description: "Type enumerates available Campaign goal types.\nCorresponding details to the type must be specified.\n\
        \n - OPTIMIZE_NONE: Goal type for the Campaigns which do not use any of pricing engines.\n - FIXED_CPM_FOR_APP_UA:\
        \ Goal type for the UA Campaigns which do not use any of pricing engines.\n - FIXED_CPM_FOR_APP_RE: Goal type for\
        \ the RE Campaigns which do not use any of pricing engines.\n - OPTIMIZE_CPI_FOR_APP_UA: Aim to drive app installs\
        \ while satisfying the long-term cost per install.\n - OPTIMIZE_CPA_FOR_APP_UA: Aim to drive app installs while satisfying\
        \ long-term cost per (certain) action.\n - OPTIMIZE_CPC_FOR_APP_UA: Aim to drive app installs while satisfying long-term\
        \ cost per click.\n - OPTIMIZE_ROAS_FOR_APP_UA: Aim to drive app installs while satisfying long-term return on advertising\
        \ spend (ROAS).\n - OPTIMIZE_ROAS_FOR_APP_RE: Aim to drive the user re-engagements while satisfying long-term return\
        \ on advertising spend (ROAS).\n - OPTIMIZE_CPC_FOR_APP_RE: Aim to drive the user re-engagements while satisfying\
        \ long-term cost per click.\n - OPTIMIZE_CPC_FOR_WEB_VISIT: Aim to drive the web-site visit while satisfying long-term\
        \ cost per click.\n - OPTIMIZE_APP_INSTALLS: Deprecated. Aim to drive app installs while satisfying long-term cost\
        \ per install.\n - OPTIMIZE_APP_ROAS: Deprecated. Aim to drive certain in-app actions while satisfying long-term return\
        \ on advertising spend (ROAS).\n - OPTIMIZE_CLICKS_TO_WEB: Deprecated. Aim to drive clicks for web-site Product while\
        \ satisfying long-term cost per click.\n - OPTIMIZE_CLICKS_TO_APP: Deprecated. Aim to drive clicks for web-site Product\
        \ while satisfying long-term cost per click.\n - OPTIMIZE_CPA_FOR_APP_RE: Aim to drive the user re-engagements while\
        \ satisfying long-term cost per (certain) action.\n - OPTIMIZE_RETENTION_FOR_APP_UA: Aim to drive the user retention.\n\
        \ - OPTIMIZE_REATTRIBUTION_FOR_APP: Aim to drive user's app reattribution.\n - OPTIMIZE_CPA_REPEATED_FOR_APP_UA: Aim\
        \ to drive app installs while satisfying long-term cost per (certain) action - repeated count.\n - FIXED_CPM_GENERIC:\
        \ Default goal type for generic fixed-cpm. Fixed cpm with budget-pacing option is given.\n - FIXED_CPM_FOR_CTV: Default\
        \ goal type for CTV. Fixed cpm with budget-pacing option is given.\n - FIXED_CPM_FOR_WEB_VISIT: Goal type for the\
        \ WEB_VISIT Campaigns which do not use any of pricing engines.\n - OPTIMIZE_LANDING_FOR_WEB_UA: Goal type for optimizing\
        \ landing event for web user acquisition campaign.\n - OPTIMIZE_CPA_FOR_WEB_UA: Goal type for optimizing cost per\
        \ action for web user acquisition campaign."
    dspCampaignState:
      type: string
      enum:
      - UNKNOWN_CAMPAIGN_STATE
      - SUBMITTED
      - READY
      - UPCOMING
      - ACTIVE
      - PAUSED
      - SUSPENDED
      - COMPLETED
      default: UNKNOWN_CAMPAIGN_STATE
      description: "CampaignState represents various states of a Campaign.\n\nThis value is not part of the specification.\n\
        \n - SUBMITTED: All the required data are entered and passed all the validation. It's eligible\nto be reviewed by\
        \ Moloco for activation.\n - READY: Campaign is before schedule and internally ready but disabled.\nWill transit to\
        \ PAUSED when it becomes on schdule.\n - UPCOMING: Campaign is before schedule and internally ready and disabled.\n\
        Will transit to ACTIVE when it becomes on schdule.\n - ACTIVE: Campaign is on schedule and spending the budget.\n\
        \ - PAUSED: Campaign is paused and not spending the budget.\n - SUSPENDED: Campaign activation is suspended by the\
        \ system for the following reasons:\n- App has been found to be in violation of Moloco's creative policy.\n - COMPLETED:\
        \ Campaign is completed but may still get attributions for some time."
    dspCampaignType:
      type: string
      enum:
      - UNKNOWN_CAMPAIGN_TYPE
      - GENERIC
      - APP_USER_ACQUISITION
      - APP_REENGAGEMENT
      - WEBSITE_VISIT
      - CTV_GENERIC
      - CTV_APP_USER_ACQUISITION
      - WEB_USER_ACQUISITION
      - CTV_WEBSITE_VISIT
      - WEB_RETARGETING
      default: UNKNOWN_CAMPAIGN_TYPE
      description: "CampaignType represents the type of a Campaign.\nIt captures the goal of the Campaign at a high level.\n\
        \nThis value is not part of the specification.\n\n - GENERIC: Campaign is for generic purpose (only for legacy Campaigns).\n\
        \ - APP_USER_ACQUISITION: The goal of the Campaign is to drive app user acquisitions.\n - APP_REENGAGEMENT: The goal\
        \ of the Campaign is to drive app reengagement.\n - WEBSITE_VISIT: The goal of the Campaign is to drive website visits.\n\
        \ - CTV_GENERIC: Campaign is for the general CTV ad.\n - CTV_APP_USER_ACQUISITION: Campaign is for the mobile app\
        \ install CTV ad.\n - WEB_USER_ACQUISITION: The goal of the Campaign is to drive web user acquisitions.\nOriginally,\
        \ this was used for APP to WEB user acquisition. However,\nit is now also used for WEB to WEB user acquisition.\n\
        \ - CTV_WEBSITE_VISIT: Campaign is for the website visit CTV ad.\n - WEB_RETARGETING: The goal of the Campaign is\
        \ to drive web retargeting.\nCurrently, this is used for WEB to WEB retargeting."
    dspClientType:
      type: string
      enum:
      - UNKNOWN_CLIENT_TYPE
      - ADVERTISER
      - AGENCY
      default: UNKNOWN_CLIENT_TYPE
      description: "Enumerates available client types.\n\n - ADVERTISER: The actual advertiser, who owns the advertising apps\
        \ or web sites.\n - AGENCY: An agency, who usually operates ad campaigns on behalf of the advertiser."
    dspCohortMetricType:
      type: string
      enum:
      - UNKNOWN
      - ROAS
      - KPI_ACTION
      - UA_ROAS
      - UA_KPI_ACTION
      - RE_ROAS
      - RE_KPI_ACTION
      default: UNKNOWN
      description: "CohortMetricType represents a cohort metric type.\n\nUnknown cohort metric type.\n\n - ROAS: Deprecated.\n\
        \ - KPI_ACTION: Deprecated.\n - UA_ROAS: Cohort ROAS metric type for user acquisition Campaigns.\n - UA_KPI_ACTION:\
        \ Cohort KPI actions metric type for user acquisition Campaigns.\n - RE_ROAS: Cohort ROAS metric type for re-engagement\
        \ Campaigns.\n - RE_KPI_ACTION: Cohort KPI actions metric type for re-engagement Campaigns."
    dspCohortSummaryActionColumn:
      type: object
      properties:
        revenue_actions:
          $ref: '#/components/schemas/CohortSummaryRevenueActionColumn'
          description: Revenue events and cohort metrics.
        kpi_actions:
          $ref: '#/components/schemas/dspCohortSummaryKpiActionColumn'
          description: KPI events and cohort metrics.
      description: 'ActionColumn represents a structured column containing cohort metrics by

        days for an event.'
    dspCohortSummaryAppColumn:
      type: object
      properties:
        id:
          type: string
          description: Unique ID of an App.
        title:
          type: string
          description: Descriptive name of an App.
        os:
          $ref: '#/components/schemas/commonDeviceOs'
          description: OS type of an App.
      description: AppColumn represents a structured column containing app information.
    dspCohortSummaryCampaignColumn:
      type: object
      properties:
        id:
          type: string
          description: Unique ID of a Campaign.
        title:
          type: string
          description: Descriptive name of a Campaign.
        country:
          type: string
          description: Country code in ISO-3166 Alpha-3.
        is_lat:
          type: boolean
          description: Whether the bid was towards LAT (Limit Ad Tracking) device.
      description: 'CampaignColumn represents a structured column containing Campaign

        information.'
    dspCohortSummaryKpiActionColumn:
      type: object
      properties:
        event:
          type: string
          description: Name of an event.
        event_count:
          $ref: '#/components/schemas/dspCohortSummaryMetricCount'
          description: Cumulative count of an event by specified days.
        user_count:
          $ref: '#/components/schemas/dspCohortSummaryMetricCount'
          description: Cumulative count of unique users for an event by specified days.
      description: 'KpiActionColumn represents a structured column containing cohort metrics by

        days for a KPI event.'
    dspCohortSummaryMetricCount:
      type: object
      properties:
        d1:
          type: string
          format: int64
          description: Cumulative count by day 1.
        d3:
          type: string
          format: int64
          description: Cumulative count by day 3.
        d7:
          type: string
          format: int64
          description: Cumulative count by day 7.
        d30:
          type: string
          format: int64
          description: Cumulative count by day 30.
      description: MetricCount represents a structured column containing count metrics.
    dspCohortSummaryMetricRevenue:
      type: object
      properties:
        d1:
          type: number
          format: double
          description: Cumulative revenue by day 1.
        d3:
          type: number
          format: double
          description: Cumulative revenue by day 3.
        d7:
          type: number
          format: double
          description: Cumulative revenue by day 7.
        d30:
          type: number
          format: double
          description: Cumulative revenue by day 30.
      description: MetricRevenue represents a structured column containing revenue metrics.
    dspCohortSummaryRow:
      type: object
      properties:
        date:
          type: string
          description: The date in the local timezone with 'YYYY-MM-DD' format.
        app:
          $ref: '#/components/schemas/dspCohortSummaryAppColumn'
          description: App column.
        site:
          $ref: '#/components/schemas/dspCohortSummarySiteColumn'
          description: Site column.
        campaign:
          $ref: '#/components/schemas/dspCohortSummaryCampaignColumn'
          description: 'CampaignColumn represents a structured column containing Campaign

            information.'
        currency:
          $ref: '#/components/schemas/adcloudcommonCurrency'
          description: Contract currency.
        spend:
          type: number
          format: double
          description: The amount of ad spend in contract currency.
        base_event_count:
          type: string
          format: int64
          description: Count of the cohort base action.
        event_count:
          $ref: '#/components/schemas/dspCohortSummaryMetricCount'
          description: Cumulative action count of the date.
        user_count:
          $ref: '#/components/schemas/dspCohortSummaryMetricCount'
          description: Cumulative user count of the date.
        revenue:
          $ref: '#/components/schemas/dspCohortSummaryMetricRevenue'
          description: 'Cumulative revenue of the date in contract currency. Revenue is

            populated when ActionColumn is RevenueAction.'
        action_column:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/dspCohortSummaryActionColumn'
          description: Action column holds aggregated cohort data per event.
        sub_publisher:
          $ref: '#/components/schemas/dspCohortSummarySubPublisherColumn'
          description: SubPublisher column.
      description: A row in the cohort summary table consisting of columns.
    dspCohortSummarySiteColumn:
      type: object
      properties:
        id:
          type: string
          description: Unique ID of a Site.
        title:
          type: string
          description: Descriptive name of a Site.
      description: SiteColumn represents a structured column containing site information.
    dspCohortSummarySubPublisherColumn:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/dspCohortSummarySubPublisherColumnType'
          description: Type of a sub-publisher. This will be either App or Site.
      description: SubPublisherColumn represents a structured column containing sub-publisher information.
    dspCohortSummarySubPublisherColumnType:
      type: string
      enum:
      - UNKNOWN_TYPE
      - APP
      - SITE
      default: UNKNOWN_TYPE
      description: ' - UNKNOWN_TYPE: This value is not part of the API specification.'
    dspCompanyInfo:
      type: object
      properties:
        name:
          type: string
          description: Name of the Company.
        client_type:
          $ref: '#/components/schemas/dspClientType'
          title: Client business type of the company. e.g. Advertiser, Agency
        category:
          $ref: '#/components/schemas/dspBusinessCategory'
          title: Category of the business. e.g. Game
        finance_email:
          type: string
          description: Email account in charge of the finance.
        address:
          type: string
          description: Address of the company.
        sub_address:
          type: string
          description: Sub address of the company.
        city:
          type: string
          description: City of the company.
        state:
          type: string
          description: State of the company.
        country:
          type: string
          description: Country of the company.
        zipcode:
          type: string
          description: Zipcode of the company.
      description: CompanyInfo holds the company information.
      required:
      - client_type
      - category
      - name
      - finance_email
      - address
      - city
      - country
      - zipcode
    dspCreative:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the Creative. Automatically set by server on creation.
        ad_account_id:
          type: string
          description: ID of the AdAccount the Creative belongs to.
          readOnly: true
        product_id:
          type: string
          description: ID of the Product the Creative belongs to.
          readOnly: true
        title:
          type: string
          description: A descriptive name of the Creative.
        enabling_state:
          $ref: '#/components/schemas/commonEnablingState'
          description: 'Whether this Creative is enabled by the AdAccount.


            If the value of this field is unset or set to UNSPECIFIED in the Creative

            creation request, it will be set to ENABLED by default by the server.


            A disabled Creative will still get reviewed, but won''t be served automatically after approval.


            An active serving Creative can be paused at any time by setting this field to DISABLED.'
        advertiser_info:
          $ref: '#/components/schemas/dspAdvertiserInfo'
          description: Basic information about the Creative's AdAccount.
          readOnly: true
        type:
          $ref: '#/components/schemas/dspCreativeType'
          description: Type of the Creative.
        original_filename:
          type: string
          description: Original Creative filename given by user.
        size_in_bytes:
          type: integer
          format: int64
          description: Estimated size of the Creative in bytes.
        custom_key_values:
          type: object
          additionalProperties:
            type: string
          description: 'Custom key/values managed by the Moloco Ads client platform. It''s

            up to the client ads platform to define the schema for the values and their

            optionality.


            The keys are recommended, but not required, to be prefixed with the reversed

            internet domain of the AdCloud client platform company. For example, keys defined

            by the client ads platform company "example.com" should have "com.example." as

            the prefix.


            For complex values, JSON payload is recommended.


            Moloco doesn''t interpret these data in any way for ads serving. Upon serving,

            the custom key/values in the AdAccount, Campaign, and Creative models will

            be combined into the serving Creative proto in the order of precedence, with

            Creative''s value having the highest precedence on the same key.'
        image:
          $ref: '#/components/schemas/dspCreativeImageSrc'
        video:
          $ref: '#/components/schemas/dspCreativeVideoSrc'
        vast_video:
          $ref: '#/components/schemas/dspCreativeVastVideoSrc'
        native:
          $ref: '#/components/schemas/dspCreativeNativeSrc'
        custom_html:
          $ref: '#/components/schemas/dspCreativeCustomHtmlSrc'
        template_html:
          $ref: '#/components/schemas/dspCreativeTemplateHtmlSrc'
        rich_custom_html:
          $ref: '#/components/schemas/dspCreativeRichCustomHtmlSrc'
        dynamic_html:
          $ref: '#/components/schemas/dspCreativeDynamicHtmlSrc'
        feature_type:
          $ref: '#/components/schemas/adcloudcommonCreativeFeatureType'
          description: CreativeFeatureType.
        creator_tag:
          type: string
          description: Creator tag to identify who is the resource creator.
        created_at:
          type: string
          format: date-time
          description: Created time.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last updated time. Should not modify on the client side.
      description: 'Creative contains all data and assets required to visually render an ad.


        One and only one of the sources must be specified for the Creative.'
      required:
      - title
      - original_filename
    dspCreativeCustomHtmlSrc:
      type: object
      properties:
        html:
          type: string
          description: HTML for the custom HTML ad.
        width:
          type: integer
          format: int64
          description: Width of the Creative.
        height:
          type: integer
          format: int64
          description: Height of the Creative.
        image_url:
          type: string
          description: URL of the image.
      description: (Will be supported soon) Creative source based on custom html.
      required:
      - html
      - width
      - height
      - image_url
    dspCreativeDynamicHtmlSrc:
      type: object
      properties:
        template_id:
          type: string
          description: ID of the template used to render this Creative.
        template_env:
          type: object
          additionalProperties:
            type: string
          description: Environment used to render this Creative.
        rendered_entry_html:
          type: string
          description: The entry HTML of the rendered Creative.
        html_requirement_attributes:
          $ref: '#/components/schemas/dspCreativeHtmlRequirementAttributes'
          description: 'Requirements of this Creative. Based on this field and inventory''s excludable Creative attributes,

            Moloco can filter out this Creative at serving time.'
        html_size_attributes:
          $ref: '#/components/schemas/dspCreativeHtmlSizeAttributes'
          description: Size-related attributes of this Creative.
        policy:
          $ref: '#/components/schemas/dspCreativeDynamicHtmlSrcPolicy'
          description: Policy defines how to select CatalogItems.
      description: '(Will be supported soon) Dynamic Creative. An instance of this would be used for Creatives to be rendered
        when

        the Creative is shown to user, i.e. an impression takes place, unlike bid-time rendering

        for static images.'
      required:
      - template_id
      - rendered_entry_html
    dspCreativeDynamicHtmlSrcPolicy:
      type: object
      properties:
        function:
          $ref: '#/components/schemas/PolicyPolicyFunction'
          description: 'Algorithm for selecting CatalogItems or CreativeElements for a game.

            PolicyFunction can be thought of as a function: PolicyFunctionConfig -> Policy -> CatalogItem list.

            In case a PolicyFunction does not need PolicyFunctionConfig, it can be thought of as

            Policy -> CatalogItem/CreativeElement list.'
        function_config:
          $ref: '#/components/schemas/PolicyPolicyFunctionConfig'
        num_items:
          type: integer
          format: int32
          description: Number of items to be selected.
        catalog:
          type: string
          description: Catalog ID. To know the types of catalogs supported, contact customer support.
        item_capper:
          $ref: '#/components/schemas/PolicyItemCapper'
      description: Policy defines how to select CatalogItems.
    dspCreativeFeature:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/adcloudcommonCreativeFeatureType'
          description: CreativeFeatureType.
        dynamic_creative:
          $ref: '#/components/schemas/CreativeFeatureDynamicCreative'
      description: CreativeFeature indicates the feature of the CreativeGroup and its configuration.
    dspCreativeGroup:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the CreativeGroup. Automatically set by server on creation.
        ad_account_id:
          type: string
          description: ID of the AdAccount the CreativeGroup belongs to.
          readOnly: true
        product_id:
          type: string
          description: ID of the Product the CreativeGroup belongs to.
          readOnly: true
        title:
          type: string
          description: A descriptive name of the CreativeGroup.
        description:
          type: string
          description: An optional description about this CreativeGroup.
        enabling_state:
          $ref: '#/components/schemas/commonEnablingState'
          description: 'Whether this CreativeGroup is enabled by the AdAccount. If this field

            is unset or set to UNSPECIFIED, the server will change it to ENABLED

            automatically by default.


            An active CreativeGroup can be paused at any time by setting this field

            to DISABLED.'
        creative_ids:
          type: array
          items:
            type: string
          description: List of Creative ids in this CreativeGroup.
        status:
          $ref: '#/components/schemas/dspCreativeGroupStatus'
          description: 'The current status of the CreativeGroup.

            This state is readonly to the client after it gets into a SUBMITTED state.


            When a new CreativeGroup is created, it will be created in "SUBMITTED" state by default

            and it requires all the validations to pass.

            However, the client can specify "DRAFT" as the state in the creation request

            to request the CreativeGroup be saved as a draft without mandating all the required data.

            But any user entered data still need to pass their own validation individually for them

            to be accepted by the Moloco Ads backend.


            The client can switch a "DRAFT" Creative to "SUBMITTED" by specifying "SUBMITTED"

            as the state value in an update request later after all required data are entered,

            and full validation will be invoked on this state switch.


            After a CreativeGroup gets out of the DRAFT state, the state will be fully managed by the Moloco Ads backend

            and the state value will become readonly to the client.

            Any state value specified by the client in the future update requests will be ignored.'
        action_history:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/dspCreativeGroupAction'
          description: List of actions taken on the current Creative.
          readOnly: true
        tracking_link_id:
          type: string
          description: 'MMP specific impression and click TrackingLinks defined specifically for this CreativeGroup.

            Optional for CreativeGroup which has APP type Product, not allowed for WEB type Product.'
        landing_url:
          type: string
          description: 'CreativeGroup specific landing URL.

            Optional for CreativeGroup which has WEB type Product, not allowed for APP type Product.'
        final_landing_url:
          type: string
          description: 'CreativeGroup specific final landing URL.

            Optional for CreativeGroup which has WEB type Product, not allowed for APP type Product.

            Deprecated. v1.3 would be the last version supporting this field. Use landing_url field instead.'
        mmp_tag:
          type: string
          description: 'Name of the mmp side reporting tag.

            mmp_tag should be URL-safe string.'
        audience:
          $ref: '#/components/schemas/adclouddspAudience'
          description: Creative group level audience.
        feature:
          $ref: '#/components/schemas/dspCreativeFeature'
          description: CreativeFeature and its configuration.
        created_at:
          type: string
          format: date-time
          description: Created time.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last updated time. Should not modify on the client side.
        publisher_properties:
          $ref: '#/components/schemas/dspCreativeGroupPublisherProperties'
      description: CreativeGroup is a group of Creatives that may serve with the same purpose, to be referenced by a Campaign.
      required:
      - title
    dspCreativeGroupAction:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the Action. Automatically set by server on creation.
        user_id:
          type: string
          description: ID of the user who initiated this action if it's applicable.
        user_display_name:
          type: string
          description: Display name of the user by whom the action was taken.
        action_type:
          $ref: '#/components/schemas/CreativeGroupActionType'
          description: The type of an action.
        comment:
          type: string
          description: Comment for the action.
        created_at:
          type: string
          format: date-time
          description: Created time.
          readOnly: true
      description: The details of an action taken on the CreativeGroup.
    dspCreativeGroupInactiveReason:
      type: string
      enum:
      - UNKNOWN_REASON
      - NO_CREATIVE
      - NO_ADGROUP
      - SCHEDULED
      - EXTERNAL_ISSUE
      - NO_ENABLED_CREATIVE
      - NO_ENABLED_ADGROUP
      - NO_ENABLED_CAMPAIGN
      - DISABLED_CREATIVE_GROUP
      - ENDED
      default: UNKNOWN_REASON
      description: "InActiveReason indicates why the CreativeGroup is not used for bidding.\n\nThis value is not part of the\
        \ specification.\n\n - NO_CREATIVE: NO_CREATIVE implies that the CreativeGroup has no Creative.\n - NO_ADGROUP: NO_ADGROUP\
        \ implies that the CreativeGroup is not linked to any AdGroup.\n - SCHEDULED: SCHEDULED implies that the CreativeGroup\
        \ is scheduled to run at a future day/time.\n - EXTERNAL_ISSUE: EXTERNAL_ISSUE is deprecated.\n - NO_ENABLED_CREATIVE:\
        \ NO_ENABLED_CREATIVE implies that the CreativeGroup has no enabled Creative.\nIf a CreativeGroup has NO_CREATIVE\
        \ as inactive reasons, NO_ENABLED_CREATIVE won't be included.\n - NO_ENABLED_ADGROUP: NO_ENABLED_ADGROUP implies that\
        \ the CreativeGroup is not linked to any enabled AdGroup.\nIf a CreativeGroup has NO_ADGROUP as inactive reasons,\
        \ NO_ENABLED_ADGROUP won't be included.\n - NO_ENABLED_CAMPAIGN: NO_ENABLED_CAMPAIGN implies that the CreativeGroup\
        \ is not linked to any enabled Campaign.\nIf a CreativeGroup has NO_ADGROUP as inactive reasons, which implies it\
        \ doesn't belongs to any campaign too, so NO_ENABLED_CAMPAIGN won't be included.\n - DISABLED_CREATIVE_GROUP: DISABLED_CREATIVE_GROUP\
        \ implies that the CreativeGroup's enabling state is set as DISABLED.\n - ENDED: ENDED implies that the CreativeGroup\
        \ has passed its schedule end date."
    dspCreativeGroupOverview:
      type: object
      properties:
        id:
          type: string
          description: ID of the CreativeGroup.
        title:
          type: string
          description: Descriptive name of the CreativeGroup.
        description:
          type: string
          description: Optional description about this CreativeGroup.
        tracking_link_id:
          type: string
          description: ID of the TrackingLink used in this CreativeGroup.
        tracking_link_title:
          type: string
          description: Title of the TrackingLink used in this CreativeGroup.
        landing_url:
          type: string
          description: Landing URL used in this CreativeGroup.
        image_creatives_count:
          type: integer
          format: int64
          description: Number of image Creatives.
        video_creatives_count:
          type: integer
          format: int64
          description: Number of video Creatives.
        native_creatives_count:
          type: integer
          format: int64
          description: Number of native Creatives.
        etc_creatives_count:
          type: integer
          format: int64
          description: Number of Creatives which are not image, video, native type.
        enabling_state:
          $ref: '#/components/schemas/commonEnablingState'
          description: Enabling state of the CreativeGroup set by user.
        state:
          $ref: '#/components/schemas/commonEnablingState'
          description: 'CreativeGroup''s overall state which represents it''s ready for bidding or not

            by evaluating it''s related entities.

            It''s ENABLED if and only if it''s included in the enabled campaign.

            More details can be found in `inactive_reasons` field if it''s DISABLED.'
        inactive_reasons:
          type: array
          items:
            $ref: '#/components/schemas/dspCreativeGroupInactiveReason'
          description: "Inactive reasons of CreativeGroup if the CreativeGroup is not used for bidding.\n\n - NO_CREATIVE:\
            \ It implies that the CreativeGroup has no Creative.\n - NO_ADGROUP: It implies that the CreativeGroup is not\
            \ linked to any AdGroup.\n - SCHEDULED: It implies that the CreativeGroup is scheduled to run at a future day/time.\n\
            \ - NO_ENABLED_CREATIVE: It implies that the CreativeGroup has no enabled Creative. If a CreativeGroup has NO_CREATIVE\
            \ as inactive reasons, NO_ENABLED_CREATIVE won't be included.\n - NO_ENABLED_ADGROUP: It implies that the CreativeGroup\
            \ is not linked to any enabled AdGroup. If a CreativeGroup has NO_ADGROUP as inactive reasons, NO_ENABLED_ADGROUP\
            \ won't be included.\n - NO_ENABLED_CAMPAIGN: It implies that the CreativeGroup is not linked to any enabled Campaign.\
            \ If a CreativeGroup has NO_ADGROUP as inactive reasons, which implies it doesn't belongs to any campaign too,\
            \ so NO_ENABLED_CAMPAIGN won't be included.\n - DISABLED_CREATIVE_GROUP: It implies that the CreativeGroup's enabling\
            \ state is set as DISABLED.\n - ENDED: It implies that the CreativeGroup has passed its schedule end date."
        creative_group_referrer_infos:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/dspCreativeGroupReferrerInfo'
          description: CreativeGroupReferrerInfo is data of the CreativeGroup's relational entities which use the CreativeGroup.
        feature_type:
          $ref: '#/components/schemas/adcloudcommonCreativeFeatureType'
          description: Feature type of the CreativeGroup.
        created_at:
          type: string
          format: date-time
          description: Created time.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last updated time. Should not modify on the client side.
      description: 'CreativeGroupOverview is an overview information of CreativeGroup entity.

        Retrieved when the inquiry_option = INQUIRY_OVERVIEW.'
    dspCreativeGroupPublisherProperties:
      type: object
      properties:
        skippable:
          type: boolean
          title: 'if the field is true, creatives of this group can be skipped.

            skippable ads reference : https://support.google.com/google-ads/answer/6055025?hl=en'
        video_target_ad_position:
          $ref: '#/components/schemas/CreativeVideoSrcTargetAdPosition'
          description: Target ad position of videos in this group.
    dspCreativeGroupReferrerInfo:
      type: object
      properties:
        ad_group_id:
          type: string
          description: ID of the AdGroup.
        ad_group_title:
          type: string
          description: Title of the AdGroup.
        ad_group_state:
          $ref: '#/components/schemas/commonEnablingState'
          description: EnablingState of the AdGroup.
        ad_group_experiment_id:
          type: string
          description: ID of the Experiment the AdGroup is involved in.
        campaign_id:
          type: string
          description: ID of the Campaign.
        campaign_title:
          type: string
          description: Title of the Campaign.
        campaign_description:
          type: string
          description: Description of the Campaign.
        campaign_state:
          $ref: '#/components/schemas/dspCampaignState'
          description: State of the Campaign.
        campaign_type:
          $ref: '#/components/schemas/dspCampaignType'
          description: Type of the Campaign.
        campaign_goal:
          $ref: '#/components/schemas/dspCampaignGoal'
          description: Goal of the Campaign.
        campaign_countries:
          type: array
          items:
            type: string
          description: The countries of the Campaign.
        campaign_schedule:
          $ref: '#/components/schemas/commonTimeInterval'
          description: Schedule of the Campaign.
        campaign_auto_delete_at:
          type: string
          format: date-time
          description: Auto delete timestamp of the Campaign.
      description: 'CreativeGroupReferrerInfo is CreativeGroup''s relational data.

        It contains which Campaign and AdGroup use the CreativeGroup.'
    dspCreativeGroupStatus:
      type: string
      enum:
      - UNKNOWN_STATUS
      - DRAFT
      - SUBMITTED
      - REVIEW_NOT_NEEDED
      - UNDER_REVIEW
      - APPROVED
      - DISAPPROVED
      default: UNKNOWN_STATUS
      description: "Enumeration of all possible CreativeGroup status.\n\n - UNKNOWN_STATUS: This value is not part of the\
        \ specification.\n - DRAFT: The CreativeGroup is created but not submitted for review yet.\n - SUBMITTED: The CreativeGroup\
        \ is submitted and pending review.\n - REVIEW_NOT_NEEDED: Review is determined by Moloco not needed for this CreativeGroup.\n\
        \ - UNDER_REVIEW: The CreativeGroup is being reviewed.\n - APPROVED: The CreativeGroup has been approved.\n - DISAPPROVED:\
        \ The CreativeGroup has been rejected."
    dspCreativeHtmlRequirementAttributes:
      type: object
      properties:
        flags:
          type: array
          items:
            $ref: '#/components/schemas/dspCreativeHtmlRequirementAttributesFlag'
          description: Flags for describing features that the enclosing Creative requires.
        use_custom_close:
          $ref: '#/components/schemas/CreativeHtmlRequirementAttributesCustomCloseType'
        auto_play_audio:
          $ref: '#/components/schemas/CreativeHtmlRequirementAttributesAutoPlayAudioType'
      description: 'Requirements for displaying the Creative. During bidding, Moloco ensures only

        Creatives with HTML requirements satisfied by the inventory are served.'
    dspCreativeHtmlRequirementAttributesFlag:
      type: string
      enum:
      - UNKNOWN_FLAG
      - MRAID2
      - IN_BANNER_VIDEO
      default: UNKNOWN_FLAG
      description: "This value is not part of the specification.\n\n - MRAID2: AdX: 32 MraidType: MRAID.\n - IN_BANNER_VIDEO:\
        \ AdX: 95 VideoType: In-Banner Video (Publisher Blockable)."
      title: "This is similar to AdX' Creative attributes:\n  https://storage.googleapis.com/adx-rtb-dictionaries/buyer-declarable-creative-attributes.txt\n\
        Since the purpose of these flags is filtering, we also take into consideration\nwhat inventories can ban:\n  https://storage.googleapis.com/adx-rtb-dictionaries/publisher-excludable-creative-attributes.txt"
    dspCreativeHtmlSizeAttributes:
      type: object
      properties:
        interstitial:
          type: boolean
          description: Passes as long as the inventory is for an interstitial ad.
        fixed:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/CreativeHtmlSizeAttributesFixed'
          description: 'Passes as long as the inventory size matches with one of the elements in the list.

            If the Creative can be rotated, then one should specify both configurations.


            For non-interstitial ads, at least one dimension is required.'
      description: 'Size-related attributes for a resizable Creative, such as an HTML-based one.

        This message acts as a filter condition; if an inventory is matched with the condition

        in this message, the enclosing Creative passes; i.e., the Creative is not filtered out.'
    dspCreativeImageSrc:
      type: object
      properties:
        image_url:
          type: string
          description: URL of the image.
        filename:
          type: string
          description: Original filename of the image.
        width:
          type: integer
          format: int64
          description: Width of the Creative.
          readOnly: true
        height:
          type: integer
          format: int64
          description: Height of the Creative.
          readOnly: true
        size_in_bytes:
          type: integer
          format: int64
          description: Size of the image in bytes.
      description: "Source of image Creative.\n\nSupported formats: JPEG, PNG, GIF. Maximum file size: 500KB (5MB for GIF).\n\
        \nBanner dimensions:\n  - 100x21, 300x50, 300x100, 320x48, 320x50, 320x100\n  - 360x56, 375x50, 375x59, 392x61, 411x64,\
        \ 414x50, 414x65, 468x60\n  - 481x56, 640x100, 640x200, 667x56, 711x88, 800x50\n  - 970x250, 994x250, 1029x258\n\n\
        Full screen dimensions:\n  - 300x600, 320x416, 320x480, 320x568, 360x592, 360x604, 360x640\n  - 360x718, 360x724,\
        \ 360x728, 375x667, 384x787, 412x790, 414x736\n  - 428x846, 480x320, 640x360\n\nMedium dimensions:\n  - 160x600, 200x200,\
        \ 250x250, 300x250, 320x240, 320x267, 336x280, 600x500\n\nTablet dimensions:\n  - 728x90, 768x1024, 1024x90, 1024x768,\
        \ 1280x90"
    dspCreativeNativeSrc:
      type: object
      properties:
        icon_image:
          $ref: '#/components/schemas/dspCreativeImageSrc'
          description: 'App icon image for the native Creative. Width and height must be equal. Supported formats: JPEG, PNG,
            GIF. Maximum file size: 500KB (5MB for GIF).'
        main_image:
          $ref: '#/components/schemas/dspCreativeImageSrc'
          description: 'Main image for the native Creative. Supported formats: JPEG, PNG, GIF. Maximum file size: 500KB (5MB
            for GIF).


            For native image ads, the following dimensions are supported:

            - 720x720, 720x960, 720x1280

            - 1200x222, 1200x600, 1200x628, 1200x844, 1200x1600


            For native video ads, the following dimensions are supported:

            - 360x480, 360x640, 480x360, 480x480, 640x360

            - 720x720, 720x960, 720x1280, 800x418, 1200x628, 1280x720'
        shrunk_main_image:
          $ref: '#/components/schemas/dspCreativeImageSrc'
          description: 'Thumbnail image displayed alongside the native video Creative. Supported formats: JPEG, PNG, GIF.
            Maximum file size: 500KB (5MB for GIF).'
        title:
          type: string
          description: Title of the native ad.
        text:
          type: string
          description: Text message to show.
        cta_text:
          type: string
          description: Call to action text (e.g. "Get a quote").
        sponsored_by:
          type: string
          description: Brand name of the sponsor/advertiser.
        star_rating:
          type: number
          format: float
          description: Star rating value of the app. Value should be in the range of [0, 5].
        video:
          $ref: '#/components/schemas/dspCreativeVideoSrc'
          description: 'Video asset for native video ads.


            Only one of the video and vast_video fields may be specified, not both.'
        vast_video:
          $ref: '#/components/schemas/dspCreativeVastVideoSrc'
          description: 'Vast video for native video ads.


            Only one of the video and vast_video fields may be specified, not both.'
      description: Source of native Creative.
      required:
      - icon_image
      - main_image
      - title
      - text
      - cta_text
    dspCreativeOverview:
      type: object
      properties:
        id:
          type: string
          description: ID of the Creative.
        ad_account_id:
          type: string
          description: ID of the AdAccount this Creative belongs to.
        product_id:
          type: string
          description: ID of the Product this Creative belongs to.
        title:
          type: string
          description: A descriptive name of the Creative.
        type:
          $ref: '#/components/schemas/dspCreativeType'
          description: Type of the Creative.
        original_filename:
          type: string
          description: Original Creative filename given by user.
        image:
          $ref: '#/components/schemas/dspCreativeImageSrc'
        video:
          $ref: '#/components/schemas/dspCreativeVideoSrc'
        vast_video:
          $ref: '#/components/schemas/dspCreativeVastVideoSrc'
        native:
          $ref: '#/components/schemas/dspCreativeNativeSrc'
        feature_type:
          $ref: '#/components/schemas/adcloudcommonCreativeFeatureType'
          description: CreativeFeatureType.
        creator_tag:
          type: string
          description: Creator tag to identify who is the resource creator.
        created_at:
          type: string
          format: date-time
          description: Created time.
        updated_at:
          type: string
          format: date-time
          description: Last updated time. Should not modify on the client side.
      description: 'CreativeOverview is an overview information of Creative entity.

        It is for the lighter response by omitting some fields and data.

        Also, it has different behavior for the source field depends on the Creative source type.

        It doesn''t return source field for the *_HTML Creative types.'
    dspCreativeReview:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the CreativeReview. Automatically set by server on creation.
        creative_groups_using_creative:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/CreativeReviewCreativeGroupInfo'
          description: Information of CreativeGroups that are using this Creative.
        reviews:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/dspCreativeReviewPerExchange'
          description: Key is the name of the exchange.
        creative:
          $ref: '#/components/schemas/dspCreative'
          description: Creative entity this CreativeReview is based on.
      description: CreativeReview contains information related to Creatives' review status per exchange.
    dspCreativeReviewPerExchange:
      type: object
      properties:
        reason_detail:
          $ref: '#/components/schemas/CreativeReviewPerExchangeReasonDetail'
        status:
          $ref: '#/components/schemas/dspCreativeReviewPerExchangeStatus'
          description: Current approval status of the Creative.
        action_history:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/CreativeReviewPerExchangeReviewAction'
          description: List of actions taken on the current CreativeReview.
      description: CreativeReviewPerExchange stores review status and review action per exchange.
    dspCreativeReviewPerExchangeStatus:
      type: string
      enum:
      - UNKNOWN
      - UNDER_REVIEW
      - APPROVED
      - BLOCKED
      - ETC
      - APPROVED_FOR_ADULTS
      - GOOGLE_PLATFORM_APPROVED
      default: UNKNOWN
      description: "Enum of each Creative's approval status.\n\nCreative has not been submitted for review.\n\n - UNDER_REVIEW:\
        \ Creative is currently under review.\n - APPROVED: Creative has been accepted by the exchange.\n - BLOCKED: Creative\
        \ has been rejected by the exchange.\n - ETC: Refer to ReviewAction for more details.\n - APPROVED_FOR_ADULTS: Creative\
        \ has been accepted only for adults by the exchange.\n - GOOGLE_PLATFORM_APPROVED: Creative is rejected by ADX (and\
        \ ADX_RTB) on network policy but approved on platform policy.\nIn ADX requests, a flag will indicate whether a creative\
        \ with this status can bid.\nThis status will only be used in ADX reviews."
    dspCreativeRichCustomHtmlSrc:
      type: object
      properties:
        entry_html:
          type: string
          description: 'The entry HTML code of the Creative.


            This field is read only. For write purposes, use playable_ad_source instead.'
          readOnly: true
        html_requirement_attributes:
          $ref: '#/components/schemas/dspCreativeHtmlRequirementAttributes'
          description: 'Requirements of this Creative.


            Based on this field and inventory''s excludable Creative attributes, Moloco

            can filter out this Creative.'
        html_size_attributes:
          $ref: '#/components/schemas/dspCreativeHtmlSizeAttributes'
          description: Size-related attributes of this Creative.
        max_video_duration_seconds:
          type: integer
          format: int64
          description: 'Max duration of video sources, in seconds. It will be set to 0 if no video

            source is found in this Creative.'
        playable_ad_source:
          $ref: '#/components/schemas/CreativeRichCustomHtmlSrcPlayableADSourceData'
          description: 'PlayableAD source which is created by the third party like Facbook or Tresensa.

            For non-playableAD rich_custom_html, it can be left as blank but entryHTML should be filled.

            This field is available for only creation.'
        filename:
          type: string
          description: The filename of HTML file.
      description: 'Creative source based on arbitrary HTML.

        An instance of this is typically used for a playable Creative from AdAccounts.

        You can create RichCustomHtmlSrc by one of two methods:

        1. Upload FB style html file using CreateAssetUploadSession API(PLAYABLE_AD_SOURCE_TYPE_URL)

        2. Use Creative template third parties: tresensa or spaceback(PLAYABLE_AD_SOURCE_TYPE_TAG).'
      required:
      - html_requirement_attributes
    dspCreativeTemplateHtmlSrc:
      type: object
      properties:
        template_id:
          type: string
          description: ID of the template used to render this Creative.
        template_env:
          type: object
          additionalProperties:
            type: string
          description: Environment used to render this Creative.
        rendered_entry_html:
          type: string
          description: The entry HTML of the rendered Creative.
        html_requirement_attributes:
          $ref: '#/components/schemas/dspCreativeHtmlRequirementAttributes'
          description: 'Requirements of this Creative. Based on this field and inventory''s excludable Creative attributes,

            Moloco can filter out this Creative at serving time.'
        html_size_attributes:
          $ref: '#/components/schemas/dspCreativeHtmlSizeAttributes'
          description: Size-related attributes of this Creative.
        max_video_duration_seconds:
          type: integer
          format: int64
          description: Max duration of video sources. Will be 0 if no video source is found in this Creative.
      description: (Will be supported soon) Creative source based on MRAID template.
      required:
      - template_id
      - rendered_entry_html
    dspCreativeType:
      type: string
      enum:
      - UNKNOWN_TYPE
      - IMAGE
      - VIDEO
      - VAST_VIDEO
      - NATIVE
      - NATIVE_IMAGE
      - NATIVE_VIDEO
      - CUSTOM_HTML
      - TEMPLATE_HTML
      - RICH_CUSTOM_HTML
      - DYNAMIC_HTML
      - AD_TAG
      default: UNKNOWN_TYPE
      description: "Type of the Creative. Only one of the Creative source fields matching the type is allowed to be specified.\n\
        \n - UNKNOWN_TYPE: This value is not part of the specification.\n - IMAGE: Image Creative. The image Creative source\
        \ must be specified for this type.\n - VIDEO: Video Creative. The video Creative source must be specified for this\
        \ type.\n - VAST_VIDEO: Vast video Creative. The vast video Creative source must be specified for this type.\n - NATIVE:\
        \ Deprecated. v1.5 is the last version supporting this version.\nNative Creative. The native Creative source must\
        \ be specified for this type.\n - NATIVE_IMAGE: Native image Creative. The native image Creative source must be specified\
        \ for this type.\n - NATIVE_VIDEO: Native video Creative. The native video Creative source must be specified for this\
        \ type.\n - CUSTOM_HTML: (Will be supported soon) Custom HTML Creative. The custom HTML Creative source must be specified\
        \ for this type.\n - TEMPLATE_HTML: (Will be supported soon) Template HTML Creative. The template HTML Creative source\
        \ must be specified for this type.\n - RICH_CUSTOM_HTML: The rich custom HTML Creative. The rich custom HTML Creative\
        \ source must be specified for this type.\n - DYNAMIC_HTML: (Will be supported soon) The dynamic HTML Creative. The\
        \ dynamic HTML Creative source must be specified for this type.\n - AD_TAG: (Will be supported soon) Third-party ad\
        \ tag Creative with script-based or vast tag-based ad tag."
    dspCreativeVastVideoSrc:
      type: object
      properties:
        vast_tag:
          type: string
          description: 'VAST tag to be used in VAST wrapper.

            E.g. [Example here](https://github.com/InteractiveAdvertisingBureau/VAST_Samples/blob/master/VAST%201-2.0%20Samples/Tremor-Video-Samples/vast_wrapper_linear_1.xml).'
        width:
          type: integer
          format: int64
          description: Width of the Creative.
          readOnly: true
        height:
          type: integer
          format: int64
          description: Height of the Creative.
          readOnly: true
        length_seconds:
          type: integer
          format: int64
          description: Vast video length in seconds.
      description: Source of VAST (Video Ad Serving Template) video Creative.
      required:
      - vast_tag
    dspCreativeVideoSrc:
      type: object
      properties:
        video_url:
          type: string
          description: URL of the video media. Currently we support only mp4 format.
        filename:
          type: string
          description: Original filename of the video.
        width:
          type: integer
          format: int64
          description: Width of the Creative.
        height:
          type: integer
          format: int64
          description: Height of the Creative.
        length_seconds:
          type: integer
          format: int64
          description: Video length in seconds.
        fps:
          type: integer
          format: int64
          description: Number of frames per second for the video.
        size_in_bytes:
          type: integer
          format: int64
          description: Size of the video in bytes. Note it doesn't include the bytes for the companion images.
        companion_images:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/dspCreativeImageSrc'
          description: 'Endcard image shown after video play ends. The orientation must match the video orientation. Supported
            formats: JPEG, PNG, GIF. Maximum file size: 500KB (5MB for GIF).'
        auto_endcard:
          type: boolean
          description: Whether the endcard is generated automatically by MCP or manually uploaded by the user.
        playable_endcard:
          $ref: '#/components/schemas/dspCreativeRichCustomHtmlSrc'
          description: 'HTML-based playable endcard that is shown after video play is ended.

            Either a playable or an image (via `companion_images`) or a dynamic html (via `dynamic_html_endcard`) must be
            used.'
        dynamic_html_endcard:
          $ref: '#/components/schemas/dspCreativeDynamicHtmlSrc'
          description: 'HTML-based dynamic html endcard that is shown after video play is ended.

            Either a dynamic html or an image (via `companion_images`) or a playable (via `playable_endcard`) must be used.'
        transcoding_info:
          $ref: '#/components/schemas/CreativeVideoSrcTranscodingInfo'
          description: Transcoding information of the video.
          readOnly: true
      description: 'Source of video Creative.


        Supported format: MP4. Maximum file size: 300MB (before transcoding).

        At least one of width or height must be ≥ 640px. Duration: 6–180 seconds.'
      required:
      - video_url
      - width
      - height
      - length_seconds
    dspCustomerActivity:
      type: object
      properties:
        id:
          type: string
          description: 'The server generated random unique identifier of the CustomerActivity.

            (Required/Immutable).'
        title:
          type: string
          description: 'The human readable short name.

            (Required/Mutable).'
        description:
          type: string
          description: 'The description about the CustomerActivity.

            (Optional/Mutable).'
        include_having_all:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/CustomerActivityActivityCondition'
          description: This condition will include a customer only if all of the listed activity conditions are satisfied.
        include_having_any:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/CustomerActivityActivityCondition'
          description: This condition will include a customer if at least one condition from the listed activity conditions
            is satisfied.
        exclude_having_all:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/CustomerActivityActivityCondition'
          description: This condition will exclude a customer only if all of the listed activity conditions are satisfied..
        exclude_having_any:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/CustomerActivityActivityCondition'
          description: This condition will exclude a customer if at least one condition from the listed activity conditions
            is satisfied.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: 'CustomerActivity represents a group of target customers to whom we''re going to show an ad.

        CustomerActivity determines a dynamic (not pre-determined)

        set of target customers based on App-events described in the postback messages.

        (e.g. purchase, close, open, etc.).'
    dspCustomerSet:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the CustomerSet. Automatically set by server on creation.
        title:
          type: string
          description: A descriptive name of the CustomerSet.
        description:
          type: string
          description: An optional description of the CustomerSet.
        id_type:
          $ref: '#/components/schemas/dspCustomerSetIdType'
          description: Type of user identifiers of this CustomerSet.
        status:
          $ref: '#/components/schemas/dspCustomerSetStatus'
        data_file_path:
          type: string
          description: "Data source path of users.\nex) gcs path for txt file of specific-type user lists (query result for\
            \ postback, or journal...).\n\nAPPLE_IDFA user list txt file example: (one idfa per line).\n ______________________________________\n\
            8a05cce7-da5c-4980-8cef-2603ae1742b6\nffffffff-ffff-4fff-8fff-ffffffffffff"
        is_upper:
          type: boolean
          description: A flag indicating that identifiers are upper-cased. False if they are lower-cased.
        auto_delete_at:
          type: string
          format: date-time
          description: 'CustomerSet used nowhere for specific time will be removed automatically.

            It represents when this will be deleted in UTC.'
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Created time.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last updated time. Should not modify on the client side.
        recent_file_update_info:
          $ref: '#/components/schemas/CustomerSetFileUpdateInfo'
          description: Most recent update info.
          readOnly: true
        status_detail:
          $ref: '#/components/schemas/CustomerSetCustomerSetStatusDetail'
        file_update_histories:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/CustomerSetFileUpdateHistory'
          title: 'Maximum # of histories: 10'
          readOnly: true
      description: 'CustomerSet represents a group of user identifiers can be used in Moloco Ads.

        (e.g. Targeting, Audience Lift model generation and so on).'
      required:
      - title
      - id_type
      - data_file_path
    dspCustomerSetIdType:
      type: string
      enum:
      - UNKNOWN_ID_TYPE
      - GOOGLE_ADID
      - APPLE_IDFA
      default: UNKNOWN_ID_TYPE
      description: " - UNKNOWN_ID_TYPE: Unknown user ID type.\n - GOOGLE_ADID: Google Android advertising ID type.\n - APPLE_IDFA:\
        \ Apple iOS advertising ID type."
    dspCustomerSetStatus:
      type: string
      enum:
      - UNKNOWN_STATUS
      - PREPARING
      - READY
      - FAILED
      default: UNKNOWN_STATUS
      description: "Unknown status.\n\n - PREPARING: Premature status.\n - READY: Ready.\n - FAILED: Failed to be ready."
    dspDailyBudgetSchedule:
      type: object
      properties:
