        \n - UNKNOWN_COPPA: Doesn't filter BidRequest according to the coppa value.\n - ACCEPT_COPPA_ONLY: Bids to BidRequest\
        \ with coppa=1.\n - DENY_COPPA: Bids to BidRequest with coppa=0 or empty coppa field."
