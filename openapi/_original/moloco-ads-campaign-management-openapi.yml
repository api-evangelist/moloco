  /cm/v1/campaigns:
    get:
      summary: List up Campaigns.
      description: List up all Campaigns of the AdAccount or the Product.
      operationId: DspApi_ListCampaigns
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messagesListCampaignsResponse'
        default:
          description: Error. Detailed cause can be found in the `details` field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messagesListCampaignsError'
      parameters:
      - name: ad_account_id
        description: The AdAccount ID to which the Campaigns belong to.
        in: query
        required: true
        schema:
          type: string
      - name: product_id
        description: The Product ID to which the Campaigns belong to.
        in: query
        required: false
        schema:
          type: string
      - name: states
        description: "The states of the Campaigns to be listed.\nDeleted Campaigns can not be listed with this parameter.\n\
          \n - SUBMITTED: All the required data are entered and passed all the validation. It's eligible\nto be reviewed by\
          \ Moloco for activation.\n - READY: Campaign is before schedule and internally ready but disabled.\nWill transit\
          \ to PAUSED when it becomes on schdule.\n - UPCOMING: Campaign is before schedule and internally ready and disabled.\n\
          Will transit to ACTIVE when it becomes on schdule.\n - ACTIVE: Campaign is on schedule and spending the budget.\n\
          \ - PAUSED: Campaign is paused and not spending the budget.\n - SUSPENDED: Campaign activation is suspended by the\
          \ system for the following reasons:\n- App has been found to be in violation of Moloco's creative policy.\n - COMPLETED:\
          \ Campaign is completed but may still get attributions for some time."
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - UNKNOWN_CAMPAIGN_STATE
            - SUBMITTED
            - READY
            - UPCOMING
            - ACTIVE
            - PAUSED
            - SUSPENDED
            - COMPLETED
      - name: fetch_option
        description: "Fetch option to query Campaigns only deleted or all(deleted & not deleted).\nIf fetch_option is not\
          \ specified, it will fetch only alive Campaigns.\n\n - FETCH_ALL: Fetch all Campaigns including deleted and not\
          \ deleted.\n - FETCH_ONLY_DELETED: Fetch only deleted Campaigns."
        in: query
        required: false
        schema:
          type: string
          enum:
          - UNKNOWN_FETCH_OPTION
          - FETCH_ALL
          - FETCH_ONLY_DELETED
          default: UNKNOWN_FETCH_OPTION
      tags:
      - Campaign
    post:
      summary: Create a new Campaign.
      description: Create a new Campaign.
      operationId: DspApi_CreateCampaign
      responses:
