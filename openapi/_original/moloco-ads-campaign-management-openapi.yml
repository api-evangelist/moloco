    ProductAppProperties:
      type: object
      properties:
        bundle_id:
          type: string
          description: App bundle ID. Immutable.
        category:
          type: string
          description: 'The main IAB content category of the App.


            This field is now output only and will be removed after v1.10.

            Before that, it is auto-filled from the categories field.

            Please use ''categories'' field instead.


            Valid category values can be found in section "5.1 Content Categories" in the [OpenRTB API Specification]

            (https://github.com/openrtb/OpenRTB/blob/master/OpenRTB-API-Specification-Version-2-3-1-FINAL.pdf).'
          readOnly: true
        categories:
          type: array
          items:
            type: string
          description: 'The IAB categories of the App. All the categories must be valid IAB categories.


            On create Product, the system checks the App Metadata Inventory: if the app is found, the Inventory values override
            user input; otherwise, the API uses the provided input.


            This field is editable only when the app is not in Inventory, and becomes read-only if the app exists there.


            Valid category values can be found in section "5.1 Content Categories" in the [OpenRTB API Specification]

            (https://github.com/openrtb/OpenRTB/blob/master/OpenRTB-API-Specification-Version-2-3-1-FINAL.pdf).'
        category_readable:
          type: string
          title: App category in a human-readable format from the app store
        rating:
          type: number
          format: double
          description: App rating in the range of [0, 5].
        rating_cnt:
          type: string
          format: int64
          title: Total number of app ratings from the app store
        app_store_url:
          type: string
          description: App store URL for Google Play, Apple App Store or Other App Markets.
        available_countries:
          type: array
          items:
            type: string
          description: 'Country codes where the app is available in the store.

            The value format is ISO-3166-1 Alpha-2 using uppercase letters only, such as "KR" or "US".'
        unavailable_countries:
          type: array
          items:
            type: string
          description: 'Country codes where the app is unavailable in the store.

            The value format is ISO-3166-1 Alpha-2 using uppercase letters only, such as "KR" or "US".'
        rtb_bundle_ids:
          type: array
          items:
            type: string
          description: 'RTB bundle names that related to the target app for which a Campaign runs.

            This field is useful when the target app and/or its family apps send out bid requests to the exchanges:

            (1) by nature, the Campaign must not deliver ad to the AdAccount''s own apps;

            (2) it''s better to ignore such apps for ads serving model training.'
        postback_integration:
          $ref: '#/components/schemas/dspPostbackIntegration'
          description: Active postback integration for the app.
        mmp_integration:
          $ref: '#/components/schemas/dspMmpIntegration'
          description: MmpIntegration of the Product. Immutable.
        skadn_mmp_integration:
          $ref: '#/components/schemas/dspMmpIntegration'
          description: SKAN MmpIntegration of the Product. Immutable.
        content_rating:
          type: string
          description: Content rating(App store age information) of the App.
        storekit_enabled:
          type: boolean
          description: StoreKit can be applied only for iOS app.
        autoinline_enabled:
          type: boolean
          description: AutoInline can be applied only for Android app.
        localized_app_name:
          type: object
          additionalProperties:
            type: string
          title: Field for mapping language to it’s app name
          readOnly: true
        localized_app_icon_url:
          type: object
          additionalProperties:
            type: string
          description: Field for url of app icon.
          readOnly: true
        localized_app_screenshots:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AppPropertiesAppScreenshots'
          description: App screenshots from the app store.
          readOnly: true
        app_event_types:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AppPropertiesAppEventType'
          description: 'Information on relationships between in-app events and its event type.

            This field is to categorize in-app events and categorized event types for each in-app event are used to optimize
            training of ML model.'
        description:
          type: string
          title: App description from the app store
        short_description:
          type: string
          description: Short description (promo text) from the app store.
        ios_primary_measurement:
          $ref: '#/components/schemas/AppPropertiesIosPrimaryMeasurement'
          description: Primary measurement used for iOS apps.
        ios_secondary_measurement:
          $ref: '#/components/schemas/AppPropertiesIosSecondaryMeasurement'
          description: Secondary measurement used for iOS apps.
        ios_custom_measurement:
          type: string
          title: 'Custom secondary measurement label for iOS apps.

            Set only when ios_secondary_measurement == IOS_SECONDARY_MEASUREMENT_CUSTOM.

            If set when the secondary measurement is not CUSTOM, this field must be empty'
      description: 'AppProperties defines the App type Product specific properties.

        Should contain only one of ''app'' or ''web''.'
      required:
      - bundle_id
    ProductDynamicCreativeProperty:
      type: object
      properties:
        permission:
          type: boolean
          description: Permission to use dynamic CreativeGroups.
      description: Dynamic Creative specific properties.
    ProductSuspensionAction:
      type: object
      properties:
        user_name:
          type: string
          description: Name who judges the product to be suspended.
          readOnly: true
        user_email:
          type: string
          description: Email who judges the product to be suspended.
          readOnly: true
        reason:
          type: string
          description: The reason for the product suspension.
        kind:
          $ref: '#/components/schemas/ProductSuspensionActionKind'
          readOnly: true
        type:
          $ref: '#/components/schemas/ProductSuspensionActionType'
        effective_from:
          type: string
          format: date-time
          description: The time from the app suspension will have been effective.
        effective_until:
          type: string
          format: date-time
          description: 'The time until the app suspension will have been effective.

            If the value of Type is set to STOP_SUSPENSION, SUSPEND_INDEFINITELY, there is no need to enter a value and

            the system automatically enters a value for you.'
        created_at:
          type: string
          format: date-time
          description: The time when the current suspension action is created.
          readOnly: true
      description: 'Product suspension action to block campaign activation under the product.

        The value can be updated only on Moloco''s end.'
    ProductSuspensionActionKind:
      type: string
      enum:
      - UNKNOWN_KIND
      - CREATE
      - UPDATE
      default: UNKNOWN_KIND
      description: "The kind to represent whether the current action is newly created, or is for updating the previous action.\n\
        \n - CREATE: This suspension action is independently created.\n - UPDATE: This suspension action is for updating the\
        \ previous suspension action."
    ProductSuspensionActionType:
      type: string
      enum:
      - UNKNOWN_TYPE
      - SUSPEND_UNTIL
      - SUSPEND_INDEFINITELY
      - STOP_SUSPENSION
      default: UNKNOWN_TYPE
      description: "The type which the current action achieves.\n\n - SUSPEND_UNTIL: The current action is for product suspension\
        \ until someday.\n - SUSPEND_INDEFINITELY: The current action is for product suspension indefinitely.\n - STOP_SUSPENSION:\
        \ The current action is to stop product suspension."
    ProductWebProperties:
      type: object
      properties:
        category:
          type: string
          description: 'The main IAB content category of the web product.


            When creating a WEB product, provide exactly one of ''category'' or ''categories'';

            the other field is derived automatically. Providing both is rejected.

            REQUIRED was dropped to allow ''categories''-only WEB creates; BRAND products reuse

            this message via ''brand.web'' and still require ''category'' (enforced at the API layer).


            Valid category values can be found in section "5.1 Content Categories" in the [OpenRTB API Specification]

            (https://github.com/openrtb/OpenRTB/blob/master/OpenRTB-API-Specification-Version-2-3-1-FINAL.pdf)'
        landing_url:
          type: string
          description: 'URL of the final destination page the audience users will be redirected to.

            Length of the URL should not exceed 10000 characters.'
        categories:
          type: array
          items:
            type: string
          description: 'Multiple IAB categories of the web product.


            When creating a product, provide exactly one of ''category'' or ''categories'';

            the other field is derived automatically. Providing both is rejected.


            Valid category values can be found in section "5.1 Content Categories" in the [OpenRTB API Specification]

            (https://github.com/openrtb/OpenRTB/blob/master/OpenRTB-API-Specification-Version-2-3-1-FINAL.pdf).'
      description: 'WebProperties defines the Web type Product specific properties.

        Should contain only one of ''app'' or ''web''.'
    ReadWorkplaceSummaryRequestMonthRange:
      type: object
      properties:
        start:
          type: string
          description: Start month in the 'YYYY-MM' format.
        end:
          type: string
          description: End month in the 'YYYY-MM' format.
      description: Month range.
      required:
      - start
      - end
    ReportExportPartner:
      type: string
      enum:
      - UNKNOWN_PARTNER
      - SINGULAR
      - APPSFLYER
      - TENJIN
      - BIDALGO
      - APPANNIE
      - APPSUMER
      - ADJUST
      - KOCHAVA
      - AIRBRIDGE
      - BRANCH
      - JUSTTRACK
      default: UNKNOWN_PARTNER
      description: "Partner enumerates the reporting solution partners to whom we've integrated.\n\n - SINGULAR: Singular.\n\
        \ - APPSFLYER: AppsFlyer.\n - TENJIN: Tenjin.\n - BIDALGO: Bidalgo.\n - APPANNIE: Appannie.\n - APPSUMER: Appsumer.\n\
        \ - ADJUST: Adjust.\n - KOCHAVA: Kochava.\n - AIRBRIDGE: AirBridge.\n - BRANCH: Branch.\n - JUSTTRACK: JustTrack."
    ReportOptionalMetric:
      type: string
      enum:
      - UNKNOWN_REPORT_METRIC
      - VIDEO_PLAY_PROGRESS
      - ENGAGED_VIEWS
      - ENGAGED_CLICKS
      default: UNKNOWN_REPORT_METRIC
      description: Optional Metric enumerates available breakdown metrics.
    SKAdNetworkInputCustomOption:
      type: string
      enum:
      - UNKNOWN_SKAN_CUSTOM_OPTION
      - SKAN_CUSTOM_OPTION_MMP_ATTRIBUTABLE
      - SKAN_CUSTOM_OPTION_BI_ATTRIBUTABLE
      - SKAN_CUSTOM_OPTION_NON_ATTRIBUTABLE
      - SKAN_CUSTOM_OPTION_SKAN_ATTRIBUTABLE
      default: UNKNOWN_SKAN_CUSTOM_OPTION
      description: "CustomOption enumerates all the available traffic.\nWhile the targeting_state other than 'TARGET_CUSTOM'\
        \ is a pre-defined set of traffic,\nCustomOption enables configuring the targeted traffic in a custom way.\n\nThis\
        \ value is not part of the specification.\n\n - SKAN_CUSTOM_OPTION_MMP_ATTRIBUTABLE: This option target traffic which\
        \ is iOS < 14.5 and SKAdNetwork incompatible.\n - SKAN_CUSTOM_OPTION_BI_ATTRIBUTABLE: This option target traffic which\
        \ is iOS < 14.5 and SKAdNetwork compatible.\n - SKAN_CUSTOM_OPTION_NON_ATTRIBUTABLE: This option target traffic which\
        \ is iOS >= 14.5 and SKAdNetwork incompatible.\n - SKAN_CUSTOM_OPTION_SKAN_ATTRIBUTABLE: This option target traffic\
        \ which is iOS >= 14.5 and SKAdNetwork compatible."
    SKAdNetworkInputTargetingState:
      type: string
      enum:
      - UNKNOWN_TARGETING_STATE
      - TARGET_DO_NOT_CARE
      - TARGET_ALL
      - TARGET_SKADN_ONLY
      - TARGET_NON_SKADN_ONLY
      - TARGET_CUSTOM
      default: UNKNOWN_TARGETING_STATE
      description: "Enumeration of all supported targeting state w.r.t SKAdNetwork traffic.\nTARGET_ALL, TARGET_SKADN_ONLY,\
        \ TARGET_NON_SKADN_ONLY is a predefined set of traffic.\nTARGET_CUSTOM is to support DIY configuration of traffic.\n\
        \nThis value is not part of the specification.\n\n - TARGET_DO_NOT_CARE: Do not care whether the Campaign targets\
        \ SKAdNetwork traffic or not.\n - TARGET_ALL: Target all traffic including SKAdNetwork and others.\nIt includes SKAN_CUSTOM_OPTION_MMP_ATTRIBUTABLE,\
        \ SKAN_CUSTOM_OPTION_BI_ATTRIBUTABLE, SKAN_CUSTOM_OPTION_SKAN_ATTRIBUTABLE.\n - TARGET_SKADN_ONLY: Target only SKAdNetwork\
        \ traffic.\nIt includes SKAN_CUSTOM_OPTION_SKAN_ATTRIBUTABLE.\n - TARGET_NON_SKADN_ONLY: Target only non-SKAdNetwork\
        \ traffic.\nIt includes SKAN_CUSTOM_OPTION_MMP_ATTRIBUTABLE, SKAN_CUSTOM_OPTION_BI_ATTRIBUTABLE.\n - TARGET_CUSTOM:\
        \ Target customized configuration traffic.\nWhen the targeting_state is set with this value, then custon_options should\
        \ be also set."
    TargetFuturePreferenceInfoCustomProducts:
      type: object
      properties:
        product_ids:
          type: array
          items:
            type: string
      description: CustomProducts stores Products' ids of which the target prefers.
    TargetFuturePreferenceInfoProductScope:
      type: string
      enum:
      - UNKNOWN
      - ALL
      - ANDROID
      - IOS
      default: UNKNOWN
      description: ProductScope indicates the scope of Product of which the target prefers.
    TrackingLinkUrlData:
      type: object
      properties:
        url:
          type: string
          description: URL of the TrackingLink.
        status:
          $ref: '#/components/schemas/TrackingLinkUrlDataVerificationStatus'
          description: 'The verification status of the supplied URL.

            It''s managed by the Moloco servers and is readonly to the client.'
          readOnly: true
        unverified_status_data:
          $ref: '#/components/schemas/UrlDataUnverifiedStatusData'
        verifying_status_data:
          $ref: '#/components/schemas/UrlDataVerifyingStatusData'
        verified_status_data:
          $ref: '#/components/schemas/UrlDataVerifiedStatusData'
      required:
      - url
    TrackingLinkUrlDataVerificationStatus:
      type: string
      enum:
      - UNKNOWN_VERIFICATION_STATUS
      - UNVERIFIED
      - VERIFYING
      - VERIFIED
      default: UNKNOWN_VERIFICATION_STATUS
      description: "Enumeration of various TrackingLink verification status.\n\nThis value is not part of the specification.\n\
        \n - UNVERIFIED: The TrackingLink is not yet verified.\n - VERIFYING: The TrackingLink is being verified.\n - VERIFIED:\
        \ The TrackingLink has been verified."
    TrackingLinkValidationErrorErrorCode:
      type: string
      enum:
      - UNKNOWN_VALIDATION_ERROR
      - INVALID_LINK
      - INVALID_SCHEME
      - INVALID_HOST
      - INVALID_PATH
      - INVALID_QUERY_PARAM
      - MISSING_REQUIRED_QUERY_PARAM
      - NOT_ALLOWED_QUERY_PARAM
      - INVALID_QUERY_PARAM_ENCODED_MACRO
      - DUPLICATE_QUERY_PARAM
      - NOT_SUPPORTED_MACRO
      - CONTAINS_LEGACY_MACRO
      - ADJUST_BRANDED_LINK_HOST_MISMATCH
      - ADJUST_UNIVERSAL_LINK_HOST_MISMATCH
      - AF_TRACKING_BUNDLE_MISMATCH
      - ADJUST_UNSEEN_TRACKER_TOKEN
      - ADJUST_CT_VT_TOKEN_MISMATCH
      - ADJUST_MISSING_BRANDED_LINK_HOST
      - ADJUST_MISSING_UNIVERSAL_LINK_HOST
      - ADJUST_CTV_MULTI_TOKEN
      - AF_AGENCY_TOKEN_MISMATCH
      - EMPTY_AF_AGENCY_TOKEN
      - EMPTY_AF_SITEID
      default: UNKNOWN_VALIDATION_ERROR
      description: "Specific code for validation error.\n\n - INVALID_LINK: Link cannot be parsed.\n - INVALID_SCHEME: Link\
        \ used 'http' instead of 'https'.\n - INVALID_HOST: Link's tracking company doesn't match the TrackingLink.TrackingCompany.\n\
        \ - INVALID_PATH: Link's path doesn't match the selected app.\n - INVALID_QUERY_PARAM: Link has an invalid query parameter.\n\
        \ - MISSING_REQUIRED_QUERY_PARAM: Link missed required query parameter(s).\n - NOT_ALLOWED_QUERY_PARAM: Link contains\
        \ not allowed query parameter(s).\n - INVALID_QUERY_PARAM_ENCODED_MACRO: Link contains invalid encoded macro in query\
        \ parameter.\n - DUPLICATE_QUERY_PARAM: Link contains duplicate query parameter.\n - NOT_SUPPORTED_MACRO: Unsupported\
        \ macro is used in the link.\n - CONTAINS_LEGACY_MACRO: Link contains legacy macro.\n - ADJUST_BRANDED_LINK_HOST_MISMATCH:\
        \ Adjust's BrandedLink host does not match with the one stored in MMP integration.\n - ADJUST_UNIVERSAL_LINK_HOST_MISMATCH:\
        \ Adjust's UniversalLink host does not match with the one stored in MMP integration.\n - AF_TRACKING_BUNDLE_MISMATCH:\
        \ AppsFlyer's tracking bundle does not match with the one stored in the product.\n - ADJUST_UNSEEN_TRACKER_TOKEN:\
        \ Adjust's tracker token does not exist in the ones stored in MMP integration.\n - ADJUST_CT_VT_TOKEN_MISMATCH: Adjust\
        \ normal link's click through and view through urls have mismatching tracker tokens.\n - ADJUST_MISSING_BRANDED_LINK_HOST:\
        \ Adjust's BrandedLink host name is not set to MMP integration.\n - ADJUST_MISSING_UNIVERSAL_LINK_HOST: Adjust's UniversalLink\
        \ host name is not set to MMP integration.\n - ADJUST_CTV_MULTI_TOKEN: Adjust tracking link has multiple tracker tokens.\n\
        \ - AF_AGENCY_TOKEN_MISMATCH: AppsFlyer's af_prt value mismatch.\n - EMPTY_AF_AGENCY_TOKEN: AppsFlyer's af_prt value\
        \ is empty.\n - EMPTY_AF_SITEID: AppsFlyer's af_siteid value is empty."
    TrackingLinkVerificationAttemptUrlDataType:
