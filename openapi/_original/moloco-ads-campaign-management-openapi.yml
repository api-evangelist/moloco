          type: string
          description: Unique identifier of the AdAccount. Automatically set by server on creation.
        title:
          type: string
          description: A descriptive name of the AdAccount.
        description:
          type: string
          description: An optional description of the AdAccount.
        timezone:
          type: string
          description: '[IANA timezone](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones) name.

            e.g. America/Los_Angeles.'
        currency:
          $ref: '#/components/schemas/adcloudcommonCurrency'
