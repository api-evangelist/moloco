        id: sampleLogId
        ad_account_id: sampleAdAccountId
        type: IMP
        format: CSV
        date: '2020-01-01'
        created_at: '2020-01-03T03:12:50.124101982Z'
        updated_at: '2020-01-03T03:24:21.109821241Z'
      properties:
        id:
          type: string
          description: Unique identifier of the Log. Automatically set by server on creation.
        type:
          $ref: '#/components/schemas/dspLogType'
          description: Type of data which a log contains.
        format:
          $ref: '#/components/schemas/dspLogFormat'
          description: Format of generated log files.
        date:
          type: string
          description: Date for which a log contains the data in "yyyy-mm-dd" format.
        ad_account_id:
          type: string
          description: Ad account ID to which the log is bound.
        status:
          $ref: '#/components/schemas/dspLogStatus'
          description: Status of the log generation.
          readOnly: true
        skip_compression:
          type: boolean
          description: Flag whether to skip compression.
        expire_at:
          type: string
          format: date-time
          description: The time when a log will be expired.
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Created time.
          readOnly: true
        updated_at:
