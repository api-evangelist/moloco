    dspPostbackIntegration:
      type: object
      properties:
        mmp:
          $ref: '#/components/schemas/adcloudcommonTrackingCompany'
          description: MMP (e.g., Appsflyer, MAT, and so on).
        bundle_id:
          type: string
          description: "bundle_id to be used in the MMP integration. This corresponds to app_bundle in postback table.\nWe've\
            \ relied on the identifier sent by the tracker to keep track of events in our internal database.\nWhen we want\
            \ to target to the audience of a Campaign, we need to exactly specify the identifier in the\ntarget description.\
            \ Unfortunately, it depends on tracker's policy especially for iOS app as follows:\n  - Appsflyer: \"id\" + NUMBER,\
            \ where NUMBER is app bundle.\n  - Tune: independent string to NUMBER.\n          e.g., memebox is denoted as\
            \ \"com.memebox.ios.memebox\" while app bundle is 896990789\n  - Adjust: same with the app_bundle\n  - trackfnt:\
            \ same with the app_bundle\nNote that 'bundle' field will be used as tracking bundle if 'tracking_bundle' is not\
            \ given. In many\ncase, this field can be filled after we receive the very first event from tracker for an app."
      description: PostbackIntegration represents the postback integration information.
    dspPostbackIntegrationEventSummary:
      type: object
      properties:
