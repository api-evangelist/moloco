            "KOR", "USA".

            It is used for filtering bid requests by country name.'
        complete_percentage:
          type: number
          format: double
          description: Integration completion percentage per each country.
        integration_success:
          type: boolean
          description: The flag that specifies the integration is completed in any country.
    dspProduct:
      type: object
