      parameters:
      - name: report_id
        description: Report ID to delete.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Report
      security:
      - Bearer: []
    servers:
    - url: https://api.moloco.cloud
  /cm/v1/reports/{report_id}/status:
    get:
      summary: Read report status.
