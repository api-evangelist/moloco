          type: string
          title: Inventory identifier for MCM Item Recommendation. (e.g. home_recommendation)
    dspCreativeImageSrc:
      type: object
      properties:
        image_url:
          type: string
          description: URL of the image.
        filename:
          type: string
          description: Original filename of the image.
        width:
          type: integer
          format: int64
          description: Width of the Creative.
          readOnly: true
        height:
          type: integer
          format: int64
          description: Height of the Creative.
          readOnly: true
        size_in_bytes:
          type: integer
          format: int64
          description: Size of the image in bytes.
      description: "Source of image Creative.\n\nSupported formats: JPEG, PNG, GIF. Maximum file size: 500KB (5MB for GIF).\n\nBanner dimensions:\n  - 100x21, 300x50, 300x100, 320x48, 320x50, 320x100\n  - 360x56, 375x50, 375x59, 392x61, 411x64, 414x50, 414x65, 468x60\n  - 481x56, 640x100, 640x200, 667x56, 711x88, 800x50\n  - 970x250, 994x250, 1029x258\n\nFull screen dimensions:\n  - 300x600, 320x416, 320x480, 320x568, 360x592, 360x604, 360x640\n  - 360x718, 360x724, 360x728, 375x667, 384x787, 412x790, 414x736\n  - 428x846, 480x320, 640x360\n\nMedium dimensions:\n  - 160x600, 200x200, 250x250, 300x250, 320x240, 320x267, 336x280, 600x500\n\nTablet dimensions:\n  - 728x90, 768x1024, 1024x90, 1024x768, 1280x90"
    PolicyPolicyFunction:
      type: string
      enum:
      - UNKNOWN_POLICY
      - RANDOM_SELECTION
      - MOST_RECENT_VIEW
      - IN_CART
      - GLOBAL_TREND
      - TREND
      - COMBINED_EVENTS_RECENCY
      - FREQUENTLY_BOUGHT_TOGETHER
      - FREQUENTLY_SEEN_TOGETHER
      - KEYWORD_SEARCH_WITH_CLIENT_RESULT
      - COMBINED_EVENTS_RECENCY_WITH_KEYWORD_SEARCH
      - MODEL
      - GAME
      - RMP_AUDIENCE_EXTENSION
      - MCM_ITEM_RECOMMENDATION
      - NEXT_ITEM_SELECTION
      default: UNKNOWN_POLICY
      description: "PolicyFunction defines algorithms for selecting CatalogItems or CreativeElements for a game.\n\n - IN_CART: GLOBAL_TREND will be deprecated and replaced by TREND. During A/B testing, we will keep this not to break the test.\n - MODEL: For model policies, the policy enum is in the form of MODEL_{SOURCER_TYPE}_{EVALUATOR_TYPE}_{EVALUATOR_SUB_TYPE}\n - GAME: GAME policy is used to select Creative elements of game.\n - RMP_AUDIENCE_EXTENSION: Policy for RMP Audience Extension.\n - MCM_ITEM_RECOMMENDATION: Policy for MCM Item Recommendation.\n - NEXT_ITEM_SELECTION: Policy for NEXT Item Selection."
    messagesListCreativesErrorAPIErrorInfoErrorReason:
      type: string
      enum:
      - ERROR_REASON_UNKNOWN
      default: ERROR_REASON_UNKNOWN
    PolicyItemCapperFrequency:
      type: object
      properties:
        period:
          type: string
          description: 'The period is represented in a format {INTEGER}[smhdw].

            For example, "1m" indicates 1 minute. When this field is empty,

            the system default cooling time is used.'
        max_exposures:
          type: integer
          format: int32
          description: The max number of exposures of a CatalogItem within a period of time.
      description: "Frequency represents frequency capping. One can specify\n\"at most 3 exposures per 1 hour\" by setting:\n  {\n    \"period\": \"1h\",\n    \"max_exposures\": 3\n  }\nThis means, when a user sees a CatalogItem 3 times, he/she won't\nsee the same CatalogItem again for 1 hour."
