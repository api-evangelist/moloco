      default: ERROR_REASON_UNKNOWN
      description: " - CREATIVE_MUST_BE_ASSET_URL: image URL should be asset url but user used wrong url by its prefix.\n - CREATIVE_VIDEO_TYPE_SHOULD_HAVE_SINGLE_COMPANION_IMAGE: video type should have single companion image.\n - CREATIVE_VIDEO_TYPE_SHOULD_HAVE_SINGLE_ENDCARD_TYPE: video type should have a single endcard type.\n - CREATIVE_INVALID_IMAGE_FORMAT: invalid image format.\n - CREATIVE_UNSUPPORTED_IMAGE_FORMAT: unsupported image format.\n - CREATIVE_MALFORMED_URL: URL cannot be parsed.\n - CREATIVE_AT_LEAST_ONE_FIELD_MUST_BE_FILLED: at least one field should be filled.\n - CREATIVE_TYPE_AUTO_PLAY_AUDIO_ATTRIBUTE_INVALID: rich_custom_html with Facebook HTML should specify the auto_play_audio attribute (true/false).\n - CREATIVE_PLAYABLE_AD_INVALID_SOURCE_DATA: playable_ad_source_data has invalid value.\n - CREATIVE_PLAYABLE_AD_SOURCE_URL_INVALID_PREFIX: playable ad source url should be prefixed with domain name.\n - CREATIVE_NOT_SUPPORTED_IMAGE_DIMENSION: Specified image dimension is not supported.\n - CREATIVE_NO_ALLOWED_IMAGE_SIZE_ON_DSP_CONFIGURATION: no allowed image size is defined on dap configuration.\n - CREATIVE_TYPE_NOT_ALLOWED_VALUE_IN_PLAYABLE_AD_SOURCE: Value used in playable ad source is not allowed.\n - CREATIVE_TYPE_MUST_CONTAIN_ON_CTA_CLICK: FbPlayableAd.onCTAClick must be contained.\n - CREATIVE_ON_CTA_CLICK_CANNOT_HAVE_ARGUMENT: FbPlayableAd.onCTAClick must be inserted without an argument.\n - CREATIVE_TWO_VALUES_SHOULD_BE_SAME: two values should be same.\n - CREATIVE_FEATURE_TYPE_DYNAMIC_CREATIVE_NOT_SUPPORTED: Creative feature type is DYNAMIC_CREATIVE type but target app does not support Dynamic Creative Feature.\n - CREATIVE_INVALID_CRID_FORMAT: CRID has invalid format.\n - CREATIVE_INVALID_ICON_IMAGE_SHAPE: Creative icon image should be square.\n - CREATIVE_ONLY_ONE_SOURCE_ALLOWED: Creative can have only one source.\n - CREATIVE_SRC_SIZE_ATTRS_REQUIRED_FOR_NON_INTERSTITIAL: Specified non interstitial source type needs fixed attribute.\n - CREATIVE_INVALID_VIDEO_SRC_EXTENSION: Only mp4 is allowed for video_src extension.\n - CREATIVE_NO_VALID_COMPANION_IMAGE: All companion image has invalid dimensions.\n - CREATIVE_VIDEO_REQUIRED_FOR_CTV: Only Video creative is allowed for CTV product.\n - CREATIVE_ENDCARD_NOT_SUPPORTED_FOR_CTV_VIDEO: Endcard is not supported for CTV product video creative.\n - CREATIVE_TRANSCODED_VIDEO_SRC_SIZE_LIMIT_EXCEEDED: The video size after transcoding exceeds the size limit.\n - CREATIVE_VIDEO_SRC_INVALID_DIMENSION: At least one of the dimensions of the video, either the width or the height, should be greater than or equal to 640 pixels.\n - CREATIVE_VIDEO_SRC_LENGTH_NOT_IN_LIMIT: The video length should be between 6 and 100 seconds, inclusive."
