    dspCreativeGroupStatus:
      type: string
      enum:
      - UNKNOWN_STATUS
      - DRAFT
      - SUBMITTED
      - REVIEW_NOT_NEEDED
      - UNDER_REVIEW
      - APPROVED
      - DISAPPROVED
      default: UNKNOWN_STATUS
      description: "Enumeration of all possible CreativeGroup status.\n\n - UNKNOWN_STATUS: This value is not part of the specification.\n - DRAFT: The CreativeGroup is created but not submitted for review yet.\n - SUBMITTED: The CreativeGroup is submitted and pending review.\n - REVIEW_NOT_NEEDED: Review is determined by Moloco not needed for this CreativeGroup.\n - UNDER_REVIEW: The CreativeGroup is being reviewed.\n - APPROVED: The CreativeGroup has been approved.\n - DISAPPROVED: The CreativeGroup has been rejected."
    CampaignGoalOptimizeLandingForWebUaMode:
