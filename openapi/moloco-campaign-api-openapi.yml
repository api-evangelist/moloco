    dspCreative:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the Creative. Automatically set by server on creation.
        ad_account_id:
          type: string
          description: ID of the AdAccount the Creative belongs to.
          readOnly: true
        product_id:
          type: string
          description: ID of the Product the Creative belongs to.
          readOnly: true
        title:
          type: string
          description: A descriptive name of the Creative.
        enabling_state:
          $ref: '#/components/schemas/commonEnablingState'
          description: 'Whether this Creative is enabled by the AdAccount.


            If the value of this field is unset or set to UNSPECIFIED in the Creative

            creation request, it will be set to ENABLED by default by the server.


            A disabled Creative will still get reviewed, but won''t be served automatically after approval.


            An active serving Creative can be paused at any time by setting this field to DISABLED.'
        advertiser_info:
          $ref: '#/components/schemas/dspAdvertiserInfo'
          description: Basic information about the Creative's AdAccount.
          readOnly: true
        type:
          $ref: '#/components/schemas/dspCreativeType'
          description: Type of the Creative.
        original_filename:
          type: string
          description: Original Creative filename given by user.
        size_in_bytes:
          type: integer
          format: int64
          description: Estimated size of the Creative in bytes.
        custom_key_values:
          type: object
          additionalProperties:
            type: string
          description: 'Custom key/values managed by the Moloco Ads client platform. It''s

            up to the client ads platform to define the schema for the values and their

            optionality.


            The keys are recommended, but not required, to be prefixed with the reversed

            internet domain of the AdCloud client platform company. For example, keys defined

            by the client ads platform company "example.com" should have "com.example." as

            the prefix.


            For complex values, JSON payload is recommended.


            Moloco doesn''t interpret these data in any way for ads serving. Upon serving,

            the custom key/values in the AdAccount, Campaign, and Creative models will

            be combined into the serving Creative proto in the order of precedence, with

            Creative''s value having the highest precedence on the same key.'
        image:
          $ref: '#/components/schemas/dspCreativeImageSrc'
        video:
          $ref: '#/components/schemas/dspCreativeVideoSrc'
        vast_video:
          $ref: '#/components/schemas/dspCreativeVastVideoSrc'
        native:
          $ref: '#/components/schemas/dspCreativeNativeSrc'
        custom_html:
          $ref: '#/components/schemas/dspCreativeCustomHtmlSrc'
        template_html:
          $ref: '#/components/schemas/dspCreativeTemplateHtmlSrc'
        rich_custom_html:
          $ref: '#/components/schemas/dspCreativeRichCustomHtmlSrc'
        dynamic_html:
          $ref: '#/components/schemas/dspCreativeDynamicHtmlSrc'
        feature_type:
          $ref: '#/components/schemas/adcloudcommonCreativeFeatureType'
          description: CreativeFeatureType.
        creator_tag:
          type: string
          description: Creator tag to identify who is the resource creator.
        created_at:
          type: string
          format: date-time
          description: Created time.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last updated time. Should not modify on the client side.
      description: 'Creative contains all data and assets required to visually render an ad.


        One and only one of the sources must be specified for the Creative.'
      required:
      - title
      - original_filename
    ConversionValueConfigurationItemCvConfigurationForSingleEvent:
      type: object
      properties:
        cv_revenue_events:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ConversionValueConfigurationItemCvConfigurationForSingleEventEventInfo'
          description: 'Information on relationships between conversion value and (event name & revenue interval) for single event scheme.

            The key of this map is the registered conversion value between 1 to 63.

            The value of this map is a EventInfo message.

            EventInfo without revenue value should be unique.

