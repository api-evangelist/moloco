      - CURATE
      default: UNKNOWN_TRACKING_COMPANY
      description: "Enumeration for tracking companies supported by Moloco Ads.\n\n - WEB: Unnamed trackers\n - AIRBRIDGE: Moloco's e2e tracker (test purpose only)\n - KOCHAVA_FOR_PUBLISHER: Kochava's CTV to web event dedicated tracking company."
    SKAdNetworkInputCustomOption:
      type: string
      enum:
      - UNKNOWN_SKAN_CUSTOM_OPTION
      - SKAN_CUSTOM_OPTION_MMP_ATTRIBUTABLE
      - SKAN_CUSTOM_OPTION_BI_ATTRIBUTABLE
      - SKAN_CUSTOM_OPTION_NON_ATTRIBUTABLE
      - SKAN_CUSTOM_OPTION_SKAN_ATTRIBUTABLE
      default: UNKNOWN_SKAN_CUSTOM_OPTION
      description: "CustomOption enumerates all the available traffic.\nWhile the targeting_state other than 'TARGET_CUSTOM' is a pre-defined set of traffic,\nCustomOption enables configuring the targeted traffic in a custom way.\n\nThis value is not part of the specification.\n\n - SKAN_CUSTOM_OPTION_MMP_ATTRIBUTABLE: This option target traffic which is iOS < 14.5 and SKAdNetwork incompatible.\n - SKAN_CUSTOM_OPTION_BI_ATTRIBUTABLE: This option target traffic which is iOS < 14.5 and SKAdNetwork compatible.\n - SKAN_CUSTOM_OPTION_NON_ATTRIBUTABLE: This option target traffic which is iOS >= 14.5 and SKAdNetwork incompatible.\n - SKAN_CUSTOM_OPTION_SKAN_ATTRIBUTABLE: This option target traffic which is iOS >= 14.5 and SKAdNetwork compatible."
    dspAudienceTargetingCondition:
      type: object
      properties:
        allowed_countries:
          type: array
          items:
            type: string
          description: Allowed countries in ISO_3166-1_alpha-3 format.
        blocked_countries:
          type: array
          items:
            type: string
          description: Blocked countries in ISO_3166-1_alpha-3 format.
        placement_reasons:
          type: array
          items:
            $ref: '#/components/schemas/AudienceTargetingConditionPlacementReason'
        custom_placement_reason:
          type: string
          description: The reason of the placement in free-form text.
        allowed_app_bundles:
          type: array
          items:
            type: string
          description: "App bundles. A bid-request having a matching publisher app bundle from the list\nwill be accepted.\n\nExample to target com.moloco.game or com.moloco.travel apps:\n\n  \"allowed_app_bundles\": [ \"com.moloco.game\", \"com.moloco.travel\" ]\n\nExample to exclude com.moloco.office app:\n\n  \"blocked_app_bundles\": [ \"com.moloco.office\" ]"
        blocked_app_bundles:
          type: array
          items:
            type: string
          description: See the documentation for `allowed_app_bundles`.
        allowed_content_categories:
          type: array
          items:
            type: string
          description: "Filter for allowed publisher IAB categories.\n\nValid category values can be found in section \"5.1 Content Categories\" in the \"OpenRTB API Specification\":\n   https://github.com/openrtb/OpenRTB/blob/master/OpenRTB-API-Specification-Version-2-3-1-FINAL.pdf\n\nFor example: \"allowed_content_categories\": [ \"IAB26-1\" ]"
        blocked_content_categories:
          type: array
          items:
            type: string
          description: "Filter for blocked publisher IAB categories.\n\nValid category values can be found in section \"5.1 Content Categories\" in the \"OpenRTB API Specification\":\n   https://github.com/openrtb/OpenRTB/blob/master/OpenRTB-API-Specification-Version-2-3-1-FINAL.pdf\n\nFor example: \"blocked_content_categories\": [ \"IAB26-1\" ]"
        allowed_cities:
          type: array
          items:
            type: string
          description: "Allowed cities. A bid-request will be accepted when there is at least one\nmatch from the city list. Note that each element must be in\nthe form of \"city, region\" such as \"Seattle, WA\" in order to disambiguate\nthe same city but different regions. The entry is case-insensitive\nand whitespace will be ignored.\n\nExample to target Seattle or Newyork:\n\n  \"allowed_cities\": [ \"Seattle, WA\", \"Newyork, ny\" ]"
        blocked_cities:
          type: array
          items:
            type: string
          description: Blocked cities.
        allowed_creative_types:
          type: array
          items:
            $ref: '#/components/schemas/adcloudcommonCreativeType'
          description: Allowed Creative types.
        blocked_creative_types:
          type: array
          items:
            $ref: '#/components/schemas/adcloudcommonCreativeType'
          description: Blocked Creative types.
        allowed_websites:
          type: array
          items:
            type: string
          description: 'Allowed websites. A glob pattern can be used for matching. Ignored for app inventories.


            For example: "allowed_websites": [ "*youtube.com" ].'
        blocked_websites:
          type: array
          items:
            type: string
          description: 'Blocked websites. A glob pattern can be used for matching. Ignored for app inventories.


            For example: "blocked_websites": [ "*example.com" ].'
        allowed_geofences:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/commonCircle'
          description: Allowed geofences.
        blocked_geofences:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/commonCircle'
          description: Blocked geofences.
        allowed_exchanges:
          type: array
          items:
            $ref: '#/components/schemas/commonAdExchange'
          description: 'Allowed ad exchanges. Restricts targeting to bid only on the listed

            exchanges; an empty list places no restriction.


            MOLOCO_SDK is automatically included whenever the list is non-empty:

            submitting a non-empty list that omits MOLOCO_SDK will have it

            appended on the server side.'
        blocked_exchanges:
          type: array
          items:
            $ref: '#/components/schemas/commonAdExchange'
          description: 'Blocked ad exchanges. Excludes the listed exchanges from targeting.


            Adding MOLOCO_SDK to this list is rejected with PERMISSION_DENIED.'
        allowed_idfas:
          type: array
          items:
            type: string
          description: Allowed user IDFAs. IDFA supports glob; e.g. use "*f" to match all IDFAs ending with "f".
        blocked_idfas:
          type: array
          items:
            type: string
          description: Blocked user IDFAs. IDFA supports glob; e.g. use "*f" to match all IDFAs ending with "f".
        allowed_zipcodes:
          type: array
          items:
            type: string
          description: Allowed zipcodes.
        blocked_zipcodes:
          type: array
          items:
            type: string
          description: Blocked zipcodes.
        allowed_device_models:
          type: array
          items:
            type: string
          description: "Allowed device models.\n\nFor example:\n\n   \"allowed_device_models\": [ \"KFFOWI\", \"KFGIWI\", \"KFTT\", \"KFJWA\" ]"
        blocked_device_models:
          type: array
          items:
            type: string
          description: Blocked device models.
        allowed_user_audience_tags:
          type: array
          items:
            type: string
          description: Allowed user custom audience tags.
        blocked_user_audience_tags:
          type: array
          items:
            type: string
          description: Blocked user custom audience tags.
        allowed_languages:
          type: array
          items:
            type: string
          description: 'Allowed languages. Languages in use mostly follow ISO 639-1 code(https://www.loc.gov/standards/iso639-2/php/code_list.php),

            e.g. "ko" for Korean and "en" for English.'
        blocked_languages:
          type: array
          items:
            type: string
          description: Blocked languages.
        allowed_device_types:
          type: array
          items:
            $ref: '#/components/schemas/commonDeviceType'
          description: 'Allowed device types.


            For example: "allowed_device_types": [ "HIGHEND_PHONE", "TABLET" ]'
        blocked_device_types:
          type: array
          items:
            $ref: '#/components/schemas/commonDeviceType'
          description: 'Blocked device types.


            For example: "allowed_device_types": [ "SET_TOP_BOX" ]'
        allowed_mostly_visited_countries:
          type: array
          items:
            type: string
          description: 'This filter checks user''s history of mostly visited countries against the specified

            countries in the condition, and passes a request if there is at least one common entry

            in both lists.'
        blocked_mostly_visited_countries:
          type: array
          items:
            type: string
        allowed_regions:
          type: array
          items:
            type: string
          description: Regions are to filter a bid-request based on its region information.
        blocked_regions:
          type: array
          items:
            type: string
        allowed_recent_campaign_activities:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/AudienceTargetingConditionRecentCampaignActivityFilter'
          description: "Recent Campaign activities filter a bid-request by user's recent activity such as click or install\nin the last n days. The filter is satisfied if there is at least one satisfying condition among the list.\n\nExample to target a user who has a click event for com.moloco.gameapp:\n\n   \"allowed_recent_campaign_activities\": [\n      {\n         \"campaign_id\": \"com.moloco.gameapp\",\n         \"event\": \"CLICK\"\n      }\n   ]\n\nExample to block a user who has a install event for com.moloco.officeapp within the past five days:\n\n   \"blocked_recent_campaign_activities\": [\n      {\n         \"campaign_id\": \"com.moloco.officeapp\",\n         \"event\": \"INSTALL\",\n         \"last_n_days\": 5\n      }\n   ]"
        blocked_recent_campaign_activities:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/AudienceTargetingConditionRecentCampaignActivityFilter'
        allowed_locations:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/AudienceTargetingConditionLocationFilter'
          description: 'Location filter targets specific geo-locational audience using combined conditions

            of different types such as city, region, zipcode and geofence.'
        blocked_locations:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/AudienceTargetingConditionLocationFilter'
        genders:
          type: array
          items:
            $ref: '#/components/schemas/commonGender'
        connection_types:
          type: array
          items:
            type: string
          description: 'Connection_types include ETHERNET, WIFI, CELL_UNKNOWN, CELL_2G, CELL_3G, CELL_4G.


            For example: "connection_types": [ "WIFI", "CELL_4G" ]'
        allowed_direct_deal_ids:
          type: array
          items:
            type: string
          description: "IDs of the allowed direct deals. A bid-request is accepted only if there is at least one matching id.\n\nFor example:\n\n   \"allowed_direct_deal_ids\": [\n      \"ip_9161499632014fe8b9ef60673a51b745\",\n      \"ip_e13c0cb23dd54a8ea742b2af61e0712d\",\n      \"ip_0cfeaebb190d47df8b86399232853e23\"\n   ]"
        blocked_direct_deal_ids:
          type: array
          items:
            type: string
          description: IDs of the blocked direct deals.
        device_oses:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/AudienceTargetingConditionDeviceOsFilter'
          description: Device OS requirements if specified.
        media_channel_type:
          $ref: '#/components/schemas/AudienceTargetingConditionMediaChannelType'
          description: Media channel types.
        new_users:
          $ref: '#/components/schemas/AudienceTargetingConditionNewUserFilter'
          description: "Filter to target only new users.\n\nExample to accept a bid-request for new users with earliest known activities within the last 5 days:\n\n   \"new_users\": {\n      \"last_n_days\": 5\n   }"
        advertiser_id_types:
          type: array
          items:
            $ref: '#/components/schemas/commonAdvertiserIdType'
          description: Filter on advising ID types, including "ANDROID_IDFA" or "IOS_IDFA".
        allowed_video_types:
          type: array
          items:
            $ref: '#/components/schemas/dspAudienceTargetingConditionVideoType'
          description: Video type filter. Ignored when the bid request is not for video ads.
        blocked_video_types:
          type: array
          items:
            $ref: '#/components/schemas/dspAudienceTargetingConditionVideoType'
        weekly_schedules:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/AudienceTargetingConditionWeeklyScheduleFilter'
          description: "Weekly schedule specifies more fine-grained time range filtering for days of a week. For example,\nthis list can be used to specify commute time ranges in the morning and evening on workdays.\n\nExample to target 7-9 am and 5-7 pm during week days:\n\n     \"weekly_schedules\": [\n        {\n           \"hour_range\": {\n              \"start\": 7,\n              \"end\": 9\n           },\n           \"days\": [ \"MON\", \"TUE\", \"WED\", \"THU\", \"FRI\" ]\n        },\n        {\n           \"hour_range\": {\n               \"start\": 17,\n               \"end\": 19\n           },\n           \"days\": [ \"MON\", \"TUE\", \"WED\", \"THU\", \"FRI\" ]\n        }\n     ]\n\nExample to target 10pm to 2am on Fridays and Saturdays:\n\n  \"weekly_schedules\": [\n      {\n         \"range\": {\n             \"start\": 22,\n             \"end\": 2\n         },\n         \"days\": [ \"FRI\", \"SAT\" ]\n      }\n  ]"
        allowed_gender_score:
          $ref: '#/components/schemas/adcloudcommonFloatingPointRange'
          description: 'Gender score filter uses approximated gender score probability distribution in

            the range of [0, 1], with 0 indicating a strong probability of male, and 1 indicating

            a strong probability of female.


            The filter is specified with a range of [start, end] to filter on user''s gender score.'
        blocked_gender_score:
          $ref: '#/components/schemas/adcloudcommonFloatingPointRange'
        allowed_ages:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/adcloudcommonInterval'
          description: 'Age is used to filter based on user''s approximate age. A valid value must be in

            the exclusive range of (0, 100).'
        blocked_ages:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/adcloudcommonInterval'
        allowed_ip_ranges:
          type: array
          items:
            type: string
          description: "IP net based condition. The CIDR format must be used for an entry such as\nhttps://en.wikipedia.org/wiki/Classless_Inter-Domain_Routing.\nNote that both of IP v4 and v6 could be used at the same time.\n\nExample to block bid-requests with any IP within 32.76.52.0 - 32.76.52.255 or 127.0.0.0 - 127.255.255.255:\n\n   \"blocked_ip_ranges\": [\n     \"32.76.52.0/24\",\n     \"127.0.0.0/8\"\n   ]"
        blocked_ip_ranges:
          type: array
          items:
            type: string
        allowed_device_carriers:
          type: array
          items:
            type: string
          description: "Device carrier filter.\n\nExample to target SKT:\n\n   \"allowed_device_carriers\": [ \"SKTelecom\" ]\n\n\nExample to exclude T-MOBILE and XFINITY Mobile\n\n   \"blocked_device_carriers\": [ \"T-MOBILE\", \"XFINITY Mobile\" ]"
        blocked_device_carriers:
          type: array
          items:
            type: string
        allowed_keywords:
          type: array
          items:
            type: string
          description: 'Filter regarding ''keywords'' field in a bid request.


            If specified, an ad request must have at least one of the allowed keywords

            to satisfy the filter.'
        blocked_keywords:
          type: array
          items:
            type: string
          description: 'Filter regarding ''keywords'' field in a bid request.


            An ad request must not have any of the blocked keywords to satisfy the filter.'
        user_buckets:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/adcloudcommonInterval'
          description: Filter for the user buckets.
        allowed_ad_units:
          type: array
          items:
            type: string
          description: '// Target timetree_i_prod or timetree_a_prod ad_units

            "condition": {

            "allowed_ad_units": [ "timetree_i_prod", "timetree_a_prod" ]

            }


            // Exclude timetree_i_test ad_unit

            "condition": {

            "blocked_ad_units": [ "timetree_i_test" ]

            }'
          title: 'Example:'
        blocked_ad_units:
          type: array
          items:
            type: string
        allowed_placements:
          type: array
          items:
            type: string
          description: placement (a group of ad_units) names. It is untied to ad_units, and follow the ad_unit's filtering rule.
        blocked_placements:
          type: array
          items:
            type: string
        allowed_banner_apis:
          type: array
          items:
            $ref: '#/components/schemas/commonBannerApi'
          description: '// Target MRAID_2 banner only

            "condition": {

            "allowed_banner_apis": [ "MRAID_2" ]

            }'
          title: 'Example:'
        blocked_banner_apis:
          type: array
          items:
            $ref: '#/components/schemas/commonBannerApi'
        schedule:
          $ref: '#/components/schemas/commonTimeInterval'
          description: "Schedule to allow bid-requests in a absolute time range, where start and end\nare in RFC3339 format. A few example from https://tools.ietf.org/html/rfc3999\nis listed below.\n\n     1985-04-12T23:20:50.52Z\n\n  This represents 20 minutes and 50.52 seconds after the 23rd hour of\n  April 12th, 1985 in UTC.\n\n\n     1996-12-19T16:39:57-08:00\n\n  This represents 39 minutes and 57 seconds after the 16th hour of\n  December 19th, 1996 with an offset of -08:00 from UTC (Pacific\n  Standard Time).  Note that this is equivalent to 1996-12-20T00:39:57Z\n  in UTC.\n\n   Example:\n\n   // Christmas through end of the year\n   \"condition\": {\n       \"schedule\": {\n           \"start\": \"2020-12-24T00:00:00Z\",\n           \"end\": \"2020-12-31T23:59:59Z\"\n       }\n   }"
        audience_data:
          $ref: '#/components/schemas/commonAudienceData'
          description: "Audience data.\n\n   Example:\n   \"condition\": {\n       \"audience_data\": {\n           \"provider\": \"moloco\",\n           \"condition\": \"name == \\\"John\"\\ AND age > 30\"\n       }\n   }"
        allowed_apps_by_checksum:
          type: array
          items:
            type: string
          description: Allow apps by their checksum value.
        blocked_apps_by_checksum:
          type: array
          items:
            type: string
          description: Block apps by their checksum value.
        allowed_postback_event_counts:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/commonPostbackEventCount'
          description: "PostbackEventCount condition checks the number of specified events and\naccepts if there is one event that falls within given range of [start,\nend). In the example, User's event named \"Transaction confirmation\"\nmust have been appeared 16 times or more to accept for zigbang app.\n\n   Example:\n   \"condition\": {\n       \"allowed_postback_event_counts\": [\n           {\n               \"app_bundle\": \"com.chbreeze.jikbang4a\",\n               \"range\": {\n                   \"start\": 16,\n                   \"end\": 0\n               },\n               \"events\": [\n                   \"Transaction confirmation\"\n               ]\n           }\n       ]\n   }"
        auction_types:
          type: array
          items:
            type: string
          description: "Auction types including first price or second price auctions.\n\n   Example:\n   \"condition\": {\n       \"auction_types\": [ \"first\", \"second\" ]\n   }"
        throttle_apt_tags:
          $ref: '#/components/schemas/commonTagsThrottleCondition'
          title: "Allow throttle apps with apt tags with throttle rate. In the example,\nthrottle apps with apt_tags [bad_apptag1, bad_apptag2] with 95% of throttle rate\nare allowed.\nExample:\n\"condition\":{\n   \"throttle_apt_tags\": {\n       \"tags\": [\"badapp_tag1\", \"badapp_tag2\"],\n       \"throttle_rate\": 0.95\n   }\n}"
        allowed_dev_makes:
          type: array
          items:
            type: string
          description: "Allowed device make.\n\n   Example:\n   \"condition\":{\n       \"allowed_dev_makes\": [ \"Apple\" ]\n   }"
        blocked_dev_makes:
          type: array
          items:
            type: string
          description: Blocked device make. See the example of `allowed_dev_makes`.
        display_manager_versions:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/commonDisplayManagerVersion'
          description: "DisplayManager Version.\n\n   Example:\n\n   \"condition\": {\n       \"display_manager_versions\": [\n           {\n               \"min\": \"1.2\",\n               \"max\": \"4.5.6\"\n           }\n       ]\n   }\n\n   // With minimum version requirement:\n   \"condition\": {\n       \"display_manager_versions\": [\n           {\n               \"min\": \"3.0\"\n           }\n       ]\n   }\n\n   // With maximum version requirement:\n   \"condition\": {\n       \"display_manager_versions\": [\n           {\n               \"max\": \"5\"\n           }\n       ]\n   }"
        allowed_audiences:
          type: array
          items:
            type: string
          description: Allowed audiences.
        blocked_audiences:
          type: array
          items:
            type: string
          description: Blocked audiences.
        allowed_postback_has_all_events_conditions:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/commonPostbackEventsCondition'
          description: 'Postback event condition filter a bid-request by user''s postback summary. Note that audience name

            and events are of case-sentitive string types.

            Each entry of allowed_postback_has_all_events_conditions will be satisfied when all listed events

            are found from user''s postback summary.'
        blocked_postback_has_all_events_conditions:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/commonPostbackEventsCondition'
          description: 'Each entry of blocked_postback_has_all_events_conditions will be satisfied when all listed events

            are not found from user''s postback summary.'
        allowed_postback_has_any_events_conditions:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/commonPostbackEventsCondition'
          title: "Each entry of allowed_postback_has_any_events_conditions will be satisfied when there is at least\none matching event by the condition from user's postback summary.\nThe following example defines in-app events of \"com.moloco.gameapp\" for a user bound to the\nbid-request. The condition must have both of \"adview\" and \"purchase\" events within the\npast 14 days but no \"Open\" or \"Close\" events in the last 7 days.\nExample:\n   \"condition\": {\n       \"allowed_postback_has_all_events_conditions\": [\n           {\n               \"audiences\": [ \"com.moloco.gameapp\" ],\n               \"events\": [ \"adview\", \"purchase\" ],\n               \"past_time_range\": {\n                   \"start\": 14\n               }\n           }\n       ],\n       \"blocked_postback_has_any_events_conditions\": [\n           {\n               \"audiences\": [ \"com.moloco.gameapp\" ],\n               \"events\": [ \"Open\", \"Close\" ],\n               \"past_time_range\": {\n                   \"start\": 7\n               }\n           }\n       ]\n   }"
        blocked_postback_has_any_events_conditions:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/commonPostbackEventsCondition'
          description: 'Each entry of blocked_postback_has_any_events_conditions will be satisfied when there is at least

            one event not matched by the condition from user''s postback summary. See the documentation for

            `allowed_postback_has_any_events_conditions`.'
        allowed_location_set:
          $ref: '#/components/schemas/AudienceTargetingConditionLocationSet'
          description: 'Allowed and blocked location sets. If these fields are set,

            allowed_location_codes and blocked_location_codes are ignored.'
        blocked_location_set:
          $ref: '#/components/schemas/AudienceTargetingConditionLocationSet'
        allowed_apt_tags:
          type: array
          items:
            type: string
        blocked_apt_tags:
          type: array
          items:
            type: string
        coppa_acceptance:
          $ref: '#/components/schemas/AudienceTargetingConditionCoppaAcceptance'
          description: Whether to bid according to BidRequest.regs.coppa value.
        skan_traffic:
          $ref: '#/components/schemas/AudienceTargetingConditionSkanTraffic'
          description: 'Whether to bid according to bid requests that support SKAN or not.

            Decide based on bidreq.ext.sk_ad_network_request_ext field exists.'
        contains_custom_audience:
          type: boolean
          description: 'Whether it contains a `custom_audience` targeting condition.

            The `custom_audience` targeting condition is legacy, and may contain some internal information.

            Therefore, we do not reveal them by the API but only signals its non-emptiness with this field.'
        custom_audience_set:
          $ref: '#/components/schemas/AudienceTargetingConditionCustomAudienceSet'
          description: 'CustomAudienceSet is a combination of app events and user lists filters.

            The app events filter checks if the targeted user conforms to given app events.

            The CustomerSet filter checks if an entry in the list can be found

            from tags in a user profile. There is an assumption that a CustomerSet

            entity exists for each and every entry in the list.'
      description: 'AudienceTargetingCondition specifies conditions for AudienceTargeting.


        This condition object contains various filters on multiple dimensions of bid-request,

        app, and user. Advertisers can selectively configure desired filters to form a

        meaningful AudienceTarget condition collectively. The configured individual filters

        must be satisfied unanimously in order for the resulting collective condition to be

        satisfied.


        Only filters with values will be effective. When a filter condition accepts

        a list of values, i.e., list of countries for "allowed_countries", the filter

        condition will be met when any match is found among the list.


        String literals are case insensitive unless specified otherwise; i.e. "USA" and "usa"

        equally represents the United States of America.'
    commonPostbackEventsCondition:
      type: object
      properties:
        audiences:
          type: array
          items:
            type: string
          description: Audience name. i.e. app bundle.
        events:
          type: array
          items:
            type: string
          description: List of events such as install and purchase.
        past_time_range:
          $ref: '#/components/schemas/adcloudcommonInterval'
          description: Past time range for a postback event.
        past_time_range_unit:
          $ref: '#/components/schemas/commonTimeUnit'
          description: 'The unit for past_time_range.

            In PostbackEventsCondition, only DAY and MINUTE are used.'
        range:
          $ref: '#/components/schemas/commonTimeInterval'
          description: Range for a postback event.
        short_term_user_profile:
          type: boolean
          description: If set, short-term user profile information is used to evaluate this condition.
