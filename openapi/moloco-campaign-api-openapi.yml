          type: boolean
          description: 'A flag to allow empty value of advertiser_domain. Setting this flag to true acknowledges that some exchanges may deny campaigns if the advertiser_domain is empty.

            From v1.7.4, the value should be true if the value of advertiser_domain is empty.'
        device_os:
          $ref: '#/components/schemas/commonDeviceOs'
          description: Device OS of the Product. It means that the OS of the device where the Campaign of this Product is provided.
        developer_name:
          type: string
          description: 'The developer name of the Product. Some publishers request the sponsor information for the native Creative.

            The value of developer_name will be used to fill that information. Please note that this value could be displayed on user''s screen.

            If this field is empty, native Creative''s title will be used.'
        type:
          $ref: '#/components/schemas/dspProductType'
          description: The type of the Product.
        app:
          $ref: '#/components/schemas/ProductAppProperties'
          description: Required for APP type.
        web:
          $ref: '#/components/schemas/ProductWebProperties'
          description: Required for WEB type.
        dynamic_creative_property:
          $ref: '#/components/schemas/ProductDynamicCreativeProperty'
          description: Properties for using dynamic Creative. Immutable.
        suspension_history:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/ProductSuspensionAction'
          description: 'List of suspension actions.

            It is sorted by timestamp in descending order, so the first one is the current suspension result.'
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Created time.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last updated time. Should not modify on the client side.
          readOnly: true
      description: 'Product represents an app (per device OS) or a website that an AdAccount want to promote with a Campaign.

        A Campaign should be associated with a single Product.'
      required:
      - type
      - title
      - advertiser_domain
    dspCampaignState:
      type: string
      enum:
      - UNKNOWN_CAMPAIGN_STATE
      - SUBMITTED
      - READY
      - UPCOMING
      - ACTIVE
      - PAUSED
      - SUSPENDED
      - COMPLETED
      default: UNKNOWN_CAMPAIGN_STATE
      description: "CampaignState represents various states of a Campaign.\n\nThis value is not part of the specification.\n\n - SUBMITTED: All the required data are entered and passed all the validation. It's eligible\nto be reviewed by Moloco for activation.\n - READY: Campaign is before schedule and internally ready but disabled.\nWill transit to PAUSED when it becomes on schdule.\n - UPCOMING: Campaign is before schedule and internally ready and disabled.\nWill transit to ACTIVE when it becomes on schdule.\n - ACTIVE: Campaign is on schedule and spending the budget.\n - PAUSED: Campaign is paused and not spending the budget.\n - SUSPENDED: Campaign activation is suspended by the system for the following reasons:\n- App has been found to be in violation of Moloco's creative policy.\n - COMPLETED: Campaign is completed but may still get attributions for some time."
    messagesReadCampaignResponse:
      type: object
      properties:
        campaign:
          $ref: '#/components/schemas/dspCampaign'
          description: The retrieved Campaign data.
        postback_integration_status:
          $ref: '#/components/schemas/dspPostbackIntegrationStatus'
          description: The postback integration status.
    dspCreativeHtmlRequirementAttributesFlag:
      type: string
      enum:
      - UNKNOWN_FLAG
      - MRAID2
      - IN_BANNER_VIDEO
      default: UNKNOWN_FLAG
      description: "This value is not part of the specification.\n\n - MRAID2: AdX: 32 MraidType: MRAID.\n - IN_BANNER_VIDEO: AdX: 95 VideoType: In-Banner Video (Publisher Blockable)."
      title: "This is similar to AdX' Creative attributes:\n  https://storage.googleapis.com/adx-rtb-dictionaries/buyer-declarable-creative-attributes.txt\nSince the purpose of these flags is filtering, we also take into consideration\nwhat inventories can ban:\n  https://storage.googleapis.com/adx-rtb-dictionaries/publisher-excludable-creative-attributes.txt"
    CreativeHtmlSizeAttributesFixed:
      type: object
