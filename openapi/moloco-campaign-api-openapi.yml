    dspProduct:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the Product. Automatically set by server on creation.
        ad_account_id:
          type: string
          description: The ID of the AdAccount the Product belongs to.
          readOnly: true
        title:
          type: string
          description: A descriptive name of the Product.
        description:
          type: string
          description: A short description of the Product.
        advertiser_domain:
          type: string
          description: 'Advertiser domain (e.g., "ford.com"). Usually the domain of AdAccounts''s web page.

            From v1.7.4, it should be non empty if the value of allow_empty_advertiser_domain is false.

            If the value is empty, some exchanges may deny campaigns under the product.'
