    messagesCreateCampaignErrorAPIErrorInfoErrorReason:
      type: string
      enum:
      - ERROR_REASON_UNKNOWN
      - CAMPAIGN_SKAN_MUST_BE_UNSET_FOR_NON_IOS_CAMPAIGN
      - CAMPAIGN_SKAN_MUST_BE_SET_FOR_IOS_CAMPAIGN
      - CAMPAIGN_SKAN_CUSTOM_OPTIONS_REQUIRED
      - CAMPAIGN_TYPE_TRACKING_LINK_REQUIRED
      - CAMPAIGN_TYPE_LANDING_URL_NOT_ALLOWED
      - CAMPAIGN_TYPE_LANDING_URL_REQUIRED
      - CAMPAIGN_TYPE_TRACKING_LINK_NOT_ALLOWED
      - CAMPAIGN_GOAL_CANNOT_CREATE
      - CAMPAIGN_TYPE_CANNOT_CREATE_FOR_NON_APP_PRODUCT
      - CAMPAIGN_TYPE_REQUIRES_APP_PROPERTIES
      - CAMPAIGN_NO_VALID_TRACKING_COMPANY
      - CAMPAIGN_SKAN_INVALID_GOAL_ACTION
      - CAMPAIGN_NO_REVENUE_FOR_EVENT
      - CAMPAIGN_TYPE_MISMATCH_WITH_GOAL
      - CAMPAIGN_PAYOUT_ITEM_NUMBER_MISMATCH
      - CAMPAIGN_BUDGET_CURRENCY_MISMATCH
      - CAMPAIGN_OS_MISMATCH_WITH_TRACKING_LINK_OS
      - CAMPAIGN_PRODUCT_INCOMPATIBLE
      - CAMPAIGN_GOAL_TYPE_NOT_AVAILABLE
      - CAMPAIGN_SKAN_REACHED_MAX
      - CAMPAIGN_SKAN_PROHIBIT_WITHOUT_OWNERSHIP
      - CAMPAIGN_CREATIVE_GROUPS_NOT_FOUND
      - CAMPAIGN_BUDGET_REQUIRED
      - CAMPAIGN_ZERO_BUDGET_AE_CAMPAIGN_NOT_DISABLED
      - CAMPAIGN_TARGET_DUPLICATED_AD_PLATFORM
      - CAMPAIGN_AD_PLATFORMS_SHOULD_BE_SUPERSET_OF_AD_GROUPS
      - CAMPAIGN_TYPE_CANNOT_TARGET_MULTIPLE_OSES
      default: ERROR_REASON_UNKNOWN
      description: " - CAMPAIGN_SKAN_MUST_BE_UNSET_FOR_NON_IOS_CAMPAIGN: Cannot specify skadn_input for non IOS campaign.\n - CAMPAIGN_SKAN_MUST_BE_SET_FOR_IOS_CAMPAIGN: Must specify skadn_input for IOS campaign.\n - CAMPAIGN_SKAN_CUSTOM_OPTIONS_REQUIRED: custom_options must be set for skadn_input.\n - CAMPAIGN_TYPE_TRACKING_LINK_REQUIRED: tracking_link_id is required for APP installs or re-engagement type campaign.\n - CAMPAIGN_TYPE_LANDING_URL_NOT_ALLOWED: landing_url is not allowed for APP installs or re-engagement type campaign.\n - CAMPAIGN_TYPE_LANDING_URL_REQUIRED: landing_url is required for WEB type campaign.\n - CAMPAIGN_TYPE_TRACKING_LINK_NOT_ALLOWED: campaign.tracking_link_id is not allowed for WEB type campaign.\n - CAMPAIGN_GOAL_CANNOT_CREATE: Cannot create a campaign with specified goal type.\n - CAMPAIGN_TYPE_CANNOT_CREATE_FOR_NON_APP_PRODUCT: Specified campaign type cannot have non APP type product.\n - CAMPAIGN_TYPE_REQUIRES_APP_PROPERTIES: Specified campaign type should have APP properties under the Product.\n - CAMPAIGN_NO_VALID_TRACKING_COMPANY: Creating campaign has invalid tracking company information.\nInput tracking link id should be set or target Product should have postback integration.\n - CAMPAIGN_SKAN_INVALID_GOAL_ACTION: The specified goal action is not valid event for SKAdNetwork.\n - CAMPAIGN_NO_REVENUE_FOR_EVENT: The specified goal action does not have revenue range.\n - CAMPAIGN_TYPE_MISMATCH_WITH_GOAL: The campaign cannot have specified type for the specified goal.\n - CAMPAIGN_PAYOUT_ITEM_NUMBER_MISMATCH: The number of PayoutItem should be matched with the length of Campaigns or 0.\n - CAMPAIGN_BUDGET_CURRENCY_MISMATCH: The budget currency should match the currency of the Campaign.\n - CAMPAIGN_OS_MISMATCH_WITH_TRACKING_LINK_OS: Target OS of campaign does not match with target OS of TrackingLink.\n - CAMPAIGN_PRODUCT_INCOMPATIBLE: The campaign type is incompatible with target product.\n - CAMPAIGN_GOAL_TYPE_NOT_AVAILABLE: The goal type is not available.\n - CAMPAIGN_SKAN_REACHED_MAX: Maximum number of campaigns per App targeting SKAdNetwork compatible traffic has already reached.\n - CAMPAIGN_SKAN_PROHIBIT_WITHOUT_OWNERSHIP: Creating SKAdNetwork targeting campaigns is not allowed without the ownership for the iOS app.\n - CAMPAIGN_CREATIVE_GROUPS_NOT_FOUND: Cannot find matching CreativeGroups for specified creative_group_ids.\n - CAMPAIGN_BUDGET_REQUIRED: Campaign budget is required.\n - CAMPAIGN_ZERO_BUDGET_AE_CAMPAIGN_NOT_DISABLED: Campaign should be disabled if budget_ratio_percent of audience extension is 0% or 100%.\n - CAMPAIGN_TARGET_DUPLICATED_AD_PLATFORM: Campaign has duplicated targeting ad platform.\n - CAMPAIGN_AD_PLATFORMS_SHOULD_BE_SUPERSET_OF_AD_GROUPS: Campaign's targeting ad platforms should be superset of AdGroups'.\n - CAMPAIGN_TYPE_CANNOT_TARGET_MULTIPLE_OSES: Given campaign type cannot target multiple OSes."
