      - REASON_BRAND_SAFETY
      - REASON_PERFORMANCE_IMPROVEMENT
      - REASON_AGE_RESTRICTION
      - REASON_FRAUD
      - REASON_OWN_APP_CROSS_PROMOTION_BLOCKING
      - REASON_NOT_OPERATING_IN_A_SPECIFIC_LOCATION
      - REASON_INCREMENTALITY_TESTING
      - REASON_OTHER
