          description: 'Country codes where the app is available in the store.

            The value format is ISO-3166-1 Alpha-2 using uppercase letters only, such as "KR" or "US".'
        unavailable_countries:
          type: array
          items:
            type: string
          description: 'Country codes where the app is unavailable in the store.

            The value format is ISO-3166-1 Alpha-2 using uppercase letters only, such as "KR" or "US".'
        rtb_bundle_ids:
          type: array
          items:
            type: string
          description: 'RTB bundle names that related to the target app for which a Campaign runs.

            This field is useful when the target app and/or its family apps send out bid requests to the exchanges:

            (1) by nature, the Campaign must not deliver ad to the AdAccount''s own apps;

            (2) it''s better to ignore such apps for ads serving model training.'
        postback_integration:
          $ref: '#/components/schemas/dspPostbackIntegration'
          description: Active postback integration for the app.
        mmp_integration:
          $ref: '#/components/schemas/dspMmpIntegration'
          description: MmpIntegration of the Product. Immutable.
        skadn_mmp_integration:
          $ref: '#/components/schemas/dspMmpIntegration'
          description: SKAN MmpIntegration of the Product. Immutable.
        content_rating:
          type: string
          description: Content rating(App store age information) of the App.
        storekit_enabled:
          type: boolean
          description: StoreKit can be applied only for iOS app.
        autoinline_enabled:
          type: boolean
          description: AutoInline can be applied only for Android app.
        localized_app_name:
          type: object
          additionalProperties:
            type: string
          title: Field for mapping language to it’s app name
          readOnly: true
        localized_app_icon_url:
