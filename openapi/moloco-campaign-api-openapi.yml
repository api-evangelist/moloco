    ProductAppProperties:
      type: object
      properties:
        bundle_id:
          type: string
          description: App bundle ID. Immutable.
        category:
          type: string
          description: 'The main IAB content category of the App.


            This field is now output only and will be removed after v1.10.

            Before that, it is auto-filled from the categories field.

            Please use ''categories'' field instead.


            Valid category values can be found in section "5.1 Content Categories" in the [OpenRTB API Specification]

            (https://github.com/openrtb/OpenRTB/blob/master/OpenRTB-API-Specification-Version-2-3-1-FINAL.pdf).'
          readOnly: true
        categories:
          type: array
          items:
            type: string
          description: 'The IAB categories of the App. All the categories must be valid IAB categories.


            On create Product, the system checks the App Metadata Inventory: if the app is found, the Inventory values override user input; otherwise, the API uses the provided input.


            This field is editable only when the app is not in Inventory, and becomes read-only if the app exists there.


            Valid category values can be found in section "5.1 Content Categories" in the [OpenRTB API Specification]

            (https://github.com/openrtb/OpenRTB/blob/master/OpenRTB-API-Specification-Version-2-3-1-FINAL.pdf).'
        category_readable:
          type: string
          title: App category in a human-readable format from the app store
        rating:
          type: number
          format: double
          description: App rating in the range of [0, 5].
        rating_cnt:
          type: string
          format: int64
          title: Total number of app ratings from the app store
        app_store_url:
          type: string
          description: App store URL for Google Play, Apple App Store or Other App Markets.
        available_countries:
          type: array
          items:
