    dspReadCreativeGroupOverview:
      type: object
      properties:
        creative_group:
          $ref: '#/components/schemas/dspCreativeGroup'
          description: The retrieved CreativeGroup.
        state:
          $ref: '#/components/schemas/commonEnablingState'
          description: 'State of the CreativeGroup.

            Enabled state means that the CreativeGroup is used for bidding.'
        inactive_reasons:
          type: array
          items:
            $ref: '#/components/schemas/dspCreativeGroupInactiveReason'
          description: "Inactive reasons of CreativeGroup if the CreativeGroup is not used for bidding.\n\n - NO_CREATIVE: It implies that the CreativeGroup has no Creative.\n - NO_ADGROUP: It implies that the CreativeGroup is not linked to any AdGroup.\n - SCHEDULED: It implies that the CreativeGroup is scheduled to run at a future day/time.\n - NO_ENABLED_CREATIVE: It implies that the CreativeGroup has no enabled Creative. If a CreativeGroup has NO_CREATIVE as inactive reasons, NO_ENABLED_CREATIVE won't be included.\n - NO_ENABLED_ADGROUP: It implies that the CreativeGroup is not linked to any enabled AdGroup. If a CreativeGroup has NO_ADGROUP as inactive reasons, NO_ENABLED_ADGROUP won't be included.\n - NO_ENABLED_CAMPAIGN: It implies that the CreativeGroup is not linked to any enabled Campaign. If a CreativeGroup has NO_ADGROUP as inactive reasons, which implies it doesn't belongs to any campaign too, so NO_ENABLED_CAMPAIGN won't be included.\n - DISABLED_CREATIVE_GROUP: It implies that the CreativeGroup's enabling state is set as DISABLED.\n - ENDED: It implies that the CreativeGroup has passed its schedule end date."
        creative_group_referrer_infos:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/dspCreativeGroupReferrerInfo'
          description: CreativeGroupReferrerInfo is data of the CreativeGroup's relational entities which use the CreativeGroup.
      description: 'ReadCreativeGroupOverview is an overview information of CreativeGroup entity.

        Retrieved when the inquiry_option = INQUIRY_OVERVIEW.'
    TargetFuturePreferenceInfoProductScope:
      type: string
      enum:
      - UNKNOWN
      - ALL
      - ANDROID
      - IOS
      default: UNKNOWN
      description: ProductScope indicates the scope of Product of which the target prefers.
    dspAudienceTargetingConditionVideoType:
      type: string
      enum:
      - UNKNOWN_VIDEO_TYPE
      - REWARD_VIDEO
      - NON_REWARD_VIDEO
      - NON_VIDEO
      default: UNKNOWN_VIDEO_TYPE
      description: This value is not part of the specification.
    commonAdvertiserIdType:
      type: string
      enum:
      - UNKNOWN_ADVERTISER_ID_TYPE
      - ANDROID_IDFA
      - IOS_IDFA
      - GENERIC_USER_ID
      - GENERIC_DEVICE_ID
      - ANDROID_LAT_IDFA
      - IOS_LAT_IDFA
      default: UNKNOWN_ADVERTISER_ID_TYPE
      description: "Enumeration of supported ID types for advertises.\n\nThis value is not part of the specification.\n\n - ANDROID_IDFA: IDFA used in Android.\n - IOS_IDFA: IDFA used in iOS.\n - GENERIC_USER_ID: This is used when IDFA is unavailable and an alternative user id is available.\nFor example, Google's adid is used for mobile web inventories.\n - GENERIC_DEVICE_ID: This is used when IDFA is unavailable and an alternative device id is available.\nFor example, Mopub sends out device id in some apps.\n - ANDROID_LAT_IDFA: infra-generating IDFA used for Android LAT devices\n - IOS_LAT_IDFA: infra-generating IDFA used for iOS LAT devices"
    PolicyPolicyFunction:
      type: string
      enum:
      - UNKNOWN_POLICY
      - RANDOM_SELECTION
      - MOST_RECENT_VIEW
      - IN_CART
      - GLOBAL_TREND
      - TREND
      - COMBINED_EVENTS_RECENCY
      - FREQUENTLY_BOUGHT_TOGETHER
      - FREQUENTLY_SEEN_TOGETHER
      - KEYWORD_SEARCH_WITH_CLIENT_RESULT
      - COMBINED_EVENTS_RECENCY_WITH_KEYWORD_SEARCH
      - MODEL
      - GAME
      - RMP_AUDIENCE_EXTENSION
      - MCM_ITEM_RECOMMENDATION
      - NEXT_ITEM_SELECTION
      default: UNKNOWN_POLICY
      description: "PolicyFunction defines algorithms for selecting CatalogItems or CreativeElements for a game.\n\n - IN_CART: GLOBAL_TREND will be deprecated and replaced by TREND. During A/B testing, we will keep this not to break the test.\n - MODEL: For model policies, the policy enum is in the form of MODEL_{SOURCER_TYPE}_{EVALUATOR_TYPE}_{EVALUATOR_SUB_TYPE}\n - GAME: GAME policy is used to select Creative elements of game.\n - RMP_AUDIENCE_EXTENSION: Policy for RMP Audience Extension.\n - MCM_ITEM_RECOMMENDATION: Policy for MCM Item Recommendation.\n - NEXT_ITEM_SELECTION: Policy for NEXT Item Selection."
    CampaignGoalOptimizeAppRoasMode:
      type: string
      enum:
      - UNKNOWN_MODE
      - BUDGET_CENTRIC
      - MARGIN_CENTRIC
      - TARGET_PRIMARY_KPI_CENTRIC
      default: UNKNOWN_MODE
    ProductSuspensionActionType:
      type: string
      enum:
      - UNKNOWN_TYPE
      - SUSPEND_UNTIL
      - SUSPEND_INDEFINITELY
      - STOP_SUSPENSION
      default: UNKNOWN_TYPE
      description: "The type which the current action achieves.\n\n - SUSPEND_UNTIL: The current action is for product suspension until someday.\n - SUSPEND_INDEFINITELY: The current action is for product suspension indefinitely.\n - STOP_SUSPENSION: The current action is to stop product suspension."
    CampaignGoalOptimizeCpaForAppRe:
