      - CAMPAIGN_TYPE_LANDING_URL_NOT_ALLOWED
      - CAMPAIGN_TYPE_LANDING_URL_REQUIRED
      - CAMPAIGN_TYPE_TRACKING_LINK_NOT_ALLOWED
      - CAMPAIGN_TYPE_CANNOT_CREATE_FOR_NON_APP_PRODUCT
      - CAMPAIGN_TYPE_REQUIRES_APP_PROPERTIES
      - CAMPAIGN_NO_VALID_TRACKING_COMPANY
      - CAMPAIGN_SKAN_INVALID_GOAL_ACTION
      - CAMPAIGN_NO_REVENUE_FOR_EVENT
      - CAMPAIGN_ALREADY_ARCHIVED
      - CAMPAIGN_CANNOT_ENABLE_WITH_DISABLED_PAYOUT_ITEM
      - CAMPAIGN_NO_ENABLED_CREATIVE_GROUP
      - CAMPAIGN_CANNOT_ENABLE_FOR_NON_PAYABLE_ADVERTISER
      - CAMPAIGN_BUDGET_REQUIRED
      - CAMPAIGN_ZERO_BUDGET_AE_CAMPAIGN_NOT_DISABLED
      - CAMPAIGN_TARGET_DUPLICATED_AD_PLATFORM
      - CAMPAIGN_AD_PLATFORMS_SHOULD_BE_SUPERSET_OF_AD_GROUPS
      - CAMPAIGN_TYPE_CANNOT_TARGET_MULTIPLE_OSES
      default: ERROR_REASON_UNKNOWN
      description: " - CAMPAIGN_SKAN_MUST_BE_UNSET_FOR_NON_IOS_CAMPAIGN: Cannot specify skadn_input for non IOS campaign.\n - CAMPAIGN_SKAN_MUST_BE_SET_FOR_IOS_CAMPAIGN: Must specify skadn_input for IOS campaign.\n - CAMPAIGN_SKAN_CUSTOM_OPTIONS_REQUIRED: custom_options must be set for skadn_input.\n - CAMPAIGN_TYPE_TRACKING_LINK_REQUIRED: tracking_link_id is required for APP installs or re-engagement type campaign.\n - CAMPAIGN_TYPE_LANDING_URL_NOT_ALLOWED: landing_url is not allowed for APP installs or re-engagement type campaign.\n - CAMPAIGN_TYPE_LANDING_URL_REQUIRED: landing_url is required for WEB type campaign.\n - CAMPAIGN_TYPE_TRACKING_LINK_NOT_ALLOWED: campaign.tracking_link_id is not allowed for WEB type campaign.\n - CAMPAIGN_TYPE_CANNOT_CREATE_FOR_NON_APP_PRODUCT: Specified campaign type cannot have non APP type product.\n - CAMPAIGN_TYPE_REQUIRES_APP_PROPERTIES: Specified campaign type should have APP properties under the Product.\n - CAMPAIGN_NO_VALID_TRACKING_COMPANY: Creating campaign has invalid tracking company information.\nInput tracking link id should be set or target Product should have postback integration.\n - CAMPAIGN_SKAN_INVALID_GOAL_ACTION: The specified goal action is not valid event for SKAdNetwork.\n - CAMPAIGN_NO_REVENUE_FOR_EVENT: The specified goal action does not have revenue range.\n - CAMPAIGN_ALREADY_ARCHIVED: The target campaign is already archived.\n - CAMPAIGN_CANNOT_ENABLE_WITH_DISABLED_PAYOUT_ITEM: Cannot enable the campaign with disabled PayoutItem.\n - CAMPAIGN_NO_ENABLED_CREATIVE_GROUP: Cannot enable the campaign with no enabled CreativeGroup with Creatives.\n - CAMPAIGN_CANNOT_ENABLE_FOR_NON_PAYABLE_ADVERTISER: Cannot enable a campaign whose advertiser is not ready for billing.\n - CAMPAIGN_BUDGET_REQUIRED: Campaign budget is required.\n - CAMPAIGN_ZERO_BUDGET_AE_CAMPAIGN_NOT_DISABLED: Campaign should be disabled if budget_ratio_percent of audience extension is 0% or 100%.\n - CAMPAIGN_TARGET_DUPLICATED_AD_PLATFORM: Campaign has duplicated targeting ad platform.\n - CAMPAIGN_AD_PLATFORMS_SHOULD_BE_SUPERSET_OF_AD_GROUPS: Campaign's targeting ad platforms should be superset of AdGroups'.\n - CAMPAIGN_TYPE_CANNOT_TARGET_MULTIPLE_OSES: Given campaign type cannot target multiple OSes."
    PolicySourcerType:
      type: string
      enum:
      - UNKNOWN_SOURCER
      - SOURCER_TEST_CATALOG_DEPENDENT
      - SOURCER_TEST_CATALOG_INDEPENDENT
