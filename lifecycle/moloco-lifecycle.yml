    scheme: request-header
    header: Moloco-Cloud-Api-Version
    current: v1.10
    default_when_omitted: >-
      the most recent generally available version; during the one month between a new release and the oldest
      version's deprecation the previous version remains the default
    docs: https://developer.moloco.cloud/docs/versioning
