    scheme: uri-path
    current: v1
    docs: https://mcm-docs.moloco.com/docs/campaign-management
deprecation:
  policy_url: https://developer.moloco.cloud/page/release-notes
  policy: >-
    A new version is targeted every 6 months; if no breaking changes accumulate the release may slip another
    6 months. The least recent supported version is deprecated every 6 months, so every version is supported
    for at least 12 months. Users at risk of an upcoming deprecation are notified by email in advance.
  sunset_header: false
  rfc8594: false
  notification_channel: email to registered API users
  in_spec_deprecations:
  - openapi/moloco-commerce-media-management-openapi.yml#Bearer
    - 'securityScheme Bearer is documented as deprecated in favour of the x-api-key scheme'
  - openapi/moloco-commerce-media-management-openapi.yml#RmpManagementApi_CreateCampaign
    - 'the daily_budget field is deprecated; use budget instead'
