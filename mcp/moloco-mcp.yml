note: >-
  Moloco operates two distinct remote MCP servers. The MCM documentation server (mcm-docs.moloco.com/mcp) is
  documented and answers tools/list anonymously — its seven tools are captured verbatim below and in
  mcp/moloco-mcm-docs-mcp-tools.json. The Moloco Cloud server (mcp.moloco.cloud/mcp) was found by probing;
  it is OAuth-protected (RFC 9728 challenge, scope cloudapi.read) and its tools/list is gated, so no tool list
  is asserted for it. The Moloco Ads docs server (developer.moloco.cloud/mcp) exists but rejects anonymous
  tools/list with "Authorization required".
