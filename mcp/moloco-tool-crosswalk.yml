source: mcp/moloco-mcm-docs-mcp-tools.json + openapi/*.yml
note: >-
  Moloco's anonymously reachable MCP server (MCM Documentation) does not expose one tool per REST operation.
  It exposes seven SPEC-LEVEL meta-tools that read the OpenAPI documents and one generic executor
  (execute-request) that can invoke ANY operation in any registered spec via a HAR request object. The
  crosswalk therefore binds tools to the spec surface rather than to individual operationIds, and records the
  fan-out honestly: no operation has a dedicated tool, and every operation is reachable through one.
